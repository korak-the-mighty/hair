  <script>/* src/art/cars.js */
/* Neon Drive — the hero 80s supercar (with driver) and background traffic. */
(function () {
  'use strict';
  const ND = window.ND;
  const { rgb } = ND;

  // ===========================================================================
  // Hero car — white flat-12 wedge with side strakes, facing left.
  // Local coords: 300 x 76, ground contact on row 75.
  // ===========================================================================
  const HW = 300, HH = 76;
  const WHEEL_R = 21;
  const WHEELS = [[66, 54], [246, 54]];

  const TOP = [
    [1, 42], [4, 39.5], [14, 37.6], [34, 35.2], [60, 31.8], [84, 28.6], [100, 26.4], [104, 26],
    [140, 2], [146, 1.2], [196, 1.2], [203, 2.2], [212, 4.6],
    [232, 9.5], [252, 13.4], [272, 15.8], [288, 17.2], [295, 18.6], [298, 21],
  ];

  function topY(x) {
    if (x <= TOP[0][0]) return TOP[0][1];
    for (let i = 1; i < TOP.length; i++) {
      if (x <= TOP[i][0]) {
        const a = TOP[i - 1], b = TOP[i];
        return a[1] + ((x - a[0]) / (b[0] - a[0])) * (b[1] - a[1]);
      }
    }
    return 22;
  }

  function arch(pts, cx, cy, r, sill) {
    const a0 = Math.asin((sill - cy) / r);
    const a1 = -Math.PI - a0;
    const n = 28;
    for (let i = 0; i <= n; i++) {
      const a = a0 + ((a1 - a0) * i) / n;
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
  }

  function bodyPolygon() {
    const pts = TOP.slice();
    pts.push([299, 30], [299, 50], [298, 58], [296, 61.5], [272, 62]);
    arch(pts, WHEELS[1][0], WHEELS[1][1], 24.5, 62);
    pts.push([220, 62], [92, 62]);
    arch(pts, WHEELS[0][0], WHEELS[0][1], 24.5, 62);
    pts.push([40, 62], [8, 61.5], [3, 60], [0.6, 55], [0.4, 46]);
    return pts;
  }

  // Driver: solid profile facing left (forehead, wraparound shades, nose,
  // lips, chin, jaw, ear, neck) with a blond mullet, pastel jacket.
  // Origin placed at car-local (144, 5); rows past the beltline are clipped.
  const DRIVER = [
    '......kkkkkk......',
    '....kkhHHHHhkk....',
    '...khHHHhhhhhhk...',
    '..khHhhhhhhhhhdk..',
    '..khhhhhhhhhhhddk.',
    '.khhhhhhhhhhhhdddk',
    '.kShhhhshhhhhhdddk',
    '..SSSssssshhhhdddk',
    '.GGGGGGGGGehhhdddk',
    '..GgGGssszeehhdddk',
    'SSSSssssszeehhdddk',
    '..SSsssssszzhhdddk',
    '.SSSssssszzzhhdddk',
    '..SSsssszzzzhhddk.',
    '..Ssssszzzzzhhdddk',
    '....zzzzzzzzhhdddk',
    '......nnnnnnhhddk.',
    '......nnnnnhhdddk.',
    '.....cwnnnnbhddk..',
    '...cwbbbbbbbbbbBB.',
    '..cwbbbwbbbbbbbbBB',
  ];
  const DRIVER_PAL = {
    H: rgb('#fff2b0'), h: rgb('#f2c662'), d: rgb('#c48c36'), k: rgb('#7a4e22'),
    S: rgb('#f8c6a6'), s: rgb('#e49c7c'), z: rgb('#b06a54'), e: rgb('#c4705a'), n: rgb('#a8624e'),
    G: rgb('#0c0a14'), g: rgb('#ff7ad8'),
    c: rgb('#e4f2ff'), w: rgb('#ffffff'), b: rgb('#96c2f0'), B: rgb('#5c80bc'),
  };
  const DRIVER_O = [144, 5];

  function genDriver() {
    const w = DRIVER[0].length, h = DRIVER.length;
    const pb = new ND.PB(w, h);
    DRIVER.forEach((row, y) => {
      if (row.length !== w) throw new Error('driver row ' + y + ' has length ' + row.length);
      [...row].forEach((ch, x) => {
        if (ch === '.') return;
        const c = DRIVER_PAL[ch];
        pb.set(x, y, ND.pack(c[0], c[1], c[2]));
      });
    });
    return { c: pb.canvas(), x: DRIVER_O[0], y: DRIVER_O[1] };
  }

  // The driver's arm out of the window: sleeve resting on the door sill,
  // forearm hanging outside, cigarette between the fingers. Frames cover
  // the forearm's swing; the ember is drawn live.
  function genDriverArm() {
    const OX = 128, OY = 19, AW = 30, AH = 32, N = 11;
    const th0 = -0.08, th1 = 0.34;
    const skin = rgb('#e8a282'), skinL = rgb('#f8c6a6'), skinD = rgb('#a8604c');
    const sleeve = rgb('#96c2f0'), sleeveL = rgb('#d4ecff'), sleeveD = rgb('#5c80bc');
    const frames = [];
    for (let f = 0; f < N; f++) {
      const th = th0 + (f / (N - 1)) * (th1 - th0);
      const ux = -Math.sin(th), uy = Math.cos(th);
      const E = [146.2 - OX, 28.4 - OY];
      const Wr = [E[0] + ux * 10.5, E[1] + uy * 10.5];
      const Hd = [Wr[0] + ux * 2.3, Wr[1] + uy * 2.3];
      // forearm + hand silhouette, shaded by exposure (lit from the front/left)
      const arm = new ND.PB(AW, AH);
      const steps = 24;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        arm.disc(E[0] + (Wr[0] - E[0]) * t, E[1] + (Wr[1] - E[1]) * t, 2.05 - t * 0.5, 1);
      }
      arm.disc(Hd[0], Hd[1], 1.95, 1);
      arm.disc(Hd[0] - 0.8, Hd[1] + 1.1, 1.1, 1); // curled fingers
      const pb = new ND.PB(AW, AH);
      for (let y = 0; y < AH; y++)
        for (let x = 0; x < AW; x++) {
          if (!arm.get(x, y)) continue;
          const lf = arm.get(x - 1, y), rt = arm.get(x + 1, y);
          const c = !lf ? skinL : !rt ? skinD : skin;
          pb.set(x, y, ND.pack(c[0], c[1], c[2]));
        }
      // watch band across the wrist
      const px = uy, py = -ux;
      for (let k = -1.6; k <= 1.6; k += 0.5) {
        const wx = Wr[0] - ux * 0.8 + px * k, wy = Wr[1] - uy * 0.8 + py * k;
        pb.set(Math.round(wx), Math.round(wy), ND.pack(...(k < 0 ? [255, 214, 90] : [184, 138, 32])));
      }
      // rolled sleeve resting on the sill (drawn over the elbow)
      const sc = [149 - OX, 25.6 - OY];
      for (let y = -3; y <= 3; y++)
        for (let x = -6; x <= 6; x++) {
          const d = (x * x) / 27 + (y * y) / 8.5;
          if (d > 1) continue;
          let c = x < -2 ? sleeveL : x > 2 ? sleeveD : sleeve;
          if (y >= 2) c = ND.mix(c, sleeveD, 0.5);
          if ((x + 6) % 4 === 1 && y < 2) c = [255, 255, 255];
          pb.set(Math.round(sc[0] + x), Math.round(sc[1] + y), ND.pack(c[0], c[1], c[2]));
        }
      // cuff
      for (let x = -3; x <= 1; x++) pb.set(Math.round(sc[0] + x - 1), Math.round(sc[1] + 2), ND.pack(228, 242, 255));
      // cigarette: filter at the fingers, paper pointing forward and down
      const ca = 0.42 - th * 0.35;
      const dx = -Math.cos(ca), dy = Math.sin(ca);
      const C0 = [Hd[0] - 1.3, Hd[1] + 0.9];
      pb.set(Math.round(C0[0]), Math.round(C0[1]), ND.pack(216, 150, 80));
      for (let k = 1; k <= 4; k++) pb.set(Math.round(C0[0] + dx * k), Math.round(C0[1] + dy * k), ND.pack(246, 242, 232));
      const tip = [OX + C0[0] + dx * 5, OY + C0[1] + dy * 5];
      frames.push({ c: pb.canvas(), tip, th });
    }
    return { frames, ox: OX, oy: OY, th0, th1, N };
  }

  function genHeroCar() {
    const pb = new ND.PB(HW, HH), gl = new ND.PB(HW, HH);
    const poly = bodyPolygon();
    const P = (c) => ND.pack(c[0], c[1], c[2]);

    // ---- underbody shadow between the wheels (we see the dark road under the car)
    for (let y = 60; y < 73; y++)
      for (let x = 30; x < 286; x++) {
        const a = ND.clamp(1 - (y - 60) / 13, 0, 1) * 0.92;
        pb.set(x, y, ND.pack(10, 6, 18, a * 255));
      }

    // ---- body paint
    // bright upper flank, a crisp "horizon" reflection, darker lower flank
    const ramp = [
      [0, rgb('#ffffff')], [0.1, rgb('#f7f4fd')], [0.46, rgb('#e9e4f6')], [0.52, rgb('#dcd6ee')],
      [0.535, rgb('#b9b1d6')], [0.62, rgb('#c4bcdf')], [0.82, rgb('#a69ec6')], [0.93, rgb('#8a82ac')], [1, rgb('#645c86')],
    ];
    const tintTop = rgb('#ffc8ee'), tintLow = rgb('#7fc8ff'), tintWarm = rgb('#ffae8a'), tintMag = rgb('#e89aff');
    pb.polyFn(poly, (x, y) => {
      const ty = topY(x);
      const dt = y - ty;
      let c;
      if (dt < 3.5 && x < 292) {
        // upper surfaces: hood, roof, deck — reflect the pink sky glow
        c = ND.mix(rgb('#fff0fa'), tintTop, 0.3 + (dt / 3.5) * 0.35);
        if (dt < 1) c = rgb('#ffffff');
      } else {
        const t = ND.clamp((y - 24) / 38, 0, 1);
        c = ND.grad(ramp, t);
        // environment tints: pink neon from above-behind, cyan from the street, warm lamps low
        c = ND.mix(c, tintTop, ND.clamp(0.28 - t * 0.5, 0, 0.28) * (0.4 + (x / HW) * 0.6));
        c = ND.mix(c, tintMag, ND.clamp(1 - Math.abs(t - 0.62) * 5, 0, 1) * 0.16);
        c = ND.mix(c, tintLow, ND.clamp((t - 0.55) * 0.9, 0, 0.3) * (1 - (x / HW) * 0.7));
        c = ND.mix(c, tintWarm, ND.clamp((t - 0.6) * 0.6, 0, 0.2) * (x / HW));
        // shoulder crease highlight
        if (Math.abs(dt - 4.5) < 0.6 && (x < 104 || x > 208)) c = ND.mix(c, [255, 255, 255], 0.7);
        if (Math.abs(dt - 5.5) < 0.6 && (x < 104 || x > 208)) c = ND.scale(c, 0.93);
        // front fender / rear haunch curvature: darker as the surface turns away
        const fx = Math.min(1, x / 18), rx = Math.min(1, (HW - x) / 14);
        c = ND.scale(c, 0.82 + 0.18 * Math.min(fx, rx));
      }
      if (y >= 61) c = rgb('#4e4870');
      pb.dset(x, y, c, 255, 6);
    });
    // lower body character line
    for (let x = 12; x < 290; x++) {
      if (x > 40 && x < 92) continue;
      if (x > 220 && x < 272) continue;
      pb.set(x, 57, ND.pack(150, 142, 186));
      pb.set(x, 58, ND.pack(118, 110, 158));
    }

    // tail face (slightly darker vertical plane)
    for (let y = 21; y < 61; y++) {
      pb.dset(298, y, rgb('#b4b0cc'), 255, 6);
      pb.dset(297, y, rgb('#d0cce0'), 255, 6);
    }
    // front bumper face / nose lip
    for (let y = 43; y < 61; y++) pb.dset(0, y, rgb('#bdb9d4'), 255, 6);
    pb.hline(4, 44, 60, P(rgb('#3a3654')));
    pb.hline(3, 42, 61, P(rgb('#24203a')));
    for (let x = 6; x < 38; x += 3) pb.set(x, 58, P(rgb('#5a5678'))); // lower grille slots

    // wheel arch interiors (dark) + lip highlight
    for (const [wx, wy] of WHEELS) {
      pb.discFn(wx, wy, 24.5, (x, y, d) => {
        if (y > 62) return;
        if (d > 0.96) pb.set(x, y, P(rgb('#e8e4f4')));
        else pb.set(x, y, P(d > 0.9 ? rgb('#2a2440') : rgb('#110d1a')));
      });
    }

    // ---- greenhouse
    // windshield seen edge-on: dark glass wedge with neon reflections
    // windshield seen from the side: smooth tinted glass between the rake and
    // the A-pillar, one soft reflection band
    const shield = [[101, 26.6], [104, 26], [140, 2], [146, 1.4], [146, 3.6], [143.5, 3.6], [113.5, 26.6]];
    pb.polyFn(shield, (x, y) => {
      let c = ND.mix(rgb('#30285e'), rgb('#141030'), ND.clamp((y - 2) / 24, 0, 1));
      pb.set(x, y, ND.pack(c[0], c[1], c[2]));
    });
    // frame highlight: the top pixel of each glass column (inside the outline)
    for (let x = 102; x <= 146; x++) {
      for (let y = 0; y < 28; y++) {
        const i = y * HW + x;
        if (pb.d[i] >>> 24 && y >= Math.floor(topY(x)) && ND.clamp(x, 101, 146) === x) {
          const inShield = y > topY(x) - 0.5 && y < topY(x) + 1.5;
          if (inShield) { pb.set(x, y, P(rgb('#eeeaf8'))); break; }
        }
      }
    }
    const glassDoor = [[114.5, 26], [144.5, 4], [172, 4], [172, 26]];
    const glassRear = [[176, 4], [197, 4], [202, 6], [206, 14], [208, 26], [176, 26]];
    pb.polyFn(glassRear, (x, y) => {
      const v = (y - 4) / 22;
      let c = ND.mix(rgb('#3a2f6a'), rgb('#140f28'), v);
      if ((x + y) % 11 < 2) c = ND.mix(c, rgb('#b09ad8'), 0.25);
      pb.set(x, y, ND.pack(c[0], c[1], c[2], 190));
    });
    pb.polyFn(glassDoor, (x, y) => {
      const v = (y - 4) / 22;
      const c = ND.mix(rgb('#2a2250'), rgb('#120e22'), v);
      pb.set(x, y, ND.pack(c[0], c[1], c[2], 165)); // open window: we see through to the far side
    });
    // A-pillar: one slim dark post with a lit leading edge
    pb.lineFn(113, 26, 143, 4, (x, y) => {
      pb.set(x, y, P(rgb('#8e88b0')));
      pb.set(x + 1, y, P(rgb('#1a1628')));
    });
    // B-pillar
    for (let y = 3; y < 27; y++) {
      pb.set(173, y, P(rgb('#1c1830')));
      pb.set(174, y, P(rgb('#2c2842')));
      pb.set(175, y, P(rgb('#48446a')));
    }
    // window frame / beltline rubber
    pb.hline(106, 208, 26, P(rgb('#1e1a2e')));
    pb.hline(106, 208, 27, P(rgb('#fdfbff')));
    // roof edge
    pb.hline(139, 200, 3, P(rgb('#cfc8e4')));
    // fuel filler on the buttress
    pb.discFn(216, 15, 4.2, (x, y, d) => { if (d > 0.72) pb.set(x, y, P(rgb('#b8b2d0'))); });
    pb.set(213, 13, P(rgb('#ffffff')));

    // ---- interior visible through the open window
    // steering wheel + dash
    // steering wheel rim and dash, inside the cabin behind the A-pillar
    pb.thick(136, 13, 138, 23, 0.9, P(rgb('#0e0a16')));
    pb.thick(121, 23, 140, 21, 1.1, P(rgb('#16121e')));
    // seat back / headrest
    for (let y = 6; y < 26; y++) for (let x = 162; x < 171; x++) {
      if (y < 9 && (x < 164 || x > 168)) continue;
      pb.set(x, y, P(x === 162 ? rgb('#3a3450') : rgb('#1a1626')));
    }

    // ---- side strakes
    for (let i = 0; i < 7; i++) {
      const y = 35 + i * 3;
      const xs = Math.round(111 + i * 0.6), xe = Math.round(196 - i * 0.4);
      for (let x = xs; x <= xe; x++) {
        const intake = x > 176;
        pb.set(x, y, P(intake ? rgb('#f2f0f8') : rgb('#ffffff')));
        pb.set(x, y + 1, P(intake ? rgb('#8e8aaa') : rgb('#d6d2e6')));
        if (x > xs) pb.set(x, y + 2, P(intake ? rgb('#0e0b16') : rgb('#6a6688')));
      }
      pb.set(xe + 1, y + 1, P(rgb('#b0acc8')));
    }
    // door shut lines
    pb.lineFn(105, 28, 107, 60, (x, y) => pb.set(x, y, P(rgb('#9894b4'))));
    for (let y = 28; y < 60; y++) if (y < 35 || y > 56) pb.set(173, y, P(rgb('#9894b4')));

    // ---- side mirror on the A-pillar
    pb.line(122, 19, 124, 19, P(rgb('#2a2440')));
    pb.polyFn([[115, 15.5], [120.5, 15], [122.5, 16.5], [122, 20.5], [116, 20.5], [114.5, 19]], (x, y) => {
      const c = y < 17 ? rgb('#ffffff') : y < 19 ? rgb('#e6e2f2') : rgb('#b4aed0');
      pb.set(x, y, P(c));
    });
    pb.hline(116, 121, 21, P(rgb('#4a4470')));

    // ---- lights
    const amber = rgb('#ffa21e'), red = rgb('#ff2438');
    for (let y = 45; y <= 48; y++) for (let x = 1; x <= 6; x++) { pb.set(x, y, P(ND.mix(amber, [255, 240, 200], x < 3 ? 0.4 : 0))); gl.set(x, y, ND.pack(255, 150, 30)); }
    for (let x = 28; x <= 33; x++) { pb.set(x, 46, P(amber)); pb.set(x, 47, P(ND.scale(amber, 0.75))); gl.set(x, 46, ND.pack(200, 110, 20)); }
    for (let y = 27; y <= 41; y++) for (let x = 293; x <= 298; x++) {
      const louvre = (y - 27) % 3 === 2;
      const c = louvre ? ND.scale(red, 0.35) : ND.mix(red, [255, 200, 200], x > 296 ? 0.3 : 0);
      pb.set(x, y, P(c));
      if (!louvre) gl.set(x, y, ND.pack(255, 30, 50));
    }
    for (let x = 277; x <= 282; x++) { pb.set(x, 44, P(red)); gl.set(x, 44, ND.pack(200, 20, 40)); }

    const body = ND.sprite(pb, gl);
    body.glowPts = { tail: [296, 34], front: [3, 46] };

    // Paint mask for live environment reflections: strongest on the upper
    // flank above the paint's horizon line, faint on the lower flank.
    const mask = new ND.PB(HW, HH);
    mask.polyFn(poly, (x, y) => {
      if (y > 60) return;
      const dt = y - topY(x);
      const a = dt < 3.5 ? 0.2 : y < 44 ? 0.3 : 0.55 + ND.clamp((y - 44) / 14, 0, 1) * 0.45;
      mask.set(x, y, ND.pack(255, 255, 255, a * 255));
    });
    for (const g of [shield, glassDoor, glassRear]) mask.polyFn(g, (x, y) => mask.set(x, y, 0));
    for (const [wx, wy] of WHEELS) mask.discFn(wx, wy, 24.5, (x, y) => { if (y <= 62) mask.set(x, y, 0); });
    mask.rect(176, 34, 24, 24, 0);
    mask.rect(0, 44, 8, 6, 0);
    mask.rect(290, 25, 10, 20, 0);
    body.mask = mask.canvas();
    return body;
  }

  // Five-spoke star rims with motion blur; 12 frames cover 72 degrees.
  function genWheelFrames(R = WHEEL_R, spokes = 5, blur = 0.2) {
    const S = R * 2 + 1;
    const frames = [];
    const nF = 12;
    const period = (Math.PI * 2) / spokes;
    for (let f = 0; f < nF; f++) {
      const pb = new ND.PB(S, S);
      const th = (f / nF) * period;
      for (let y = 0; y < S; y++)
        for (let x = 0; x < S; x++) {
          const dx = x - R, dy = y - R;
          const d = Math.hypot(dx, dy);
          if (d > R + 0.4) continue;
          const ang = Math.atan2(dy, dx);
          const light = 0.5 - 0.5 * Math.cos(ang + Math.PI * 0.75); // lit from upper-left
          let c;
          const rr = d / R;
          if (rr > 0.9) {
            c = ND.mix(rgb('#100c16'), rgb('#3a344c'), Math.pow(light, 3) * 0.9);
          } else if (rr > 0.71) {
            c = ND.mix(rgb('#1a1524'), rgb('#2c2638'), light * 0.8);
            if (rr > 0.86 && rr < 0.9) c = ND.mix(c, rgb('#3c364e'), 0.5);
          } else if (rr > 0.66) {
            c = ND.mix(rgb('#7a7a92'), rgb('#f0f0fa'), light);
          } else {
            // rim face: spokes with motion blur
            let cover = 0;
            const samples = 4;
            for (let k = 0; k < samples; k++) {
              const a = ang - th - (k / samples) * blur; // trail lies behind a counter-clockwise spin
              let m = ((a % period) + period) % period;
              if (m > period / 2) m -= period;
              const halfW = (2.9 - d * 0.07) / Math.max(1.5, d);
              if (Math.abs(m) < halfW + 0.02 && d > 3) cover++;
            }
            cover /= samples;
            let gap = rgb('#1c1828');
            if (d > 7 && d < 12.5) gap = ND.mix(rgb('#3c3850'), rgb('#56526a'), light * 0.5); // brake disc
            if (d > 8 && d < 12.5 && ang > -1.0 && ang < -0.2) gap = rgb('#2a2636'); // caliper (fixed)
            const spoke = ND.mix(rgb('#8c8ca4'), rgb('#e6e6f2'), light);
            c = ND.mix(gap, spoke, cover);
            if (d <= 4.6) c = ND.mix(rgb('#8c8ca4'), rgb('#dcdcea'), light);
            if (d <= 2.6) c = rgb('#f2c230');
            if (d <= 1.0) c = rgb('#3a2a10');
          }
          pb.set(x, y, ND.pack(c[0], c[1], c[2]));
        }
      frames.push(pb.canvas());
    }
    return { frames, R, S, period };
  }

  // ===========================================================================
  // Traffic — boxy 80s cars at background-lane scale, facing left.
  // ===========================================================================
  const TW = 162, TH = 48, TG = 47;
  const PROFILES = {
    sedan: {
      top: [[0, 27], [3, 22], [16, 20], [40, 18.5], [50, 17.5], [60, 8], [64, 6.5], [100, 6.5], [106, 8], [116, 17.5], [146, 18.5], [157, 19.5], [160, 22]],
      windows: [[[53, 17], [62, 9], [80, 9], [80, 17]], [[83, 9], [99, 9], [104, 11], [112, 17], [83, 17]]],
    },
    coupe: {
      top: [[0, 26], [3, 21.5], [20, 19.5], [46, 18], [60, 9], [66, 7], [92, 7], [122, 14.5], [150, 17.5], [158, 19], [160, 22]],
      windows: [[[53, 17], [62, 10], [84, 9], [84, 17]], [[87, 9], [92, 9], [114, 15.5], [87, 16]]],
    },
    wagon: {
      top: [[0, 27], [3, 22], [16, 20], [40, 18.5], [50, 17.5], [60, 8], [64, 6.5], [146, 6.5], [152, 9], [156, 18.5], [160, 22]],
      windows: [[[53, 17], [62, 9], [80, 9], [80, 17]], [[83, 9], [110, 9], [110, 17], [83, 17]], [[113, 9], [144, 9], [148, 12], [150, 17], [113, 17]]],
    },
  };
  const TRAFFIC_COLS = [rgb('#7a1424'), rgb('#b8bccc'), rgb('#1a1822'), rgb('#1c2a58'), rgb('#1a7078'), rgb('#24483a'), rgb('#5a1a3a'), rgb('#b08a48'), rgb('#3a1a60')];

  function trafficTop(top, x) {
    if (x <= top[0][0]) return top[0][1];
    for (let i = 1; i < top.length; i++) {
      if (x <= top[i][0]) {
        const a = top[i - 1], b = top[i];
        return a[1] + ((x - a[0]) / (b[0] - a[0])) * (b[1] - a[1]);
      }
    }
    return 22;
  }

  function genTraffic(seed, opts = {}) {
    const r = ND.rng(seed);
    const kind = opts.kind || r.pick(['sedan', 'sedan', 'coupe', 'wagon', 'coupe']);
    const special = opts.special || (r.chance(0.08) ? 'taxi' : r.chance(0.05) ? 'police' : null);
    const prof = PROFILES[special ? 'sedan' : kind];
    let base = opts.color || (special === 'taxi' ? rgb('#f0b818') : special === 'police' ? rgb('#16161e') : r.pick(TRAFFIC_COLS));
    const pb = new ND.PB(TW, TH), gl = new ND.PB(TW, TH);
    const P = (c) => ND.pack(c[0], c[1], c[2]);
    const wheels = [[32, 37], [128, 37]];
    const pts = prof.top.slice();
    pts.push([160, 32], [158, 37], [142, 37.5]);
    arch(pts, 128, 37, 12.5, 37.5);
    pts.push([114, 37.5], [46, 37.5]);
    arch(pts, 32, 37, 12.5, 37.5);
    pts.push([18, 37.5], [2, 37], [0, 33]);
    pb.polyFn(pts, (x, y) => {
      const ty = trafficTop(prof.top, x);
      const dt = y - ty;
      let c;
      if (dt < 1.2) c = ND.mix(ND.scale(base, 1.5), [255, 200, 240], 0.35);
      else {
        const t = ND.clamp((y - 17) / 21, 0, 1);
        c = ND.scale(base, 1.18 - t * 0.62);
        c = ND.mix(c, [255, 120, 220], 0.08 * (1 - t));
      }
      if (special === 'police' && y > 19 && y < 31 && x > 50 && x < 112) c = ND.scale(rgb('#e8e8f0'), 1.05 - (y - 19) / 40);
      pb.dset(x, y, c, 255, 8);
    });
    // chrome trim + bumpers
    pb.hline(4, 156, 29, P(ND.mix(base, [220, 220, 240], 0.5)));
    for (let y = 26; y < 35; y++) { pb.set(0, y, P(rgb('#9a9ab0'))); pb.set(1, y, P(rgb('#c8c8d8'))); pb.set(159, y, P(rgb('#9a9ab0'))); pb.set(160, y, P(rgb('#6a6a80'))); }
    pb.hline(2, 158, 37, P(rgb('#221c2c')));
    // arches
    for (const [wx, wy] of wheels) pb.discFn(wx, wy, 12.5, (x, y, d) => { if (y <= 37) pb.set(x, y, P(d > 0.9 ? ND.scale(base, 0.5) : rgb('#0e0a14'))); });
    // windows with occupants
    const occupants = r.int(1, 2);
    prof.windows.forEach((w, wi) => {
      pb.polyFn(w, (x, y) => {
        const v = (y - 8) / 10;
        let c = ND.mix(rgb('#3a3068'), rgb('#120e24'), v);
        if ((x + y * 2) % 17 < 2) c = ND.mix(c, rgb('#a898d8'), 0.3);
        pb.set(x, y, P(c));
      });
      if (wi < occupants) {
        const hx = wi === 0 ? 70 : 92, hy = 12;
        pb.disc(hx, hy, 2.6, P(rgb('#241a2a')));
        pb.rect(hx - 3, hy + 2, 7, 4, P(rgb('#1e1624')));
      }
    });
    // pillars
    for (let y = 8; y < 18; y++) { pb.set(81, y, P(ND.scale(base, 0.45))); pb.set(82, y, P(ND.scale(base, 0.6))); }
    // lights
    for (let y = 21; y <= 27; y++) for (let x = 155; x <= 160; x++) {
      const c = rgb('#ff2a3c');
      pb.set(x, y, P(y === 24 ? ND.scale(c, 0.6) : c));
      gl.set(x, y, ND.pack(255, 30, 50));
    }
    for (let y = 22; y <= 26; y++) for (let x = 0; x <= 2; x++) {
      pb.set(x, y, P(rgb('#fff6d8')));
      gl.set(x, y, ND.pack(255, 240, 200));
    }
    pb.set(5, 27, P(rgb('#ffa21e'))); gl.set(5, 27, ND.pack(200, 120, 20));
    // taxi sign / police bar
    let bar = null;
    if (special === 'taxi') {
      pb.rect(74, 2, 14, 5, P(rgb('#ffe890')));
      for (let x = 74; x < 88; x++) for (let y = 2; y < 7; y++) gl.set(x, y, ND.pack(200, 170, 70));
      const mk = ND.textMask('TAXI', { small: true, gap: 0 });
      for (let y = 0; y < mk.h; y++) for (let x = 0; x < mk.w; x++) if (mk.m[y * mk.w + x] && y < 5) pb.set(75 + x, 2 + y, P(rgb('#402808')));
    }
    if (special === 'police') {
      pb.rect(72, 3, 20, 3, P(rgb('#2a2a3a')));
      bar = { x: 72, y: 3, w: 20 };
    }
    // wheels (4 frames of a simple hubcap)
    const wheelFrames = [];
    for (let f = 0; f < 4; f++) {
      const w = new ND.PB(21, 21);
      for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
        const d = Math.hypot(x - 10, y - 10), a = Math.atan2(y - 10, x - 10);
        if (d > 10.4) continue;
        let c = d > 6.2 ? rgb('#141018') : ND.mix(rgb('#6a6a84'), rgb('#c8c8dc'), 0.5 - 0.5 * Math.cos(a + 2.3));
        if (d <= 6.2 && d > 3 && Math.cos((a - (f / 4) * (Math.PI / 2)) * 4) > 0.7) c = rgb('#3a3a50');
        if (d <= 1.4) c = rgb('#2a2a3a');
        w.set(x, y, P(c));
      }
      wheelFrames.push(w.canvas());
    }
    return {
      body: ND.sprite(pb, gl),
      wheels,
      wheelFrames,
      bar,
      w: TW,
      h: TH,
      ground: TG,
      special,
    };
  }

  // Door window glass (rolled up in the rain): tint, highlights, raindrops.
  function genWindowGlass(seed) {
    const r = ND.rng(seed);
    const poly = [[114.5, 26], [144.5, 4], [172, 4], [172, 26]];
    const pb = new ND.PB(HW, 28);
    pb.polyFn(poly, (x, y) => {
      let a = 60, c = [150, 140, 215];
      const s = x + y * 1.3;
      if (s % 23 < 3) { a = 125; c = [235, 225, 255]; }
      else if (s % 23 < 5) { a = 90; c = [255, 150, 230]; }
      pb.set(x, y, ND.pack(c[0], c[1], c[2], a));
    });
    for (let i = 0; i < 11; i++) {
      const x = r.int(122, 170), y = r.int(7, 22);
      if (!pb.alpha(x, y)) continue;
      pb.set(x, y, ND.pack(235, 230, 255, 150));
      for (let k = 1; k < r.int(2, 4); k++) if (pb.alpha(x, y + k)) pb.set(x, y + k, ND.pack(200, 195, 240, 90));
    }
    return pb.canvas();
  }

  ND.genHeroCar = genHeroCar;
  ND.genWindowGlass = genWindowGlass;
  ND.genDriver = genDriver;
  ND.genDriverArm = genDriverArm;
  ND.genWheelFrames = genWheelFrames;
  ND.genTraffic = genTraffic;
  ND.HERO = { W: HW, H: HH, WHEELS, WHEEL_R, topY };
})();

  <script>/* src/art/props.js */
/* Neon Drive — street furniture: lamps, planters, foreground foliage, light pools. */
(function () {
  'use strict';
  const ND = window.ND;
  const { rgb } = ND;

  // Street lamp. type 'globe' (Deco post) or 'cobra' (arm over the street).
  function genLamp(seed, type) {
    const r = ND.rng(seed);
    type = type || (r.chance(0.6) ? 'globe' : 'cobra');
    const h = r.int(112, 124);
    const w = type === 'cobra' ? 22 : 11;
    const pb = new ND.PB(w, h + 4), gl = new ND.PB(w, h + 4);
    const P = (c) => ND.pack(c[0], c[1], c[2]);
    const pole = rgb('#1e1630'), poleL = rgb('#3a2a52'), poleR = rgb('#130d1e');
    const px = type === 'cobra' ? w - 5 : 4;
    for (let y = 8; y < h + 4; y++) {
      pb.set(px, y, P(poleL));
      pb.set(px + 1, y, P(pole));
      pb.set(px + 2, y, P(poleR));
    }
    // base
    for (let y = h - 2; y < h + 4; y++) for (let x = px - 1; x <= px + 3; x++) pb.set(x, y, P(x === px - 1 ? poleL : pole));
    let light;
    if (type === 'globe') {
      // collar + globe
      pb.hline(px - 1, px + 3, 9, P(poleL));
      pb.hline(px - 1, px + 3, 10, P(pole));
      const gx = px + 1, gy = 4;
      pb.discFn(gx, gy, 3.6, (x, y, d) => {
        const c = ND.mix(rgb('#fffbe8'), rgb('#ffb454'), Math.pow(d, 1.5));
        pb.set(x, y, P(c));
        gl.set(x, y, ND.pack(255, 200 - d * 60, 120 - d * 80));
      });
      light = [gx, gy];
    } else {
      // curved arm to the left with a cobra head
      const pts = [];
      for (let i = 0; i <= 10; i++) {
        const t = i / 10;
        pts.push([px + 1 - t * 14, 10 - Math.sin(t * Math.PI * 0.5) * 6]);
      }
      for (let i = 0; i + 1 < pts.length; i++) pb.line(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], P(poleL));
      const hx = Math.round(pts[10][0]), hy = Math.round(pts[10][1]);
      pb.rect(hx - 4, hy - 1, 8, 3, P(pole));
      pb.hline(hx - 4, hx + 3, hy - 1, P(poleL));
      for (let x = hx - 3; x <= hx + 2; x++) {
        pb.set(x, hy + 2, P(rgb('#fff0c0')));
        gl.set(x, hy + 2, ND.pack(255, 200, 110));
      }
      light = [hx, hy + 2];
    }
    return { spr: ND.sprite(pb, gl), w, h: h + 4, baseX: px + 1, light, type };
  }

  // Concrete planter with a lit tropical plant.
  function genPlanter(seed) {
    const r = ND.rng(seed);
    const w = r.int(26, 36), bh = r.int(12, 15);
    const plant = ND.genPlant(seed * 7 + 1, true);
    const H = bh + 34;
    const pb = new ND.PB(w + 8, H);
    const P = (c) => ND.pack(c[0], c[1], c[2]);
    for (let y = H - bh; y < H; y++)
      for (let x = 4; x < w + 4; x++) {
        let c = ND.mix(rgb('#b88aa0'), rgb('#5a3a5c'), (y - (H - bh)) / bh);
        if (y === H - bh) c = rgb('#e8c0c8');
        if (x === 4) c = ND.scale(c, 0.8);
        pb.dset(x, y, c, 255, 10);
      }
    const cv = pb.canvas();
    const ctx = cv.getContext('2d');
    ctx.drawImage(plant, Math.round((w + 8) / 2 - 22), H - bh - 40);
    ctx.drawImage(plant, Math.round((w + 8) / 2 - 22) + (r.chance(0.5) ? 6 : -6), H - bh - 36);
    return { c: cv, w: w + 8, h: H };
  }

  // Foreground foliage, authored at half resolution for a defocused look:
  // broad tropical leaves (banana / bird-of-paradise / palmetto) in silhouette,
  // their upper edges catching neon.
  function genBush(seed) {
    const r = ND.rng(seed);
    const w = r.int(70, 120), h = r.int(30, 46);
    const pb = new ND.PB(w, h);
    const fill = rgb('#0b0714'), fill2 = rgb('#120b1e');
    const rim = r.pick([rgb('#b43a8a'), rgb('#7a44c0'), rgb('#d04a78'), rgb('#4a6ad0')]);
    const vein = r.pick([rgb('#3a1440'), rgb('#26164a'), rgb('#44162e')]);
    const n = r.int(6, 11);
    const leaves = [];
    for (let i = 0; i < n; i++) {
      leaves.push({
        bx: r.range(w * 0.2, w * 0.8),
        ang: -Math.PI / 2 + r.range(-1.15, 1.15),
        L: r.range(h * 0.55, h * 1.1),
        W: r.chance(0.6) ? r.range(3.5, 6.5) : r.range(1.5, 2.5),
        droop: r.range(0.1, 0.6),
      });
    }
    leaves.sort((p, q) => q.L - p.L);
    for (const lf of leaves) {
      const pts = [];
      const N = 18;
      const P = (t) => {
        const x = lf.bx + Math.cos(lf.ang) * lf.L * t;
        const y = h - 1 + Math.sin(lf.ang) * lf.L * t + lf.droop * lf.L * t * t;
        return [x, y];
      };
      const side = [];
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        const [x, y] = P(t);
        const [x2, y2] = P(Math.min(1, t + 0.02));
        let tx = x2 - x, ty = y2 - y;
        const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
        const ww = lf.W * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.05)), 0.7);
        pts.push([x - ty * ww, y + tx * ww]);
        side.push([x + ty * ww, y - tx * ww]);
      }
      const poly = pts.concat(side.reverse());
      pb.polyFn(poly, (x, y) => pb.set(x, y, ND.pack(...(ND.hash(x, y, seed) < 0.5 ? fill : fill2))));
      // rim on the upper edge and a midrib
      const upper = Math.sin(lf.ang) < 0 ? (Math.cos(lf.ang) < 0 ? pts : side) : pts;
      for (let i = 1; i < upper.length - 1; i++) {
        const [x, y] = upper[i];
        pb.set(Math.round(x), Math.round(y), ND.pack(...ND.mix(fill2, rim, 0.45 + 0.4 * (i / upper.length))));
      }
      if (lf.W > 3) for (let i = 1; i < N; i++) { const [x, y] = P(i / N); pb.set(Math.round(x), Math.round(y), ND.pack(...vein)); }
    }
    return pb.canvas();
  }

  // Soft pool of light for the ground (dithered ellipse).
  function genPool(w, h, color, strength) {
    const pb = new ND.PB(w, h);
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        const dx = (x - w / 2 + 0.5) / (w / 2), dy = (y - h / 2 + 0.5) / (h / 2);
        const d = dx * dx + dy * dy;
        if (d >= 1) continue;
        const a = Math.pow(1 - d, 1.6) * strength;
        const q = Math.floor(a * 12 + ND.bayer(x, y)) / 12;
        if (q > 0) pb.set(x, y, ND.pack(color[0] * q, color[1] * q, color[2] * q));
      }
    return pb.canvas();
  }

  // Vertical fade used for storefront spill on the sidewalk.
  function genSpill(color) {
    const w = 32, h = 26;
    const pb = new ND.PB(w, h);
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        const ex = Math.min(1, Math.min(x + 1, w - x) / 6);
        const a = Math.pow(1 - y / h, 1.4) * ex * 0.55;
        const q = Math.floor(a * 12 + ND.bayer(x, y)) / 12;
        if (q > 0) pb.set(x, y, ND.pack(color[0] * q, color[1] * q, color[2] * q));
      }
    return pb.canvas();
  }

  // Glow halo sprite (for lamps) into the emissive buffer.
  function genHaloGlow(R, color, k) {
    const S = R * 2;
    const pb = new ND.PB(S, S);
    for (let y = 0; y < S; y++)
      for (let x = 0; x < S; x++) {
        const d = Math.hypot(x - R + 0.5, y - R + 0.5) / R;
        if (d >= 1) continue;
        const a = Math.pow(1 - d, 2.4) * k;
        pb.set(x, y, ND.pack(color[0] * a, color[1] * a, color[2] * a));
      }
    return pb.canvas();
  }

  // Vignette (multiply-style darkening) for the final frame.
  function genVignette(W, H) {
    const pb = new ND.PB(W, H);
    for (let y = 0; y < H; y++)
      for (let x = 0; x < W; x++) {
        const dx = (x - W / 2) / (W / 2), dy = (y - H / 2) / (H / 2);
        const d = Math.sqrt(dx * dx * 0.8 + dy * dy);
        const a = ND.clamp((d - 0.65) * 0.55, 0, 0.5);
        const q = Math.floor(a * 16 + ND.bayer(x, y)) / 16;
        if (q > 0) pb.set(x, y, ND.pack(8, 2, 16, q * 255));
      }
    return pb.canvas();
  }

  ND.genLamp = genLamp;
  ND.genPlanter = genPlanter;
  ND.genBush = genBush;
  ND.genPool = genPool;
  ND.genSpill = genSpill;
  ND.genHaloGlow = genHaloGlow;
  ND.genVignette = genVignette;
})();

</script>

/* Neon Drive — weather: a slow director cycling clear/drizzle/rain/storm/mist,
 * light-catching rain in three depths, road splashes and ripple rings,
 * lightning with fractal bolts, and drifting ground mist. */
(function () {
  'use strict';
  const ND = window.ND;
  const { W, H, CX, Y, SPEED } = ND;

  // Tiny event bus (the soundtrack listens to lightning, weather changes...)
  const handlers = {};
  ND.bus = {
    on(ev, fn) { (handlers[ev] = handlers[ev] || []).push(fn); },
    emit(ev, data) { (handlers[ev] || []).forEach((fn) => { try { fn(data); } catch (e) { console.error(e); } }); },
  };

  // ---------------------------------------------------------------------------
  // Director
  // ---------------------------------------------------------------------------
  const PHASES = {
    clear: { rain: 0, storm: 0, fog: 0.12, cloud: 0.22, dur: [70, 150] },
    drizzle: { rain: 0.3, storm: 0, fog: 0.24, cloud: 0.55, dur: [45, 90] },
    rain: { rain: 0.68, storm: 0, fog: 0.3, cloud: 0.8, dur: [60, 130] },
    storm: { rain: 1.0, storm: 1, fog: 0.36, cloud: 1.0, dur: [50, 100] },
    mist: { rain: 0.04, storm: 0, fog: 0.62, cloud: 0.45, dur: [40, 75] },
  };
  const ORDER = ['clear', 'drizzle', 'rain', 'storm', 'mist'];

  class Weather {
    constructor(seed, lock) {
      this.r = ND.rng(seed);
      this.lock = lock && PHASES[lock] ? lock : null;
      this.v = { rain: 0, storm: 0, fog: 0.12, cloud: 0.22 };
      this.queue = [];
      this.flash = 0;
      this.bolt = null;
      this.boost = 0;
      if (this.lock) {
        this.setPhase(this.lock, Infinity);
        Object.assign(this.v, PHASES[this.lock]);
      } else {
        this.setPhase('clear', this.r.range(35, 55)); // open on the reference look: wet, just after rain
      }
    }
    plan() {
      const r = this.r;
      const q = ['drizzle', 'rain'];
      if (r() < 0.65) q.push('storm', 'rain');
      q.push('drizzle');
      if (r() < 0.6) q.push('mist');
      q.push('clear');
      this.queue.push(...q);
    }
    setPhase(name, secs) {
      this.phase = name;
      this.target = PHASES[name];
      const d = this.target.dur;
      this.left = (secs != null ? secs : this.r.range(d[0], d[1])) * 60;
      ND.bus.emit('weather', { phase: name });
    }
    next() {
      if (!this.queue.length) this.plan();
      this.setPhase(this.queue.shift());
    }
    // Manual override (W key): jump to the next phase in a fixed order.
    cycle() {
      const i = ORDER.indexOf(this.phase);
      this.queue.length = 0;
      this.setPhase(ORDER[(i + 1) % ORDER.length], this.lock ? Infinity : undefined);
      if (this.lock) this.lock = this.phase;
    }
    update() {
      if (!this.lock && --this.left <= 0) this.next();
      const k = 1 / (60 * 7);
      for (const key of ['rain', 'storm', 'fog', 'cloud']) this.v[key] += (this.target[key] - this.v[key]) * k;
      // lightning
      if (!this.bolt && this.v.storm > 0.35 && this.r() < 0.004 * this.v.storm) this.strike();
      if (this.bolt) {
        const b = this.bolt;
        b.t++;
        this.flash = (b.pattern[b.t] || 0) * b.intensity;
        if (b.t >= b.pattern.length) this.bolt = null;
      } else this.flash = 0;
      this.boost = Math.max(0, this.boost - 1 / 45);
    }
    strike() {
      const r = this.r;
      const intensity = r.range(0.45, 1);
      const pattern = [];
      const n = r.int(2, 4);
      for (let i = 0; i < n; i++) {
        const peak = i === 0 ? 1 : r.range(0.4, 0.95);
        pattern.push(peak, peak * 0.9, peak * 0.35);
        const gap = r.int(1, 4);
        for (let g = 0; g < gap; g++) pattern.push(r.range(0.02, 0.12));
      }
      for (let i = 0; i < 16; i++) pattern.push(0.25 * Math.pow(0.78, i));
      const x = r.int(30, W - 110);
      const showBolt = r() < 0.7;
      this.bolt = { t: 0, pattern, intensity, x, img: showBolt ? genBolt(r.int(1, 1e9)) : null };
      this.boost = 1;
      ND.bus.emit('lightning', { intensity, x, near: intensity > 0.8 });
    }
  }

  // Fractal lightning bolt sprite (colour + glow).
  function genBolt(seed) {
    const r = ND.rng(seed);
    const w = 90, h = 170;
    const pb = new ND.PB(w, h), gl = new ND.PB(w, h);
    const seg = (x0, y0, x1, y1, d, width) => {
      if (d <= 0 || Math.hypot(x1 - x0, y1 - y0) < 4) {
        pb.lineFn(x0, y0, x1, y1, (x, y) => {
          pb.set(x, y, ND.pack(250, 246, 255));
          if (width > 1) pb.set(x + 1, y, ND.pack(210, 200, 255));
          gl.set(x, y, ND.pack(220, 210, 255));
          gl.set(x - 1, y, ND.pack(120, 110, 220));
          gl.set(x + 1, y, ND.pack(120, 110, 220));
        });
        return;
      }
      const mx = (x0 + x1) / 2 + r.range(-1, 1) * Math.abs(y1 - y0) * 0.28;
      const my = (y0 + y1) / 2 + r.range(-2, 2);
      seg(x0, y0, mx, my, d - 1, width);
      seg(mx, my, x1, y1, d - 1, width);
      if (d > 2 && r() < 0.28) {
        const bx = mx + r.range(-30, 30), by = my + r.range(15, 45);
        seg(mx, my, ND.clamp(bx, 2, w - 3), Math.min(h - 2, by), d - 2, 1);
      }
    };
    seg(w / 2 + r.range(-10, 10), 0, w / 2 + r.range(-25, 25), r.range(120, h - 4), 6, 2);
    return ND.sprite(pb, gl);
  }

  // ---------------------------------------------------------------------------
  // Rain: three depth layers of motion-blurred streaks. Rain falls straight in
  // the world, so our leftward motion slants it by each layer's parallax.
  // ---------------------------------------------------------------------------
  // Far and mid rain are scrolling, seamlessly tiling sheets (3 densities
  // each, stacked as the rain gets heavier); near rain is individual drops.
  const LAYERS = [
    { f: 0.3, sheet: 110, len: 5, fall: 7, a: 0.5 },
    { f: 0.8, sheet: 70, len: 10, fall: 11, a: 0.7 },
    { f: 1.7, max: 70, len: 19, fall: 17, a: 0.95, floor: [300, 390] },
  ];

  function rainSheet(seed, n, dx, dy, len) {
    const r = ND.rng(seed);
    const pb = new ND.PB(W, H);
    const nrm = Math.hypot(dx, dy), ux = dx / nrm, uy = dy / nrm;
    for (let i = 0; i < n; i++) {
      const x0 = r() * W, y0 = r() * H, L = len + r.int(-2, 2);
      for (let k = 0; k <= L; k++) {
        const t = k / L;
        const x = ((Math.round(x0 + ux * k) % W) + W) % W, y = ((Math.round(y0 + uy * k) % H) + H) % H;
        pb.set(x, y, ND.pack(255, 255, 255, (0.15 + 0.85 * t) * 255));
      }
    }
    return pb.canvas();
  }

  function streakSprite(dx, dy, len) {
    const n = Math.hypot(dx, dy);
    const ux = dx / n, uy = dy / n;
    const ex = ux * len, ey = uy * len;
    const w = Math.ceil(Math.abs(ex)) + 2, h = Math.ceil(ey) + 2;
    const pb = new ND.PB(w, h);
    const x0 = ex < 0 ? w - 1 : 0;
    pb.lineFn(x0, 0, x0 + ex, ey, (x, y, t) => {
      const a = 0.15 + 0.85 * t;
      pb.set(x, y, ND.pack(255, 255, 255, a * 255));
    });
    return { c: pb.canvas(), ox: x0 + ex, oy: ey };
  }

  class Rain {
    constructor(seed) {
      this.r = ND.rng(seed);
      this.layers = LAYERS.map((L, li) => {
        const vx = L.f * SPEED;
        return {
          ...L,
          vx,
          vy: L.fall,
          sprites: [streakSprite(vx, L.fall, L.len), streakSprite(vx, L.fall, L.len - 2), streakSprite(vx, L.fall, L.len + 2)],
          sheets: L.sheet ? [0, 1, 2].map((k) => rainSheet(seed * 7 + li * 31 + k, L.sheet, vx, L.fall, L.len)) : null,
          p: [],
        };
      });
      this.splashes = [];
      this.carHits = [];
    }
    spawn(L, top) {
      const r = this.r;
      const slope = L.vx / L.vy;
      return {
        x: r.range(-slope * H - 20, W + 10),
        y: top ? r.range(-40, -2) : r.range(-40, H),
        floor: r.range(L.floor[0], L.floor[1]),
        s: r.int(0, 2),
      };
    }
    update(w, D) {
      const rain = w.v.rain;
      for (const L of this.layers) {
        if (L.sheets) continue;
        const want = Math.floor(L.max * rain);
        while (L.p.length < want) L.p.push(this.spawn(L, false));
        for (let i = L.p.length - 1; i >= 0; i--) {
          const p = L.p[i];
          p.x += L.vx;
          p.y += L.vy;
          if (p.y > p.floor) {
            if (L.p.length > want) { L.p.splice(i, 1); continue; }
            Object.assign(p, this.spawn(L, true));
          }
        }
      }
      // splashes / ripple rings on the wet ground
      const r = this.r;
      const n = rain * 7;
      for (let k = 0; k < Math.floor(n) + (r() < n % 1 ? 1 : 0); k++) {
        const onWalk = r() < 0.18;
        const y = onWalk ? r.int(Y.BUILD + 3, Y.CURB - 1) : r.int(Y.CURB + 4, H + 6);
        const f = ND.fAt(y);
        const x = r.range(-10, W + 10);
        this.splashes.push({ P: D - (x - CX) / f, y, f, age: 0, life: r.int(12, 20), crown: r() < 0.6 });
      }
      for (const s of this.splashes) s.age++;
      this.splashes = this.splashes.filter((s) => s.age < s.life);
      // raindrops hitting the hero car's roof, hood and deck
      const m = rain * 1.6;
      for (let k = 0; k < Math.floor(m) + (r() < m % 1 ? 1 : 0); k++) this.carHits.push({ u: r.range(0.02, 0.97), age: 0 });
      for (const h of this.carHits) h.age++;
      this.carHits = this.carHits.filter((h) => h.age < 7);
    }
  }

  // Ripple rings (perspective-flattened ellipses) and splash crowns.
  function genRings() {
    const rings = [];
    for (let rad = 1; rad <= 9; rad++) {
      const ry = Math.max(0.8, rad * 0.32);
      const w = rad * 2 + 3, h = Math.ceil(ry * 2) + 3;
      const pb = new ND.PB(w, h);
      const cx = w / 2 - 0.5, cy = h / 2 - 0.5;
      for (let a = 0; a < Math.PI * 2; a += 0.05) {
        const x = Math.round(cx + Math.cos(a) * rad), y = Math.round(cy + Math.sin(a) * ry);
        pb.set(x, y, ND.pack(255, 255, 255, Math.sin(a) < 0 ? 150 : 255));
      }
      rings.push(pb.canvas());
    }
    const crowns = [
      ['.#.#.', '#...#'],
      ['#.#.#', '.....'],
      ['..#..', '.#.#.'],
    ].map((rows) => {
      const pb = new ND.PB(5, 2);
      rows.forEach((row, y) => [...row].forEach((ch, x) => ch === '#' && pb.set(x, y, ND.pack(255, 255, 255))));
      return pb.canvas();
    });
    return { rings, crowns };
  }

  // Tileable drifting mist band.
  function genMist(seed, T, h, color, strength) {
    const pb = new ND.PB(T, h);
    for (let y = 0; y < h; y++) {
      const vy = Math.sin((y / (h - 1)) * Math.PI);
      for (let x = 0; x < T; x++) {
        const k = x / T;
        const n = ND.fbm(x / 90, y / 14, 4, seed) * (1 - k) + ND.fbm((x - T) / 90, y / 14, 4, seed) * k;
        let a = ND.clamp((n - 0.35) * 2.2, 0, 1) * vy * strength;
        a = Math.floor(a * 10 + ND.bayer(x, y)) / 10;
        if (a > 0) pb.set(x, y, ND.pack(color[0], color[1], color[2], a * 255));
      }
    }
    return pb.canvas();
  }

  // Heavy overcast rolling over the upper sky during storms.
  function genOvercast(seed) {
    const T = 1024, h = 150;
    const pb = new ND.PB(T, h);
    for (let y = 0; y < h; y++)
      for (let x = 0; x < T; x++) {
        const k = x / T;
        const n = ND.fbm(x / 60, y / 16, 5, seed) * (1 - k) + ND.fbm((x - T) / 60, y / 16, 5, seed) * k;
        const fall = 1 - Math.pow(y / h, 2.2);
        let a = ND.clamp((n - 0.3) * 2.4, 0, 1) * fall;
        a = Math.floor(a * 8 + ND.bayer(x, y)) / 8;
        if (a <= 0) continue;
        const lit = ND.fbm(x / 60, (y - 3) / 16, 5, seed) < n - 0.03;
        const c = lit ? [48, 38, 86] : [22, 17, 46];
        pb.set(x, y, ND.pack(c[0], c[1], c[2], a * 245));
      }
    return pb.canvas();
  }

  ND.Weather = Weather;
  ND.Rain = Rain;
  ND.genRings = genRings;
  ND.genMist = genMist;
  ND.genOvercast = genOvercast;
})();

</script>
  <script>/* src/fx.js */
/* Neon Drive — cinematic effects: volumetric lamp cones, headlight beams,
 * film grain, umbrellas, and night aircraft (planes + a searchlight helicopter). */
(function () {
  'use strict';
  const ND = window.ND;
  const { W, H, rgb } = ND;

  const dq = (a, x, y, levels = 12) => Math.floor(a * levels + ND.bayer(x, y)) / levels;

  // Downward light cone for street lamps (additive).
  function genCone(w, h, color) {
    const pb = new ND.PB(w, h);
    for (let y = 0; y < h; y++) {
      const t = y / (h - 1);
      const half = 2 + (w / 2 - 2) * Math.pow(t, 0.85);
      for (let x = 0; x < w; x++) {
        const dx = Math.abs(x - w / 2 + 0.5) / half;
        if (dx >= 1) continue;
        const a = dq((1 - dx * dx) * Math.pow(1 - t, 1.25) * (0.35 + 0.65 * Math.exp(-t * 3)), x, y);
        if (a > 0) pb.set(x, y, ND.pack(color[0] * a, color[1] * a, color[2] * a));
      }
    }
    return pb.canvas();
  }

  // Horizontal beam pointing left: apex on the right edge, centred vertically.
  function genBeam(len, spread, color, falloff = 1.1) {
    const h = spread * 2 + 1;
    const pb = new ND.PB(len, h);
    for (let x = 0; x < len; x++) {
      const t = (len - 1 - x) / (len - 1);
      const half = 1 + (spread - 1) * Math.pow(t, 0.8);
      for (let y = 0; y < h; y++) {
        const dy = Math.abs(y - spread) / half;
        if (dy >= 1) continue;
        const a = dq((1 - dy * dy) * Math.pow(1 - t, falloff), x, y);
        if (a > 0) pb.set(x, y, ND.pack(color[0] * a, color[1] * a, color[2] * a));
      }
    }
    return pb.canvas();
  }

  // Elongated pool of light on the road ahead of a car.
  function genGroundBeam(len, h, color) {
    const pb = new ND.PB(len, h);
    for (let y = 0; y < h; y++)
      for (let x = 0; x < len; x++) {
        const u = x / (len - 1); // 0 far ahead (left), 1 at the car
        const v = (y - h / 2 + 0.5) / (h / 2);
        const width = 0.35 + 0.65 * Math.sin(Math.min(1, u * 1.25) * Math.PI * 0.5);
        const d = Math.abs(v) / width;
        if (d >= 1) continue;
        const a = dq((1 - d * d) * Math.pow(u, 0.9) * (1 - Math.pow(u, 12)), x, y);
        if (a > 0) pb.set(x, y, ND.pack(color[0] * a, color[1] * a, color[2] * a));
      }
    return pb.canvas();
  }

  // Film grain frames: mid-grey noise for a soft-light blend, so it adds
  // texture to the mid-tones but leaves bright paint and deep blacks clean.
  function genGrain(n, seed) {
    const r = ND.rng(seed);
    const frames = [];
    for (let k = 0; k < n; k++) {
      const pb = new ND.PB(W, H);
      for (let i = 0; i < W * H; i++) {
        const v = 128 + ((r() + r() + r()) / 3 - 0.5) * 34;
        pb.d[i] = ND.pack(v, v, v);
      }
      frames.push(pb.canvas());
    }
    return frames;
  }

  // Umbrellas: dome + ribs + scalloped hem + J handle. 24x21, dome centre x=12.
  function genUmbrellas() {
    const cols = [rgb('#e02838'), rgb('#18121e'), rgb('#ff6ab0'), rgb('#2a3a80'), rgb('#ffc830'), rgb('#20c0c8'), rgb('#f0f0f8')];
    return cols.map((c, ci) => {
      const pb = new ND.PB(24, 21);
      const half = [3, 6, 8, 9, 10, 11, 11];
      for (let y = 0; y < 7; y++)
        for (let x = 12 - half[y]; x <= 11 + half[y]; x++) {
          const u = (x - 12 + half[y]) / (2 * half[y]);
          let k = 0.7 + 0.5 * (1 - u) - y * 0.03;
          if (y === 0) k += 0.2;
          if ((x - 12) % 5 === 0 && y > 1) k *= 0.8; // ribs
          const cc = ci === 6 ? ND.mix(c, [180, 170, 230], 0.3) : c;
          pb.set(x, y, ND.pack(cc[0] * k, cc[1] * k, cc[2] * k, ci === 6 ? 170 : 255));
        }
      for (let x = 1; x < 23; x++) if (x % 5 !== 1) pb.set(x, 7, ND.pack(c[0] * 0.6, c[1] * 0.6, c[2] * 0.6));
      for (let y = 7; y < 19; y++) pb.set(12, y, ND.pack(40, 30, 50));
      pb.set(11, 19, ND.pack(40, 30, 50)); pb.set(10, 18, ND.pack(40, 30, 50));
      pb.set(12, 0, ND.pack(60, 50, 70));
      return pb.canvas();
    });
  }

  // Helicopter silhouette facing left (rotor drawn live).
  function genHeli() {
    const rows = [
      '........................',
      '........................',
      '....####...............#',
      '..#######.............##',
      '.##..#####..........###.',
      '##....#################.',
      '##########.###..........',
      '.########...............',
      '..######................',
      '..#....#................',
      '##########..............',
    ];
    const pb = new ND.PB(24, rows.length);
    rows.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch !== '#') return;
      const rim = y < 5 && (rows[y - 1] || '')[x] !== '#';
      pb.set(x, y, ND.pack(...(rim ? [58, 42, 92] : [14, 10, 24])));
    }));
    // cockpit glass glint
    pb.set(3, 4, ND.pack(90, 150, 200)); pb.set(4, 4, ND.pack(70, 110, 170));
    return pb.canvas();
  }

  // Night aircraft: blinking planes high up, and a helicopter sweeping a
  // searchlight over the skyline.
  class Aircraft {
    constructor(seed) {
      this.r = ND.rng(seed);
      this.items = [];
      this.nextPlane = 60 * this.r.range(15, 45);
      this.nextHeli = 60 * this.r.range(70, 140);
      this.heli = genHeli();
      this.searchBeam = (() => {
        // vertical cone, apex at top-centre
        const w = 40, h = 170;
        const pb = new ND.PB(w, h);
        for (let y = 0; y < h; y++) {
          const t = y / (h - 1), half = 1 + (w / 2 - 1) * t;
          for (let x = 0; x < w; x++) {
            const dx = Math.abs(x - w / 2 + 0.5) / half;
            if (dx >= 1) continue;
            const a = dq((1 - dx * dx) * Math.pow(1 - t, 0.9), x, y);
            if (a > 0) pb.set(x, y, ND.pack(230 * a, 236 * a, 255 * a));
          }
        }
        return pb.canvas();
      })();
    }
    update(tick, weather) {
      const r = this.r;
      if (tick >= this.nextPlane) {
        const dir = r() < 0.5 ? -1 : 1;
        this.items.push({ kind: 'plane', x: dir < 0 ? W + 10 : -10, y: r.range(14, 70), vx: dir * r.range(0.18, 0.34) + 0.06, ph: r() * 100 });
        this.nextPlane = tick + 60 * r.range(40, 120);
      }
      if (tick >= this.nextHeli && weather.v.storm < 0.4) {
        const dir = r() < 0.5 ? -1 : 1;
        this.items.push({ kind: 'heli', x: dir < 0 ? W + 30 : -30, y: r.range(14, 44), vx: dir * r.range(0.4, 0.6) + 0.12, ph: r() * 100, dir });
        this.nextHeli = tick + 60 * r.range(150, 320);
      }
      for (const it of this.items) it.x += it.vx;
      this.items = this.items.filter((it) => it.x > -60 && it.x < W + 60);
    }
    draw(R, kind, weather) {
      const { c, g, tick } = R;
      for (const it of this.items) {
        if (it.kind !== kind) continue;
        const x = Math.round(it.x), y = Math.round(it.y);
        const t = tick + it.ph * 60;
        if (kind === 'plane') {
          c.fillStyle = '#1a1430';
          c.fillRect(x - 2, y, 5, 1);
          const strobe = t % 80 < 3, beacon = t % 64 < 8;
          if (strobe) { c.fillStyle = '#ffffff'; c.fillRect(x - 3, y, 1, 1); c.fillRect(x + 3, y, 1, 1); g.fillStyle = 'rgba(255,255,255,0.9)'; g.fillRect(x - 4, y - 1, 3, 3); g.fillRect(x + 2, y - 1, 3, 3); }
          if (beacon) { c.fillStyle = '#ff3040'; c.fillRect(x, y - 1, 1, 1); g.fillStyle = 'rgba(255,40,60,0.9)'; g.fillRect(x - 1, y - 2, 3, 3); }
          c.fillStyle = 'rgba(255,240,200,0.7)'; c.fillRect(x + (it.vx < 0 ? -2 : 2), y, 1, 1);
        } else {
          // searchlight first (behind the body)
          const ang = Math.sin(t * 0.006) * 0.55 + Math.sin(t * 0.0021) * 0.25;
          const beamA = 0.22 + weather.v.fog * 0.45 + weather.v.rain * 0.2;
          c.save();
          c.globalCompositeOperation = 'lighter';
          c.globalAlpha = Math.min(0.75, beamA);
          c.translate(x + 7, y + 9);
          c.rotate(ang);
          c.drawImage(this.searchBeam, -20, 0);
          c.restore();
          g.save();
          g.globalAlpha = 0.25;
          g.translate(x + 7, y + 9);
          g.rotate(ang);
          g.drawImage(this.searchBeam, -20, 0);
          g.restore();
          // body (flip when flying right)
          c.save();
          if (it.dir > 0) { c.translate(x + 24, y); c.scale(-1, 1); c.drawImage(this.heli, 0, 0); }
          else c.drawImage(this.heli, x, y);
          c.restore();
          // rotor blur
          c.fillStyle = 'rgba(40,30,70,0.8)';

  <script>/* src/audio.js */
/* Neon Drive — endless generative night-drive disco soundtrack (Web Audio).

 * Everything is synthesised live: four-on-the-floor drums with an 80s gated
 * snare, disco octave bass, sidechain-pumped supersaw chords, arps through a
 * ping-pong delay and a soaring lead. Each track is composed on the fly (key,
 * tempo, progression, motif) and follows an arc built on anticipation:
 * intro → verse → build → drop → breakdown → a longer build → the final drop
 * with a key lift → outro. Rain, thunder and tyre hiss follow the weather.

(function () {
  'use strict';
  const ND = window.ND;

  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const MINOR = [0, 2, 3, 5, 7, 8, 10];
  const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

  // Chord loops as natural-minor scale degrees (0 = i). Degree 4 is played as a
  // major V (harmonic minor) when `dom` is set.
  const PROGS = [
    { d: [0, 5, 2, 6] }, { d: [0, 6, 5, 6] }, { d: [5, 6, 0, 0] }, { d: [0, 3, 5, 4], dom: true },
    { d: [0, 5, 3, 4], dom: true }, { d: [3, 5, 0, 6] }, { d: [0, 2, 6, 5] }, { d: [5, 2, 6, 0] },
    { d: [5, 6, 2, 0] }, { d: [3, 6, 2, 5] }, { d: [0, 5, 6, 4], dom: true }, { d: [5, 4, 0, 6], dom: true },
  ];

  const RHYTHMS = [
    [[0, 3], [3, 3], [6, 2], [8, 4], [12, 2], [14, 2], [16, 6], [22, 2], [24, 6], [30, 2]],
    [[0, 2], [2, 2], [4, 4], [10, 2], [12, 4], [16, 2], [18, 2], [20, 6], [28, 4]],
    [[2, 2], [4, 2], [6, 4], [12, 4], [18, 2], [20, 2], [22, 4], [28, 2], [30, 2]],
    [[0, 6], [6, 2], [8, 6], [14, 2], [16, 4], [20, 4], [24, 8]],
    [[0, 8], [8, 4], [12, 4], [16, 12], [28, 4]],
    [[0, 3], [3, 3], [6, 4], [10, 2], [12, 4], [16, 3], [19, 3], [22, 4], [26, 6]],
  ];
  const ARPS = [
    [0, 1, 2, 3, 0, 1, 2, 3], [0, 2, 1, 3, 0, 2, 1, 3], [0, 1, 2, 3, 2, 1, 0, 1],
    [0, 3, 2, 3, 1, 3, 2, 3], [3, 2, 1, 0, 3, 2, 1, 0], [0, 0, 2, 1, 3, 1, 2, 1],
  ];
  // Vocal chop rhythms over two bars: [16th step, length]
  const CHOP_RHYTHMS = [
    [[0, 3], [3, 3], [6, 2], [12, 2], [16, 3], [19, 3], [22, 2], [28, 4]],
    [[2, 2], [6, 2], [10, 2], [14, 2], [18, 2], [22, 2], [26, 2], [30, 2]],
    [[0, 6], [8, 2], [10, 2], [12, 4], [16, 6], [24, 8]],
    [[0, 2], [2, 2], [4, 4], [12, 2], [14, 2], [16, 2], [18, 2], [20, 8]],
  ];
  const CHOP_NOTES = [[3, 2, 3, 1, 3, 2, 0, 2], [0, 1, 2, 3, 2, 1, 2, 3], [3, 3, 2, 2, 1, 1, 2, 3]];

  // Pitch of a sung clip (autocorrelation over a steady slice), in MIDI.
  function detectPitch(d, sr, from, to) {
    const N = 2048;
    const start = Math.max(0, Math.floor(from + (to - from) * 0.35));
    if (start + N * 2 > d.length) return null;
    const minLag = Math.floor(sr / 1000), maxLag = Math.floor(sr / 75);

    for (let lag = minLag; lag <= maxLag; lag++) {
      let s = 0, e1 = 0, e2 = 0;
      for (let i = 0; i < N; i++) {
        const a = d[start + i], b = d[start + i + lag];

  const WORDS_B = ['Causeway', 'Boulevard', 'Afterglow', 'Overdrive', 'Riviera', 'Mirage', 'Heatwave', 'Skyline', 'Horizon', 'Nightcall', 'Arcade', 'Coastline', 'Getaway', 'Afterhours', 'Parallel', 'Cruise', 'Satellite', 'Palms', 'Motel', 'Signal'];

  // ---------------------------------------------------------------------------
  // Composition
  // ---------------------------------------------------------------------------
  function makeTrack(r, prevTonic, index) {
    let tonic;

    const bpm = r.pick([108, 110, 112, 114, 115, 116, 118, 120, 122]);
    const verse = r.pick(PROGS);
    let drop = r() < 0.55 ? verse : r.pick(PROGS);
    const chordBars = r() < 0.55 ? 1 : 2;
    const buildBars = 8;
    const longBuild = r() < 0.65 ? 16 : 8; // the second wait is usually longer
    const sections = [
      { name: 'intro', bars: r() < 0.5 ? 16 : 8, energy: 0.25 },
      { name: 'verse', bars: 16, energy: 0.55 },
      { name: 'build', bars: buildBars, energy: 0.7 },
      { name: 'drop', bars: 16, energy: 1.0 },
      { name: 'break', bars: r() < 0.5 ? 16 : 8, energy: 0.3 },
      { name: 'build', bars: longBuild, energy: 0.75, second: true },
      { name: 'drop', bars: r() < 0.5 ? 24 : 16, energy: 1.0, final: true },
      { name: 'outro', bars: 16, energy: 0.4 },
    ];
    let bar = 0;
    for (const s of sections) { s.start = bar; bar += s.bars; }
    const rhythm = r.pick(RHYTHMS);
    const motif = [];
    let deg = r.pick([0, 2, 4]);
    for (let i = 0; i < rhythm.length; i++) {
      const [st, len] = rhythm[i];
      if (i > 0) {
        const up = st < 16 ? 0.62 : 0.38;
        const mag = r() < 0.65 ? 1 : r() < 0.7 ? 2 : 3;
        deg += r() < up ? mag : -mag;
        deg = ND.clamp(deg, -2, 9);
      }
      motif.push({ st, len, deg, strong: st % 4 === 0 });
    }
    motif[motif.length - 1].deg = r.pick([0, 2, 4, 7]);
    const name = `${r.pick(WORDS_A)} ${r.pick(WORDS_B)}`;
    return {
      index, name, bpm, tonic, key: `${NOTE_NAMES[tonic]} minor`,
      verse, drop, chordBars, sections, totalBars: bar,
      motif, answer: motif.map((n, i) => (i >= motif.length - 3 ? { ...n, deg: n.deg + r.pick([-2, -1, 1, 2]) } : n)),
      arp: r.pick(ARPS),
      lift: r() < 0.6 ? 2 : r() < 0.5 ? 1 : 3,
      leadWave: r.pick(['sawtooth', 'sawtooth', 'square']),
      bassOct: r.pick([true, true, false]),
      padBright: r.range(0.45, 0.8),
      swingHat: r() < 0.3,

  }

  // Scale degree -> MIDI in a given octave register around `center`.
  function degMidi(tonic, deg, center) {
    const o = Math.floor(deg / 7);
    const i = ((deg % 7) + 7) % 7;
    let m = tonic + MINOR[i] + 12 * o;
    while (m < center - 6) m += 12;
    while (m > center + 6) m -= 12;
    return m;
  }

  function chordPcs(tonic, d, dom) {
    const deg = (k) => MINOR[((d + k) % 7 + 7) % 7] + 12 * Math.floor((d + k) / 7);
    const tones = [deg(0), deg(2), deg(4), deg(d === 0 || d === 3 ? 8 : 6)]; // m9 on i / iv, 7ths elsewhere
    if (dom && ((d % 7) + 7) % 7 === 4) tones[1] += 1; // major V
    return tones.map((t) => tonic + t);

  function voice(pcs, prev, lo = 55) {
    // choose the inversion closest to the previous voicing
    const base = pcs.map((p) => { let m = p; while (m < lo) m += 12; while (m >= lo + 12) m -= 12; return m; }).sort((a, b) => a - b);
    const cands = [];
    for (let inv = 0; inv < base.length; inv++) {
      const v = base.map((m, i) => (i < inv ? m + 12 : m)).sort((a, b) => a - b);
      cands.push(v);

    if (!prev) return cands[0];
    let best = cands[0], bd = Infinity;
    for (const v of cands) {
      const d = v.reduce((s, m, i) => s + Math.abs(m - (prev[i] || m)), 0);
      if (d < bd) { bd = d; best = v; }

  // ---------------------------------------------------------------------------
  // Engine
  // ---------------------------------------------------------------------------
  class Music {
    constructor(seed = 1985) {
      this.seed = seed;
      this.r = ND.rng(seed * 13 + 7);
      this.ctx = null;
      this.enabled = false;
      this.trackIndex = 0;
      this.kicks = [];
      this.marks = [];
      this.listeners = [];
    }

    // ---- graph ----------------------------------------------------------------
    build(ctx, live = true) {

      lim.threshold.value = -2; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.001; lim.release.value = 0.08;

      N.out.gain.value = 1;

      N.out.connect(ctx.destination);
      if (live && ctx.createMediaStreamDestination) {
        N.rec = ctx.createMediaStreamDestination();

      }

      N.duck = ctx.createGain();
      N.sweep = ctx.createBiquadFilter();
      N.sweep.type = 'lowpass'; N.sweep.frequency.value = 18000; N.sweep.Q.value = 0.9;
      N.music = ctx.createGain();
      N.music.gain.value = 0.9;
      N.music.connect(N.duck).connect(N.sweep).connect(N.master);
      N.lead = ctx.createGain();
      N.lead.gain.value = 0.9;
      N.lead.connect(N.sweep);
      N.drums = ctx.createGain();
      N.drums.gain.value = 0.95;
      N.drums.connect(N.master);

      N.verbIn = ctx.createGain();
      N.verbOut = ctx.createGain();
      N.verbOut.gain.value = 0.55;
      const verbHP = ctx.createBiquadFilter();
      verbHP.type = 'highpass'; verbHP.frequency.value = 260;
      N.verbIn.connect(verbHP).connect(N.verb).connect(N.verbOut).connect(N.sweep);

      N.gated.buffer = this.impulse(ctx, 0.34, 0, true);
      N.gatedIn = ctx.createGain();
      const gOut = ctx.createGain();
      gOut.gain.value = 0.7;

      // the silent beat before a drop); chops go through the music bus and pump

      N.vox.connect(voxHP).connect(N.master);

      this.white = this.noise(ctx, 2, 'white');
      this.pink = this.noise(ctx, 4, 'pink');

    async loadVocals(ctx) {
      const pack = window.ND_VOCALS;
      if (!pack || !pack.clips || !pack.clips.length) return;
      for (const clip of pack.clips) {
        try {
          const bin = atob(clip.data);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          const buf = await new Promise((res, rej) => {
            const p = ctx.decodeAudioData(bytes.buffer, res, rej);
            if (p && p.then) p.then(res, rej);

          let peak = 0;
          for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i]));
          let on = 0, off = d.length - 1;
          while (on < d.length && Math.abs(d[on]) < peak * 0.05) on++;
          while (off > on && Math.abs(d[off]) < peak * 0.03) off--;

            id: clip.id, text: clip.text, tags: clip.tags || [], buf,
            onset: Math.max(0, on / sr - 0.012), dur: (off - on) / sr + 0.05,
            norm: Math.min(4, 0.7 / (peak || 1)),
          };
          if (clip.kind === 'chop') {
            item.midi = detectPitch(d, sr, on, off);
            if (item.midi == null) continue; // unpitched: not usable as a chop
            this.vox.chops.push(item);
          } else this.vox.hooks.push(item);
        } catch (e) {
          console.warn('Neon Drive: vocal clip failed to load', clip.id, e);
        }
      }
      this.vox.ready = this.vox.hooks.length + this.vox.chops.length > 0;
    }

    impulse(ctx, secs, decay, gated) {
      const sr = ctx.sampleRate, len = Math.floor(sr * secs);
      const buf = ctx.createBuffer(2, len, sr);
      const r = ND.rng(99);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        let lp = 0;
        for (let i = 0; i < len; i++) {
          const t = i / len;
          const env = gated ? (t < 0.8 ? 0.9 - t * 0.3 : Math.max(0, (1 - t) * 3.5)) : Math.pow(1 - t, decay);
          lp += ((r() * 2 - 1) - lp) * (gated ? 0.6 : 0.35 + 0.5 * (1 - t));
          d[i] = lp * env * (i < sr * 0.004 && !gated ? i / (sr * 0.004) : 1);
        }
      }
      return buf;
    }

    noise(ctx, secs, kind) {
      const sr = ctx.sampleRate, len = Math.floor(sr * secs);
      const buf = ctx.createBuffer(1, len, sr);
      const d = buf.getChannelData(0);
      const r = ND.rng(kind.length * 31);
      let b0 = 0, b1 = 0, b2 = 0, br = 0;
      for (let i = 0; i < len; i++) {
        const w = r() * 2 - 1;
        if (kind === 'white') d[i] = w;
        else if (kind === 'pink') {
          b0 = 0.99765 * b0 + w * 0.099; b1 = 0.963 * b1 + w * 0.2965; b2 = 0.57 * b2 + w * 1.0527;
          d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.2;
        } else {
          br = (br + 0.02 * w) / 1.02;
          d[i] = br * 3.5;
        }

      return buf;
    }

    buildAmbience(ctx) {
      const N = this.n;
      // rain
      const rain = ctx.createBufferSource();
      rain.buffer = this.pink; rain.loop = true;
      N.rainLP = ctx.createBiquadFilter(); N.rainLP.type = 'lowpass'; N.rainLP.frequency.value = 2400;
      const rainHP = ctx.createBiquadFilter(); rainHP.type = 'highpass'; rainHP.frequency.value = 350;
      N.rainG = ctx.createGain(); N.rainG.gain.value = 0;
      rain.connect(rainHP).connect(N.rainLP).connect(N.rainG).connect(N.amb);
      rain.start();
      // tyres hissing on the wet road
      const hiss = ctx.createBufferSource();
      hiss.buffer = this.white; hiss.loop = true;
      const hissBP = ctx.createBiquadFilter(); hissBP.type = 'bandpass'; hissBP.frequency.value = 3800; hissBP.Q.value = 0.6;
      N.hissG = ctx.createGain(); N.hissG.gain.value = 0;
      hiss.connect(hissBP).connect(N.hissG).connect(N.amb);

      e1.type = 'sawtooth'; e1.frequency.value = 41;
      e2.type = 'sawtooth'; e2.frequency.value = 82.6;
      const eLP = ctx.createBiquadFilter(); eLP.type = 'lowpass'; eLP.frequency.value = 150; eLP.Q.value = 2;
      const eG = ctx.createGain(); eG.gain.value = 0.035;
      const wob = ctx.createOscillator(); wob.frequency.value = 0.23;
      const wobG = ctx.createGain(); wobG.gain.value = 1.4;
      wob.connect(wobG).connect(e1.frequency);
      e1.connect(eLP); e2.connect(eLP); eLP.connect(eG).connect(N.amb);
      e1.start(); e2.start(); wob.start();
    }

    // ---- life cycle ---------------------------------------------------------------
    start() {
      if (this.ctx) {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.enabled = true;
        this.n.out.gain.setTargetAtTime(1, this.ctx.currentTime, 0.2);
        return;
      }

      if (!AC) return;
      const ctx = new AC({ latencyHint: 'playback' });
      this.build(ctx, true);
      this.enabled = true;
      this.newTrack();
      this.nextTime = ctx.currentTime + 0.15;
      this.startTicker();
      ND.bus.on('lightning', (e) => this.thunder(e));
    }
    toggle() {
      if (!this.ctx || !this.enabled) { this.start(); return true; }
      this.enabled = false;
      this.n.out.gain.setTargetAtTime(0, this.ctx.currentTime, 0.15);
      return false;
    }
    startTicker() {
      const tick = () => this.pump();
      try {
        // worker timers keep ticking in background tabs
        const src = 'let id=setInterval(()=>postMessage(0),25);';
        this.worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
        this.worker.onmessage = tick;
      } catch (e) {

    pump() {
