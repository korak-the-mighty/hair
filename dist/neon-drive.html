<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Drive</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #f0d8ff; }
    #screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    body.idle, body.idle #screen { cursor: none; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; letter-spacing: .3em; color: #ff5fd0; text-shadow: 0 0 8px #ff3cc8; }
    body.ready #loading { display: none; }
    #hud { position: fixed; left: 16px; bottom: 14px; padding: 6px 10px; background: rgba(10, 4, 24, .55); border: 1px solid rgba(255, 90, 210, .35); border-radius: 4px; transition: opacity .6s; pointer-events: none; }
    body.idle #hud, body.nohud #hud { opacity: 0; }
    #hud b { color: #6ae0ff; font-weight: normal; }
    #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); padding: 4px 12px; letter-spacing: .25em; text-transform: uppercase; color: #ffd6f6; background: rgba(10, 4, 24, .6); border: 1px solid rgba(255, 90, 210, .4); border-radius: 3px; opacity: 0; transition: opacity .5s; pointer-events: none; }
    #toast.show { opacity: 1; }
    #soundhint { position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%); padding: 6px 14px; letter-spacing: .3em; color: #6ae0ff; background: rgba(10, 4, 24, .6); border: 1px solid rgba(106, 224, 255, .45); border-radius: 3px; display: none; pointer-events: none; animation: pulse 2.4s ease-in-out infinite; }
    #soundhint.show { display: block; }
    @keyframes pulse { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { #soundhint { animation: none; } }
    #rec { position: fixed; right: 16px; top: 12px; padding: 3px 9px; color: #fff; background: rgba(200, 20, 40, .85); border-radius: 3px; letter-spacing: .15em; display: none; }
    #rec.show { display: block; }
    #stats { position: fixed; right: 12px; top: 10px; color: #9fffd0; background: rgba(0,0,0,.5); padding: 3px 7px; display: none; }
    #stats.show { display: block; }
  </style>
</head>
<body>
  <canvas id="screen" width="640" height="360"></canvas>
  <div id="loading">BUILDING THE CITY…</div>
  <div id="hud"><b>F</b> fullscreen · <b>M</b> music · <b>N</b> next track · <b>R</b> record · <b>W</b> weather · <b>L</b> letterbox · <b>T</b> titles · <b>H</b> hide hints · <b>Space</b> pause</div>

  <div id="rec">REC 0:00:00</div>
  <div id="toast"></div>

  <script>/* src/core.js */
/* Neon Drive — core utilities: constants, RNG, colour, dithering, pixel buffers, noise. */
(function () {
  'use strict';
  const ND = (window.ND = window.ND || {});

  // ---------------------------------------------------------------------------
  // World constants. Everything is authored for a 640x360 pixel world, which
  // scales by an exact integer to 720p (2x), 1080p (3x), 1440p (4x) and 4K (6x).
  // ---------------------------------------------------------------------------
  const W = 640, H = 360;
  ND.W = W;
  ND.H = H;
  ND.CX = W / 2;
  ND.HORIZON = 180;   // vanishing line of the ground plane
  ND.SPEED = 4;       // road pixels per tick at depth factor 1 (the hero lane)
  ND.TICK = 1 / 60;   // fixed simulation step

  // Ground plane: screen row <-> parallax factor.
  ND.fAt = (y) => (y - ND.HORIZON) / 96;
  ND.yAt = (f) => ND.HORIZON + f * 96;

  // Important rows of the street.
  ND.Y = {
    BUILD: 228,   // building bases / back of the sidewalk (f = 0.5)
    CURB: 252,    // curb edge (f = 0.75)
    FAR: 262,     // far traffic lane ground contact
    CAR: 276,     // hero car ground contact (f = 1)
    LINE: 300,    // lane line
  };

  // ---------------------------------------------------------------------------
  // Deterministic RNG (mulberry32) + hashing.
  // ---------------------------------------------------------------------------
  ND.rng = function (seed) {
    let a = seed >>> 0;
    const r = function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + (hi - lo) * r();
    r.int = (lo, hi) => Math.floor(lo + (hi - lo + 1) * r());
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    return r;
  };

  ND.hash = function (a, b = 0, c = 0) {
    let n = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 2147483647);
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    n ^= n >>> 16;
    return (n >>> 0) / 4294967296;
  };

  // ---------------------------------------------------------------------------
  // Colour helpers. Colours are [r,g,b] arrays (0..255) for maths and packed
  // little-endian ABGR uint32 values for pixel buffers.
  // ---------------------------------------------------------------------------
  ND.rgb = function (hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  const clamp255 = (v) => (v < 0 ? 0 : v > 255 ? 255 : v | 0);
  ND.clamp255 = clamp255;
  ND.pack = (r, g, b, a = 255) =>
    ((clamp255(a) << 24) | (clamp255(b) << 16) | (clamp255(g) << 8) | clamp255(r)) >>> 0;
  ND.packHex = (hex, a = 255) => {
    const c = ND.rgb(hex);
    return ND.pack(c[0], c[1], c[2], a);
  };
  ND.mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  ND.scale = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  ND.css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  ND.lerp = (a, b, t) => a + (b - a) * t;
  ND.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  ND.smooth = (t) => t * t * (3 - 2 * t);

  // Multi-stop gradient: stops = [[t, [r,g,b]], ...]
  ND.grad = function (stops, t) {
    if (t <= stops[0][0]) return stops[0][1];
    for (let i = 1; i < stops.length; i++) {
      if (t <= stops[i][0]) {
        const a = stops[i - 1], b = stops[i];
        return ND.mix(a[1], b[1], (t - a[0]) / (b[0] - a[0]));
      }
    }
    return stops[stops.length - 1][1];
  };

  // ---------------------------------------------------------------------------
  // Ordered dithering (Bayer 4x4) — gives gradients that authentic pixel look.
  // ---------------------------------------------------------------------------
  const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  ND.bayer = (x, y) => (B4[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
  ND.dq = function (v, x, y, step = 14) {
    const q = Math.round(v / step + ND.bayer(x, y) - 0.5) * step;
    return q < 0 ? 0 : q > 255 ? 255 : q;
  };

  // ---------------------------------------------------------------------------
  // Pixel buffer: fast per-pixel sprite authoring, converted to a canvas once.
  // ---------------------------------------------------------------------------
  class PB {
    constructor(w, h) {
      this.w = w | 0;
      this.h = h | 0;
      this.d = new Uint32Array(this.w * this.h);
    }
    in(x, y) {
      return x >= 0 && y >= 0 && x < this.w && y < this.h;
    }
    set(x, y, c) {
      x |= 0; y |= 0;
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
      this.d[y * this.w + x] = c;
    }
    get(x, y) {
      x |= 0; y |= 0;
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return 0;
      return this.d[y * this.w + x];
    }
    alpha(x, y) {
      return this.get(x, y) >>> 24;
    }
    // Set with dithered quantisation of an [r,g,b] float colour.
    dset(x, y, c, a = 255, step = 14) {
      x |= 0; y |= 0;
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
      this.d[y * this.w + x] = ND.pack(ND.dq(c[0], x, y, step), ND.dq(c[1], x, y, step), ND.dq(c[2], x, y, step), a);
    }
    // Alpha-blend an [r,g,b] colour on top (a in 0..1).
    blend(x, y, c, a) {
      x |= 0; y |= 0;
      if (a <= 0 || x < 0 || y < 0 || x >= this.w || y >= this.h) return;
      const i = y * this.w + x, o = this.d[i];
      const oa = (o >>> 24) / 255;
      if (oa === 0) {
        this.d[i] = ND.pack(c[0], c[1], c[2], a * 255);
        return;
      }
      const na = a + oa * (1 - a);
      const k = a / na;
      const r = (o & 255) + (c[0] - (o & 255)) * k;
      const g = ((o >> 8) & 255) + (c[1] - ((o >> 8) & 255)) * k;
      const b = ((o >> 16) & 255) + (c[2] - ((o >> 16) & 255)) * k;
      this.d[i] = ND.pack(r, g, b, na * 255);
    }
    // Additive light (keeps alpha, raises it to at least `a`).
    add(x, y, c, s = 1) {
      x |= 0; y |= 0;
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
      const i = y * this.w + x, o = this.d[i];
      const oa = o >>> 24;
      const r = (o & 255) + c[0] * s, g = ((o >> 8) & 255) + c[1] * s, b = ((o >> 16) & 255) + c[2] * s;
      this.d[i] = ND.pack(r, g, b, Math.max(oa, 255));
    }
    rgbAt(x, y) {
      const o = this.get(x, y);
      return [o & 255, (o >> 8) & 255, (o >> 16) & 255];
    }
    rect(x, y, w, h, c) {
      const x0 = Math.max(0, x | 0), y0 = Math.max(0, y | 0);
      const x1 = Math.min(this.w, (x + w) | 0), y1 = Math.min(this.h, (y + h) | 0);
      for (let yy = y0; yy < y1; yy++) this.d.fill(c, yy * this.w + x0, yy * this.w + x1);
    }
    hline(x0, x1, y, c) {
      if (x1 < x0) { const t = x0; x0 = x1; x1 = t; }
      this.rect(x0, y, x1 - x0 + 1, 1, c);
    }
    vline(x, y0, y1, c) {
      if (y1 < y0) { const t = y0; y0 = y1; y1 = t; }
      this.rect(x, y0, 1, y1 - y0 + 1, c);
    }
    line(x0, y0, x1, y1, c) {
      x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
      const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx + dy;
      for (;;) {
        this.set(x0, y0, c);
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; x0 += sx; }
        if (e2 <= dx) { err += dx; y0 += sy; }
      }
    }
    // Calls fn(x,y) for each pixel of a line.
    lineFn(x0, y0, x1, y1, fn) {
      x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
      const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx + dy, i = 0;
      const n = Math.max(dx, -dy) || 1;
      for (;;) {
        fn(x0, y0, i / n);
        i++;
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; x0 += sx; }
        if (e2 <= dx) { err += dx; y0 += sy; }
      }
    }
    disc(cx, cy, r, c) {
      const rr = r * r + r * 0.6;
      for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
        for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) {
          const dx = x - cx, dy = y - cy;
          if (dx * dx + dy * dy <= rr) this.set(x, y, c);
        }
    }
    discFn(cx, cy, r, fn) {
      const rr = r * r + r * 0.6;
      for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
        for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) {
          const dx = x - cx, dy = y - cy;
          if (dx * dx + dy * dy <= rr) fn(x, y, Math.sqrt(dx * dx + dy * dy) / (r || 1));
        }
    }
    // Thick line made of discs.
    thick(x0, y0, x1, y1, r, c) {
      const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0)));
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        if (r <= 0.5) this.set(Math.round(x0 + (x1 - x0) * t), Math.round(y0 + (y1 - y0) * t), c);
        else this.disc(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, r, c);
      }
    }
    // Scanline polygon fill (pixel centres). pts = [[x,y],...]
    poly(pts, c) {
      this.polyFn(pts, (x, y) => this.set(x, y, c));
    }
    polyFn(pts, fn) {
      let minY = Infinity, maxY = -Infinity;
      for (const p of pts) { minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); }
      minY = Math.max(0, Math.floor(minY));
      maxY = Math.min(this.h - 1, Math.ceil(maxY));
      const xs = [];
      for (let y = minY; y <= maxY; y++) {
        const sy = y + 0.5;
        xs.length = 0;
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
          const a = pts[i], b = pts[j];
          if ((a[1] <= sy && b[1] > sy) || (b[1] <= sy && a[1] > sy)) {
            xs.push(a[0] + ((sy - a[1]) / (b[1] - a[1])) * (b[0] - a[0]));
          }
        }
        xs.sort((p, q) => p - q);
        for (let k = 0; k + 1 < xs.length; k += 2) {
          const x0 = Math.max(0, Math.ceil(xs[k] - 0.5)), x1 = Math.min(this.w - 1, Math.floor(xs[k + 1] - 0.5));
          for (let x = x0; x <= x1; x++) fn(x, y);
        }
      }
    }
    // Draw another buffer on top (src-over, binary alpha fast path).
    blit(src, dx, dy, flipX = false) {
      for (let y = 0; y < src.h; y++)
        for (let x = 0; x < src.w; x++) {
          const c = src.d[y * src.w + (flipX ? src.w - 1 - x : x)];
          const a = c >>> 24;
          if (a === 0) continue;
          if (a === 255) this.set(dx + x, dy + y, c);
          else this.blend(dx + x, dy + y, [c & 255, (c >> 8) & 255, (c >> 16) & 255], a / 255);
        }
    }
    flipped() {
      const o = new PB(this.w, this.h);
      for (let y = 0; y < this.h; y++)
        for (let x = 0; x < this.w; x++) o.d[y * this.w + x] = this.d[y * this.w + (this.w - 1 - x)];
      return o;
    }
    // Outline: every transparent pixel touching an opaque one gets colour c.
    outline(c, diag = false) {
      const src = this.d.slice();
      const w = this.w, h = this.h;
      for (let y = 0; y < h; y++)
        for (let x = 0; x < w; x++) {
          if (src[y * w + x] >>> 24) continue;
          let hit = false;
          for (let dy = -1; dy <= 1 && !hit; dy++)
            for (let dx = -1; dx <= 1; dx++) {
              if (!diag && dx && dy) continue;
              const xx = x + dx, yy = y + dy;
              if (xx >= 0 && yy >= 0 && xx < w && yy < h && src[yy * w + xx] >>> 24 > 128) { hit = true; break; }
            }
          if (hit) this.d[y * w + x] = c;
        }
    }
    isEmpty() {
      for (let i = 0; i < this.d.length; i++) if (this.d[i] >>> 24) return false;
      return true;
    }
    canvas() {
      const cv = ND.canvas(this.w, this.h);
      const ctx = cv.getContext('2d');
      const id = ctx.createImageData(this.w, this.h);
      new Uint32Array(id.data.buffer).set(this.d);
      ctx.putImageData(id, 0, 0);
      return cv;
    }
  }
  ND.PB = PB;

  // ---------------------------------------------------------------------------
  // Canvas helpers
  // ---------------------------------------------------------------------------
  ND.canvas = function (w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, w | 0);
    c.height = Math.max(1, h | 0);
    return c;
  };
  ND.ctx = function (c, opts) {
    const x = c.getContext('2d', opts);
    x.imageSmoothingEnabled = false;
    return x;
  };

  // ---------------------------------------------------------------------------
  // Value noise + fBm
  // ---------------------------------------------------------------------------
  function h2(ix, iy, s) {
    let n = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(s, 1442695041);
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    n ^= n >>> 16;
    return (n >>> 0) / 4294967296;
  }
  ND.noise = function (x, y, s = 0) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const a = h2(ix, iy, s), b = h2(ix + 1, iy, s), c = h2(ix, iy + 1, s), d = h2(ix + 1, iy + 1, s);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  };
  ND.fbm = function (x, y, oct = 4, s = 0) {
    let v = 0, amp = 0.5, f = 1, n = 0;
    for (let i = 0; i < oct; i++) {
      v += amp * ND.noise(x * f, y * f, s + i * 31);
      n += amp;
      amp *= 0.5;
      f *= 2;
    }
    return v / n;
  };

  // ---------------------------------------------------------------------------
  // Sprite = colour canvas + optional emissive (glow) canvas, same size.
  // ---------------------------------------------------------------------------
  ND.sprite = function (pb, gpb, ox = 0, oy = 0) {
    return {
      c: pb.canvas(),
      g: gpb && !gpb.isEmpty() ? gpb.canvas() : null,
      w: pb.w,
      h: pb.h,
      ox,
      oy,
    };
  };
})();

</script>
  <script>/* src/font.js */
/* Neon Drive — bitmap fonts and neon-tube text rendering. */
(function () {
  'use strict';
  const ND = window.ND;

  // 5x7 capitals, digits and a few symbols.
  const F5 = {
    A: ['.###.', '#...#', '#...#', '#####', '#...#', '#...#', '#...#'],
    B: ['####.', '#...#', '#...#', '####.', '#...#', '#...#', '####.'],
    C: ['.###.', '#...#', '#....', '#....', '#....', '#...#', '.###.'],
    D: ['####.', '#...#', '#...#', '#...#', '#...#', '#...#', '####.'],
    E: ['#####', '#....', '#....', '####.', '#....', '#....', '#####'],
    F: ['#####', '#....', '#....', '####.', '#....', '#....', '#....'],
    G: ['.###.', '#...#', '#....', '#.###', '#...#', '#...#', '.###.'],
    H: ['#...#', '#...#', '#...#', '#####', '#...#', '#...#', '#...#'],
    I: ['.###.', '..#..', '..#..', '..#..', '..#..', '..#..', '.###.'],

    K: ['#...#', '#..#.', '#.#..', '##...', '#.#..', '#..#.', '#...#'],
    L: ['#....', '#....', '#....', '#....', '#....', '#....', '#####'],
    M: ['#...#', '##.##', '#.#.#', '#.#.#', '#...#', '#...#', '#...#'],
    N: ['#...#', '#...#', '##..#', '#.#.#', '#..##', '#...#', '#...#'],
    O: ['.###.', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'],
    P: ['####.', '#...#', '#...#', '####.', '#....', '#....', '#....'],
    Q: ['.###.', '#...#', '#...#', '#...#', '#.#.#', '#..#.', '.##.#'],

    S: ['.####', '#....', '#....', '.###.', '....#', '....#', '####.'],

    W: ['#...#', '#...#', '#...#', '#.#.#', '#.#.#', '#.#.#', '.#.#.'],
    X: ['#...#', '#...#', '.#.#.', '..#..', '.#.#.', '#...#', '#...#'],
    Y: ['#...#', '#...#', '.#.#.', '..#..', '..#..', '..#..', '..#..'],
    Z: ['#####', '....#', '...#.', '..#..', '.#...', '#....', '#####'],
    0: ['.###.', '#...#', '#..##', '#.#.#', '##..#', '#...#', '.###.'],
    1: ['..#..', '.##..', '..#..', '..#..', '..#..', '..#..', '.###.'],
    2: ['.###.', '#...#', '....#', '...#.', '..#..', '.#...', '#####'],
    3: ['#####', '...#.', '..#..', '...#.', '....#', '#...#', '.###.'],
    4: ['...#.', '..##.', '.#.#.', '#..#.', '#####', '...#.', '...#.'],
    5: ['#####', '#....', '####.', '....#', '....#', '#...#', '.###.'],

        col.set(x + xx, y + yy, ND.pack(c[0] * (on ? 1 : dim + 0.3), c[1] * (on ? 1 : dim + 0.3), c[2] * (on ? 1 : dim + 0.3)));
        if (glow && on) glow.set(x + xx, y + yy, ND.pack(tube[0] * 0.8 + core[0] * 0.2, tube[1] * 0.8 + core[1] * 0.2, tube[2] * 0.8 + core[2] * 0.2));

  // A neon tube along a path of points (1px core + halo).
  ND.neonPath = function (col, glow, pts, core, tube, opts = {}) {

      pb.lineFn(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], (x, y) => {

  // Neon from a set of "x,y" keys.
  ND.neonSet = function (col, glow, set, core, tube, opts = {}) {
    const pts = [...set].map((k) => k.split(',').map(Number));

      for (const [x, y] of pts)

          for (let dx = -1; dx <= 1; dx++) {
            const k = x + dx + ',' + (y + dy);
            if (set.has(k) || seen.has(k)) continue;
            seen.add(k);
            col.blend(x + dx, y + dy, tube, dx && dy ? 0.45 : 0.75);
            if (glow) glow.blend(x + dx, y + dy, ND.scale(tube, 0.6), dx && dy ? 0.4 : 0.7);
          }
    }
    for (const [x, y] of pts) {
      col.set(x, y, ND.pack(core[0], core[1], core[2]));
      if (glow) glow.set(x, y, ND.pack(tube[0] * 0.75 + core[0] * 0.25, tube[1] * 0.75 + core[1] * 0.25, tube[2] * 0.75 + core[2] * 0.25));
    }
  };

  // Common neon colour pairs [core, tube]
  const c = ND.rgb;
  ND.NEON = {
    pink: [c('#ffe0f6'), c('#ff3cc8')],
    magenta: [c('#ffd6ff'), c('#e03cff')],
    cyan: [c('#e6ffff'), c('#26d9ff')],
    blue: [c('#dfe8ff'), c('#3a64ff')],
    red: [c('#ffe0e0'), c('#ff2a4a')],
    orange: [c('#fff0d0'), c('#ff8a1e')],
    yellow: [c('#fffbe0'), c('#ffd21e')],
    green: [c('#e8ffe8'), c('#2cff7a')],
    purple: [c('#efe0ff'), c('#9a4cff')],
    white: [c('#ffffff'), c('#c8d8ff')],
  };
})();

  <script>/* src/art/sky.js */
/* Neon Drive — night sky: dithered gradient, stars, moon, drifting clouds. */
(function () {
  'use strict';
  const ND = window.ND;
  const { W, rgb } = ND;

  const SKY_H = 250;

  function makeSkyGradient(r) {
    const pb = new ND.PB(W, SKY_H);
    const stops = [
      [0.0, rgb('#060518')],
      [0.25, rgb('#0b0a2a')],
      [0.5, rgb('#151039')],
      [0.7, rgb('#231546')],
      [0.84, rgb('#3a1a5a')],
      [0.95, rgb('#57216a')],
      [1.0, rgb('#6a2a70')],
    ];
    for (let y = 0; y < SKY_H; y++) {
      for (let x = 0; x < W; x++) {
        // a little large-scale variation so the gradient breathes
        const n = (ND.fbm(x / 140, y / 60, 3, 7) - 0.5) * 0.08;
        const t = ND.clamp(y / 232 + n, 0, 1);
        pb.dset(x, y, ND.grad(stops, t), 255, 6);
      }
    }
    // static dim stars
    const stars = [];
    for (let i = 0; i < 170; i++) {
      const x = r.int(0, W - 1), y = Math.floor(Math.pow(r(), 1.6) * 150);
      const b = r.range(0.25, 0.8) * (1 - y / 190);
      const tint = r.pick([rgb('#ffffff'), rgb('#cfd8ff'), rgb('#ffe8d0'), rgb('#e0d0ff')]);
      pb.blend(x, y, tint, b);
      if (r() < 0.12) stars.push({ x, y, tint, b: b + 0.3, p: r.range(1.5, 5), ph: r() * 6.28 });
    }
    return { canvas: pb.canvas(), stars };
  }

  function makeMoon() {
    const R = 13;
    const S = R * 2 + 3;
    const pb = new ND.PB(S, S), gl = new ND.PB(S, S);
    const cx = S / 2 - 0.5, cy = S / 2 - 0.5;
    const base = rgb('#fbe9a6'), limb = rgb('#e9c874'), mare = rgb('#d7b565'), mare2 = rgb('#c7a45a');
    for (let y = 0; y < S; y++)
      for (let x = 0; x < S; x++) {
        const dx = x - cx, dy = y - cy;
        const d = Math.sqrt(dx * dx + dy * dy) / R;
        if (d > 1.02) continue;
        let c = ND.mix(base, limb, Math.pow(d, 3));
        const n = ND.fbm((x + 3) / 6, (y + 9) / 6, 3, 21);
        if (n > 0.56) c = ND.mix(c, mare, 0.85);
        if (n > 0.66) c = mare2;
        if (d > 0.93) c = ND.mix(c, limb, 0.6);
        pb.dset(x, y, c, 255, 8);
        gl.dset(x, y, ND.scale(c, 0.55), 255, 8);
      }
    return ND.sprite(pb, gl);
  }

  function makeHalo(radius, color, strength) {
    const S = radius * 2;
    const pb = new ND.PB(S, S);
    for (let y = 0; y < S; y++)
      for (let x = 0; x < S; x++) {
        const d = Math.hypot(x - radius + 0.5, y - radius + 0.5) / radius;
        if (d >= 1) continue;
        const a = Math.pow(1 - d, 2.2) * strength;
        // dithered alpha steps for a pixel-art halo
        const q = Math.floor(a * 10 + ND.bayer(x, y)) / 10;
        if (q > 0) pb.blend(x, y, color, q);
      }
    return pb.canvas();
  }

  function makeCloud(r, w, h, seed, lit) {
    const pb = new ND.PB(w, h);
    const body = rgb('#1b1540'), body2 = rgb('#272057'), rim = lit ? rgb('#8a7596') : rgb('#453a78');
    const dens = (x, y) => {
      const ex = (x - w / 2) / (w / 2), ey = (y - h * 0.6) / (h * 0.55);
      const env = 1 - (ex * ex + ey * ey * (ey > 0 ? 2.2 : 1));
      return ND.fbm(x / 22, y / 8, 4, seed) * 0.9 + env * 0.55 - 0.62;
    };
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        const d = dens(x, y);
        if (d <= 0) continue;
        if (d < 0.06 && ND.bayer(x, y) > d / 0.06) continue; // dithered feathered edge
        const above = dens(x, y - 2);
        let c = ND.mix(body, body2, ND.clamp(d * 3, 0, 1));
        if (above < d - 0.04) c = ND.mix(c, rim, ND.clamp((d - above) * 5, 0, 0.9));
        pb.dset(x, y, c, 235, 6);
      }
    return pb.canvas();
  }

  class Sky {
    constructor(seed) {
      const r = ND.rng(seed);
      const g = makeSkyGradient(r);
      this.canvas = g.canvas;
      this.stars = g.stars;
      this.moon = makeMoon();
      this.moonX = 548;
      this.moonY = 44;
      this.halo = makeHalo(70, rgb('#b89acb'), 0.22);
      this.haloInner = makeHalo(30, rgb('#ffe9b0'), 0.35);
      this.clouds = [];
      const specs = [
        { w: 260, h: 34, x: 420, y: 18, v: 0.035, lit: true },
        { w: 200, h: 26, x: 90, y: 34, v: 0.03 },
        { w: 320, h: 40, x: 240, y: 70, v: 0.05 },
        { w: 170, h: 22, x: 560, y: 86, v: 0.045, lit: true },
        { w: 240, h: 30, x: -40, y: 104, v: 0.06 },
        { w: 280, h: 34, x: 380, y: 128, v: 0.07 },
      ];
      specs.forEach((s, i) => {
        this.clouds.push({ ...s, img: makeCloud(r, s.w, s.h, 100 + i * 13, s.lit) });
      });
    }

    draw(R) {
      const { c, g } = R;
      c.drawImage(this.canvas, 0, 0);
      c.fillStyle = '#6a2a70';
      c.fillRect(0, SKY_H, W, ND.H - SKY_H);

      // twinkling stars (hidden as the clouds close in)
      const clear = R.weather ? ND.clamp(1 - R.weather.v.cloud * 0.95, 0, 1) : 1;
      for (const s of this.stars) {
        const tw = 0.5 + 0.5 * Math.sin(R.t * s.p + s.ph);
        const a = ND.clamp(s.b * (0.35 + 0.65 * tw), 0, 1) * clear;
        if (a < 0.03) continue;
        c.fillStyle = ND.css(s.tint, a);
        c.fillRect(s.x, s.y, 1, 1);
        if (tw > 0.93 && s.b > 0.7) {
          c.fillStyle = ND.css(s.tint, a * 0.5);
          c.fillRect(s.x - 1, s.y, 3, 1);
          c.fillRect(s.x, s.y - 1, 1, 3);
        }
      }

      // moon and halo
      const mx = this.moonX, my = this.moonY;
      const moonA = R.weather ? ND.clamp(1 - R.weather.v.cloud * 0.8, 0.15, 1) : 1;
      c.globalAlpha = moonA;
      c.drawImage(this.halo, mx - 70, my - 70);
      c.drawImage(this.haloInner, mx - 30, my - 30);
      c.globalAlpha = Math.min(1, moonA * 1.3);
      c.drawImage(this.moon.c, mx - this.moon.w / 2, my - this.moon.h / 2);
      c.globalAlpha = 1;
      g.globalAlpha = moonA;
      g.drawImage(this.moon.g, mx - this.moon.w / 2, my - this.moon.h / 2);
      g.globalAlpha = 1;

      // clouds drift slowly to the right (we travel left)
      for (const cl of this.clouds) {
        const span = W + cl.w;
        let x = cl.x + (R.cloudShift != null ? R.cloudShift : R.tick) * cl.v;
        x = ((((x + cl.w) % span) + span) % span) - cl.w;
        const xi = Math.round(x);
        c.drawImage(cl.img, xi, cl.y);
        // clouds occlude the moon glow
        g.globalCompositeOperation = 'destination-out';
        g.globalAlpha = 0.6;
        g.drawImage(cl.img, xi, cl.y);
        g.globalAlpha = 1;
        g.globalCompositeOperation = 'lighter';
      }
    }
  }

  ND.Sky = Sky;
  ND.makeHalo = makeHalo;
})();

/* Neon Drive — distant skyline towers (3 depths) and the lit causeway bridge. */
(function () {
  'use strict';
  const ND = window.ND;
  const { rgb } = ND;

  const BASE = 240; // screen row the tower sprites end at (hidden behind the street)

  const DEPTH = [
    { // far
      wmin: 14, wmax: 34, topMin: 70, topMax: 150, gapMin: -6, gapMax: 10,
      body: rgb('#12123a'), body2: rgb('#191a48'), rim: rgb('#24245a'),
      fog: rgb('#2f1c58'), fogBase: 0.28, fogK: 0.55,
      lit: 0.18, neon: 0.06, winScale: 1,
    },
    { // mid
      wmin: 20, wmax: 46, topMin: 46, topMax: 160, gapMin: -8, gapMax: 14,
      body: rgb('#141542'), body2: rgb('#1d1c52'), rim: rgb('#2d2c6c'),
      fog: rgb('#34205e'), fogBase: 0.12, fogK: 0.5,
      lit: 0.34, neon: 0.22, winScale: 1,
    },
    { // near city
      wmin: 30, wmax: 70, topMin: 104, topMax: 186, gapMin: -10, gapMax: 22,
      body: rgb('#171848'), body2: rgb('#221d57'), rim: rgb('#383479'),
      fog: rgb('#3a2262'), fogBase: 0.0, fogK: 0.4,
      lit: 0.42, neon: 0.35, winScale: 2,
    },
  ];

  const WIN_WARM = [rgb('#ffd67a'), rgb('#ffc861'), rgb('#fff1c9'), rgb('#ffe3a0')];
  const WIN_COOL = [rgb('#bfe8ff'), rgb('#8fdcff'), rgb('#e8f0ff')];
  const NEONS = ['pink', 'magenta', 'cyan', 'blue', 'pink', 'purple'];

  function genTower(seed, d, o = {}) {
    const r = ND.rng(seed);
    const P = DEPTH[d];
    const w = o.w || r.int(P.wmin, P.wmax);
    const top = o.top || r.int(P.topMin, P.topMax);
    const style = o.style || r.pick(['flat', 'flat', 'setback', 'spire', 'crown', 'slant', 'antenna', 'setback']);
    const extra = style === 'spire' || style === 'antenna' ? r.int(10, 26) : 0;
    const hh = BASE - top + extra;
    const pb = new ND.PB(w, hh), gl = new ND.PB(w, hh);
    const anims = [];
    const y0 = extra; // roof row inside the sprite
    const bodyH = hh - y0;

    // silhouette mask
    const inside = (x, y) => {
      if (y < y0) return false;
      const ry = y - y0;
      if (style === 'setback') {
        const s1 = Math.floor(bodyH * 0.12), inset = Math.floor(w * 0.18);
        if (ry < s1) return x >= inset && x < w - inset;
        const s2 = Math.floor(bodyH * 0.05);
        if (ry < s1 + s2) return x >= inset / 2 && x < w - inset / 2;
      }
      if (style === 'slant') {
        const sl = Math.floor(w * 0.6);
        return ry >= Math.floor((x / w) * sl * 0.8);
      }
      if (style === 'crown') {
        const ch = Math.floor(w * 0.45);
        if (ry < ch) {
          const half = (ry / ch) * (w / 2) + 1;
          return Math.abs(x - w / 2 + 0.5) < half;
        }
      }
      return true;
    };

    const tint = r.chance(0.3) ? 0.35 : 0;
    const coolWin = r.chance(0.28);
    for (let y = 0; y < hh; y++)
      for (let x = 0; x < w; x++) {
        if (!inside(x, y)) continue;
        const sy = top - extra + y; // screen row
        const fogT = ND.clamp(P.fogBase + ((sy - top) / (BASE - top)) * P.fogK, 0, 0.85);
        let c = ND.mix(P.body, P.body2, (x / w) * 0.6 + tint * 0.4);
        if (x === w - 1 || !inside(x + 1, y)) c = P.rim;
        if (x === 0) c = ND.scale(c, 0.8);
        c = ND.mix(c, P.fog, fogT);
        pb.dset(x, y, c, 255, 6);
      }

    // windows
    const cw = P.winScale === 2 ? r.pick([3, 4]) : r.pick([2, 3]);
    const chh = P.winScale === 2 ? r.pick([3, 4]) : r.pick([2, 3]);
    const pattern = r.pick(['grid', 'grid', 'bands', 'cols']);
    const litP = o.lit || P.lit * r.range(0.5, 1.6);
    const floorLit = [];
    for (let y = y0 + 3; y < hh - 2; y += chh) floorLit.push(r() < litP * 1.2);
    let fi = 0;
    for (let y = y0 + 3; y < hh - 2; y += chh, fi++) {
      for (let x = 2; x < w - 2; x += cw) {
        if (!inside(x, y) || !inside(x + 1, y + 1) || !inside(x - 1, y)) continue;
        let on;
        if (pattern === 'bands') on = floorLit[fi] && r() < 0.85;
        else if (pattern === 'cols') on = ((x / cw) | 0) % 3 !== 1 && r() < litP * 1.3;
        else on = r() < litP;
