      this.scheduleUntil(ctx.currentTime + ahead);
      this.updateAmbience();
    }
    newTrack() {
      const prev = this.track;
      this.track = makeTrack(this.r, prev ? prev.tonic : -1, this.trackIndex++);
      this.bar = 0;
      this.stepIdx = 0;
      this.prevVoicing = null;
      this.prevLead = null;
      const T = this.track;
      this.stepDur = 60 / T.bpm / 4;
      if (this.n.dl) {
        const t = this.ctx.currentTime;
        this.n.dl.delayTime.setValueAtTime(this.stepDur * 3, Math.max(t, this.nextTime || t));
        this.n.dr.delayTime.setValueAtTime(this.stepDur * 3, Math.max(t, this.nextTime || t));
      }
      this.marks.push({ t: this.nextTime || 0, type: 'track', track: T });
      this.emit('track', T);
      this.vplan = this.planVocals(T);
    }

    // Where the vocals go in this track (clips are picked when they play).
    planVocals(T) {
      const r = this.r, plan = { hooks: [], chop: null };
      const find = (name, pred = () => true) => T.sections.find((s) => s.name === name && pred(s));
      const intro = find('intro'), brk = find('break'), build2 = find('build', (s) => s.second);
      const build1 = find('build', (s) => !s.second), fin = find('drop', (s) => s.final), outro = find('outro');
      if (r() < 0.75) plan.hooks.push({ bar: intro.start + Math.floor(intro.bars * 0.4), k: 0, tag: 'intro' });
      if (r() < 0.9) plan.hooks.push({ bar: brk.start + 1, k: 8, tag: 'break' });
      if (r() < 0.8) plan.hooks.push({ bar: build2.start + Math.floor(build2.bars / 2), k: 0, tag: 'build' });
      if (r() < 0.85) plan.hooks.push({ bar: fin.start - 1, k: 0, tag: 'drop-in', align: true });
      if (r() < 0.35) plan.hooks.push({ bar: build1.start + build1.bars - 1, k: 0, tag: 'drop-in', align: true });
      if (r() < 0.5) plan.hooks.push({ bar: outro.start + 6, k: 0, tag: 'outro' });
      plan.chop = { pick: r(), rhythm: r.pick(CHOP_RHYTHMS), notes: r.pick(CHOP_NOTES), octave: r() < 0.5 ? 12 : 0 };
      return plan;
    }

    pickHook(tag) {
      const pool = this.vox.hooks.filter((h) => h.tags.includes(tag));
      if (!pool.length) return null;
      const fresh = pool.filter((h) => !this.recentHooks.includes(h.id));
      const h = this.r.pick(fresh.length ? fresh : pool);
      this.recentHooks.push(h.id);
      if (this.recentHooks.length > 6) this.recentHooks.shift();
      return h;
    }
    skip() {
      if (!this.ctx) return;
      // fade what is ringing, then start fresh on the next step
      this.n.sweep.frequency.setTargetAtTime(300, this.ctx.currentTime, 0.1);
      this.newTrack();
      this.nextTime = this.ctx.currentTime + 0.4;
    }
    on(fn) { this.listeners.push(fn); }
    emit(type, data) { for (const f of this.listeners) f(type, data); }

    // ---- sequencer ----------------------------------------------------------------
    section() {
      const T = this.track;
      for (const s of T.sections) if (this.bar < s.start + s.bars) return s;
      return T.sections[T.sections.length - 1];
    }

    scheduleUntil(tEnd) {
      while (this.nextTime < tEnd) {
        this.step(this.nextTime);
        this.nextTime += this.stepDur;
        if (++this.stepIdx >= 16) {
          this.stepIdx = 0;
          this.bar++;
          if (this.bar >= this.track.totalBars) {
            this.newTrack();
          }
        }
      }
    }

    chordAt(bar, prog) {
      const T = this.track;
      const idx = Math.floor(bar / T.chordBars) % 4;
      return { deg: prog.d[idx], dom: prog.dom, idx };
    }

    step(t) {
      const T = this.track, s = this.section(), k = this.stepIdx;
      const sb = this.bar - s.start; // bar within section
      const lastBar = sb === s.bars - 1;
      const prog = s.name === 'drop' || (s.name === 'build' && s.second) ? T.drop : T.verse;
      const ch = this.chordAt(this.bar, prog);
      const lift = s.final ? T.lift : 0;
      const tonic = T.tonic + lift;
      const pcs = chordPcs(tonic, ch.deg, ch.dom);
      const beat = k % 4 === 0;
      const secT = (sb * 16 + k) / (s.bars * 16);
      const N = this.n;

      // section starts: filter moves, marks for the visuals
      if (k === 0 && sb === 0) {
        this.marks.push({ t, type: 'section', name: s.name, final: !!s.final, energy: s.energy });
        if (s.name === 'drop') {
          this.impact(t, s.final ? 1.2 : 1);
          this.crash(t, 1);
          N.sweep.frequency.cancelScheduledValues(t);
          N.sweep.frequency.setValueAtTime(18000, t);
          this.marks.push({ t, type: 'drop', final: !!s.final });
        }
        if (s.name === 'break') {
          N.sweep.frequency.cancelScheduledValues(t);
          N.sweep.frequency.setValueAtTime(3000, t);
          N.sweep.frequency.exponentialRampToValueAtTime(900, t + this.stepDur * 16 * 2);
          this.downlifter(t + this.stepDur * 2, this.stepDur * 32);
        }
        if (s.name === 'intro') {
          N.sweep.frequency.cancelScheduledValues(t);
          N.sweep.frequency.setValueAtTime(420, t);
          N.sweep.frequency.exponentialRampToValueAtTime(5000, t + this.stepDur * 16 * s.bars);
        }
        if (s.name === 'build') {
          N.sweep.frequency.cancelScheduledValues(t);
          N.sweep.frequency.setValueAtTime(s.second ? 700 : 1400, t);
          N.sweep.frequency.exponentialRampToValueAtTime(16000, t + this.stepDur * 16 * s.bars);
          this.riser(t, this.stepDur * 16 * s.bars);
        }
        if (s.name === 'verse' || s.name === 'outro') {
          N.sweep.frequency.cancelScheduledValues(t);
          N.sweep.frequency.setValueAtTime(s.name === 'verse' ? 7000 : 12000, t);
          if (s.name === 'outro') N.sweep.frequency.exponentialRampToValueAtTime(500, t + this.stepDur * 16 * s.bars);
        }
      }

      // section loudness: quiet intros and breakdowns make the drops land
      if (k === 0 && sb === 0) {
        const G = N.music.gain;
        const L = { intro: 0.6, verse: 0.72, build: 0.72, drop: 1, break: 0.66, outro: 0.8 }[s.name];
        G.cancelScheduledValues(t);
        G.setValueAtTime(L, t);
        if (s.name === 'build') G.linearRampToValueAtTime(0.95, t + this.stepDur * 16 * s.bars - this.stepDur * 4);
        if (s.name === 'outro') G.linearRampToValueAtTime(0.25, t + this.stepDur * 16 * s.bars);
      }
      // --- vocal hooks
      if (this.vox && this.vox.ready && this.vplan) {
        for (const ev of this.vplan.hooks) {
          if (ev.bar !== this.bar || ev.k !== k) continue;
          const h = this.pickHook(ev.tag);
          if (!h) continue;
          // drop-in lines end exactly where the drop lands, after the silent beat
          const at = ev.align ? Math.max(t, t + this.stepDur * 16 - h.dur - 0.02) : t;
          this.hook(at, h, ev.tag);
        }
      }
      // --- the wait: one beat of silence before every drop
      const gap = s.name === 'build' && lastBar && k >= 12;
      if (gap) {
        if (k === 12) {
          N.music.gain.cancelScheduledValues(t);
          N.music.gain.setValueAtTime(0.0001, t);
          N.lead.gain.setValueAtTime(0.0001, t);
          N.lead.gain.setValueAtTime(0.9, t + this.stepDur * 4);
        }
        return;
      }

      // ------------------------------------------------ drums
      const kickOn =
        (s.name === 'intro' && sb >= s.bars / 2) || s.name === 'verse' || s.name === 'drop' ||
        (s.name === 'build' && sb < s.bars - 2) || (s.name === 'outro' && sb < s.bars - 4);
      if (kickOn && beat) this.kick(t, s.name === 'drop' ? 1 : s.name === 'intro' ? 0.6 : 0.82, s.name === 'drop' ? 0.62 : 0.4);
      const clapOn = s.name === 'verse' || s.name === 'drop' || (s.name === 'outro' && sb < 8);
      if (clapOn && (k === 4 || k === 12)) this.snare(t, s.name === 'drop' ? 1 : 0.75, s.name === 'drop');
      // hats
      const hatsOn = s.name !== 'break' && !(s.name === 'intro' && sb < 2);
      if (hatsOn) {
        if (k % 4 === 2 && (s.name !== 'intro' || sb >= 4)) this.hat(t + (T.swingHat ? this.stepDur * 0.12 : 0), true, s.name === 'drop' ? 0.55 : 0.4);
        if (k % 2 === 0 && s.name !== 'intro') this.hat(t, false, 0.22 + (k % 4 === 0 ? 0.06 : 0));
        if (s.name === 'drop' && k % 2 === 1) this.hat(t, false, 0.12);
        if (s.name === 'intro' && k % 2 === 0) this.hat(t, false, 0.14);
      }
      // build: accelerating snare roll
      if (s.name === 'build') {
        const q = sb / s.bars;
        const div = q < 0.5 ? 4 : q < 0.75 ? 2 : 1;
        if (k % div === 0) {
          const v = 0.25 + 0.75 * secT;
          this.snare(t, v * 0.8, false, 1 + secT * 0.8);
          if (sb === s.bars - 2 && k >= 8) this.snare(t + this.stepDur / 2, v * 0.7, false, 1.9);
        }
      }
      // fills at phrase ends
      if ((s.name === 'drop' || s.name === 'verse') && sb % 8 === 7 && k >= 12 && !lastBar) this.snare(t, 0.5 + (k - 12) * 0.12, false, 1.2);
      if (s.name === 'drop' && sb % 8 === 0 && sb > 0 && k === 0) this.crash(t, 0.6);

      // ------------------------------------------------ bass
      const bassOn = s.name === 'verse' || s.name === 'drop' || s.name === 'build' || (s.name === 'outro' && sb < 8) || (s.name === 'intro' && sb >= s.bars - 4);
      const root = degMidi(tonic, ch.deg, 38);
      if (bassOn) {
        if (T.bassOct || s.name === 'drop') {
          if (k % 2 === 0) {
            const hi = k % 4 === 2;
            let m = root + (hi ? 12 : 0);
            // pickup into the next chord
            if (k === 14 && (this.bar + 1) % T.chordBars === 0) {
              const nx = this.chordAt(this.bar + 1, prog);
              m = degMidi(tonic, nx.deg, 38) + 12;
            }
            this.bass(t, m, this.stepDur * 1.7, hi ? 0.62 : 0.8, s.name === 'drop' ? 0.9 : 0.55);
          }
        } else if (k % 4 === 0 || k === 6 || k === 14) {
          this.bass(t, root + (k === 6 ? 12 : 0), this.stepDur * 3, 0.8, 0.5);
        }
      } else if (s.name === 'break' && k === 0 && this.bar % T.chordBars === 0) {
        this.bass(t, root, this.stepDur * 16 * T.chordBars * 0.95, 0.5, 0.2);
      }

      // ------------------------------------------------ chords
      if (k === 0 && this.bar % T.chordBars === 0) {
        const v = voice(pcs, this.prevVoicing, 55);
        this.prevVoicing = v;
        const dur = this.stepDur * 16 * T.chordBars;
        const big = s.name === 'drop';
        const bright = big ? 1 : s.name === 'build' ? 0.4 + secT * 0.6 : s.name === 'break' ? 0.35 : T.padBright * (s.name === 'verse' ? 0.7 : 0.5);
        const vel = s.name === 'outro' ? 0.26 * (1 - secT) + 0.05 : big ? 0.4 : s.name === 'verse' ? 0.2 : 0.26;
        this.pad(t, v, dur, bright, vel, big ? 5 : 3, big ? 0.03 : 0.5);
        if (s.final) this.pad(t, v.map((m) => m + 12), dur, 0.8, 0.12, 2, 0.05);
      }

      // ------------------------------------------------ arp
      const arpOn = s.name === 'verse' || s.name === 'build' || s.name === 'drop' || (s.name === 'intro' && sb >= 4) || s.name === 'break';
      if (arpOn && (s.name !== 'break' || k % 2 === 0)) {
        const v = voice(pcs, null, 64);
        const idx = T.arp[k % 8];
        const m = v[idx % v.length] + (k >= 8 && s.name === 'drop' ? 12 : 0);
        const bright = s.name === 'drop' ? 0.9 : s.name === 'break' ? 0.3 : 0.4 + secT * 0.4;
        this.arp(t, m, s.name === 'drop' ? 0.16 : s.name === 'break' ? 0.1 : 0.13, bright);
      }

      // ------------------------------------------------ vocal chops ride the drops
      if (s.name === 'drop' && (s.final || sb >= 8) && this.vox && this.vox.ready && this.vox.chops.length && this.vplan) {
        const P = this.vplan.chop;
        const pos = (this.bar % 2) * 16 + k;
        const hitIdx = P.rhythm.findIndex(([st]) => st === pos);
        if (hitIdx >= 0) {
          const clip = this.vox.chops[Math.floor(P.pick * this.vox.chops.length) % this.vox.chops.length];
          const v = voice(pcs, null, 67);
          const m = v[P.notes[hitIdx % P.notes.length] % v.length] + P.octave;
          this.chopNote(t, clip, m, this.stepDur * P.rhythm[hitIdx][1] * 0.9, s.final ? 0.42 : 0.34);
        }
      }

      // ------------------------------------------------ lead
      const leadOn = s.name === 'drop' || (s.name === 'break' && sb >= 4) || (s.name === 'verse' && sb >= 8);
      if (leadOn) {
        const loopBars = 2;
        const pos = ((this.bar % loopBars) * 16) + k;
        const phrase = Math.floor(this.bar / loopBars) % 2 === 1 ? T.answer : T.motif;
        for (const n of phrase) {
          if (n.st !== pos) continue;
          if (s.name === 'break' && !n.strong) continue;
          if (s.name === 'verse' && n.len < 3 && !n.strong) continue;
          const chordDeg = ch.deg;
          let m = degMidi(tonic, chordDeg + n.deg, 76);
          if (n.strong) {
            // land strong beats on chord tones
            let best = m, bd = 99;
            for (const p of pcs) for (let o = -1; o <= 1; o++) {
              const c = p + 12 * Math.round((m - p) / 12) + o * 12;
              if (Math.abs(c - m) < bd) { bd = Math.abs(c - m); best = c; }
            }
            m = best;
          }
          if (s.final) m += 12 * (m < 76 ? 1 : 0);
          const dur = this.stepDur * n.len * (s.name === 'break' ? 1.8 : 0.95);
          const vel = s.name === 'drop' ? 0.34 : s.name === 'break' ? 0.22 : 0.2;
          this.lead(t, m, dur, vel, T.leadWave);
          if (s.final) this.lead(t, m - 12 + (MINOR.includes((m - 3 - tonic + 120) % 12) ? -3 : -4), dur, vel * 0.45, 'square');
          this.prevLead = m;
        }
      }
    }

    // ---- instruments ------------------------------------------------------------
    env(g, t, a, peak, d, sus, rel, end) {
      const p = g.gain;
      p.setValueAtTime(0.0001, t);
      p.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
      if (d) p.exponentialRampToValueAtTime(Math.max(0.0002, peak * sus), t + a + d);
      if (end != null) {
        p.setValueAtTime(Math.max(0.0002, peak * (d ? sus : 1)), Math.max(t + a + (d || 0), end - rel));
        p.exponentialRampToValueAtTime(0.0001, end);
      }
    }

    duckAt(t, depth) {
      const d = this.n.duck.gain;
      d.setValueAtTime(1 - depth, t);
      d.setTargetAtTime(1, t + 0.02, this.stepDur * 0.9);
    }

    kick(t, v, duck) {
      const c = this.ctx, N = this.n;
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(160, t);
      o.frequency.exponentialRampToValueAtTime(52, t + 0.09);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.35);
      this.env(g, t, 0.003, 1.1 * v, 0.42, 0.001, 0, null);
      o.connect(g).connect(N.drums);
      o.start(t); o.stop(t + 0.5);
      const n = c.createBufferSource(); n.buffer = this.white;
      const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2500;
      const ng = c.createGain();
      this.env(ng, t, 0.001, 0.22 * v, 0.012, 0.01, 0, null);
      n.connect(hp).connect(ng).connect(N.drums);
      n.start(t, 0.1); n.stop(t + 0.03);
      this.duckAt(t, duck);
      this.kicks.push(t);
      if (this.kicks.length > 64) this.kicks.shift();
    }

    snare(t, v, big, pitch = 1) {
      const c = this.ctx, N = this.n;
      const n = c.createBufferSource(); n.buffer = this.white;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700 * pitch; bp.Q.value = 0.7;
      const g = c.createGain();
      this.env(g, t, 0.001, 0.62 * v, 0.2, 0.01, 0, null);
      n.connect(bp).connect(g);
      g.connect(N.drums);
      const send = c.createGain(); send.gain.value = big ? 0.85 : 0.35;
      g.connect(send).connect(N.gatedIn);
      n.start(t, (t * 7.3) % 1.5); n.stop(t + 0.26);
      const o = c.createOscillator(), og = c.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(210 * pitch, t);
      o.frequency.exponentialRampToValueAtTime(160 * pitch, t + 0.06);
      this.env(og, t, 0.001, 0.4 * v, 0.1, 0.01, 0, null);
      o.connect(og).connect(N.drums);
      o.start(t); o.stop(t + 0.14);
      if (big) {
        // clap layer
        for (let i = 0; i < 3; i++) {
          const cn = c.createBufferSource(); cn.buffer = this.white;
          const cb = c.createBiquadFilter(); cb.type = 'bandpass'; cb.frequency.value = 1150; cb.Q.value = 1.2;
          const cg = c.createGain();
          const tt = t - 0.012 + i * 0.009;
          this.env(cg, tt, 0.001, 0.32 * v, 0.02, 0.05, 0, null);
          cn.connect(cb).connect(cg).connect(N.drums);
          cg.connect(send);
          cn.start(Math.max(0, tt), 0.5 + i * 0.1); cn.stop(tt + 0.05);
        }
      }
    }

    hat(t, open, v) {
      const c = this.ctx, N = this.n;
      const n = c.createBufferSource(); n.buffer = this.white;
      const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = open ? 6500 : 8000;
      const g = c.createGain();
      const len = open ? 0.24 : 0.035;
      this.env(g, t, 0.001, v * 0.5, len, 0.01, 0, null);
      let out = g;
      if (c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = open ? 0.25 : 0.35; g.connect(p); out = p; }
      n.connect(hp).connect(g);
      out.connect(N.drums);
      n.start(t, (t * 3.1) % 1.5); n.stop(t + len + 0.05);
    }

    crash(t, v) {
      const c = this.ctx, N = this.n;
      const n = c.createBufferSource(); n.buffer = this.white;
      const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 4200;
      const g = c.createGain();
      this.env(g, t, 0.002, 0.42 * v, 2.4, 0.001, 0, null);
      n.connect(hp).connect(g).connect(N.drums);
      const s = c.createGain(); s.gain.value = 0.3; g.connect(s).connect(N.verbIn);
      n.start(t, 0); n.stop(t + 2.5);
    }

    impact(t, v) {
      const c = this.ctx, N = this.n;
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(90, t);
      o.frequency.exponentialRampToValueAtTime(32, t + 1.1);
      this.env(g, t, 0.004, 0.9 * v, 1.6, 0.001, 0, null);
      o.connect(g).connect(N.master);
      o.start(t); o.stop(t + 1.7);
    }

    riser(t, dur) {
      const c = this.ctx, N = this.n;
      const n = c.createBufferSource(); n.buffer = this.white; n.loop = true;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.5;
      bp.frequency.setValueAtTime(300, t);
      bp.frequency.exponentialRampToValueAtTime(9000, t + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + dur * 0.97);
      g.gain.linearRampToValueAtTime(0.0001, t + dur);
      n.connect(bp).connect(g).connect(N.master);
      const s = c.createGain(); s.gain.value = 0.4; g.connect(s).connect(N.verbIn);
      n.start(t); n.stop(t + dur + 0.05);
      // pitch riser
      const o = c.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(110, t);
      o.frequency.exponentialRampToValueAtTime(1320, t + dur);
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
      const og = c.createGain();
      og.gain.setValueAtTime(0.0001, t);
      og.gain.exponentialRampToValueAtTime(0.07, t + dur * 0.97);
      og.gain.linearRampToValueAtTime(0.0001, t + dur);
      o.connect(lp).connect(og).connect(N.master);
      og.connect(s);
      o.start(t); o.stop(t + dur + 0.05);
    }

    downlifter(t, dur) {
      const c = this.ctx, N = this.n;
      const n = c.createBufferSource(); n.buffer = this.white; n.loop = true;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.5;
      bp.frequency.setValueAtTime(7000, t);
      bp.frequency.exponentialRampToValueAtTime(200, t + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(0.16, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      n.connect(bp).connect(g).connect(N.verbIn);
      n.start(t); n.stop(t + dur);
    }

    bass(t, m, dur, v, bright) {
      const c = this.ctx, N = this.n;
      const f = hz(m);
      const o1 = c.createOscillator(), o2 = c.createOscillator();
      o1.type = 'sawtooth'; o1.frequency.value = f;
      o2.type = 'square'; o2.frequency.value = f; o2.detune.value = -6;
      const o2g = c.createGain(); o2g.gain.value = 0.45;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 6;
      lp.frequency.setValueAtTime(260 + 2200 * bright, t);
      lp.frequency.setTargetAtTime(220 + 300 * bright, t + 0.005, 0.07);
      const g = c.createGain();
      this.env(g, t, 0.004, 0.36 * v, 0.12, 0.7, 0.03, t + dur);
      o1.connect(lp); o2.connect(o2g).connect(lp);
      lp.connect(g).connect(N.music);
      o1.start(t); o2.start(t); o1.stop(t + dur + 0.02); o2.stop(t + dur + 0.02);
    }

    pad(t, notes, dur, bright, v, voices, attack) {
      const c = this.ctx, N = this.n;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.8;
      lp.frequency.setValueAtTime(500 + 5200 * bright * bright, t);
      const g = c.createGain();
      const rel = 1.6;
      this.env(g, t, attack, v / Math.sqrt(notes.length * voices) * 1.6, 0, 1, rel, t + dur + rel * 0.6);
      lp.connect(g).connect(N.music);
      const send = c.createGain(); send.gain.value = 0.42; g.connect(send).connect(N.verbIn);
      const det = voices === 5 ? [-16, -7, 0, 7, 16] : voices === 3 ? [-9, 0, 9] : [-6, 6];
      // spread detuned voices across two panned groups for width
      const sides = [-0.65, 0.65].map((pan) => {
        if (!c.createStereoPanner) return lp;
        const p = c.createStereoPanner();
        p.pan.value = pan;
        p.connect(lp);
        return p;
      });
      notes.forEach((m, ni) => {
        det.forEach((cents, vi) => {
          const o = c.createOscillator();
          o.type = 'sawtooth';
          o.frequency.value = hz(m);
          o.detune.value = cents + (ni - 1.5) * 1.5;
          o.connect(sides[(vi + ni) % 2]);
          o.start(t);
          o.stop(t + dur + rel + 0.1);
        });
      });
    }

    arp(t, m, v, bright) {
      const c = this.ctx, N = this.n;
      const o = c.createOscillator(); o.type = 'square'; o.frequency.value = hz(m);
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 3;
      lp.frequency.setValueAtTime(700 + 5000 * bright, t);
      lp.frequency.exponentialRampToValueAtTime(380, t + 0.14);
      const g = c.createGain();
      this.env(g, t, 0.002, v * 0.5, 0.16, 0.05, 0, null);
      o.connect(lp).connect(g).connect(N.music);
      const s = c.createGain(); s.gain.value = 0.55; g.connect(s).connect(N.delayIn);
      o.start(t); o.stop(t + 0.22);
    }

    lead(t, m, dur, v, wave) {
      const c = this.ctx, N = this.n;
      const f = hz(m);
      const g = c.createGain();
      this.env(g, t, 0.012, v, 0.18, 0.78, 0.18, t + dur + 0.12);
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 1.6;
      lp.frequency.setValueAtTime(5200, t);
      lp.frequency.exponentialRampToValueAtTime(2600, t + 0.3);
      const lfo = c.createOscillator(); lfo.frequency.value = 5.6;
      const lfoG = c.createGain();
      lfoG.gain.setValueAtTime(0, t);
      lfoG.gain.linearRampToValueAtTime(f * 0.007, t + Math.min(0.5, dur));
      lfo.connect(lfoG);
      const from = this.prevLead && Math.abs(this.prevLead - m) <= 7 ? hz(this.prevLead) : f;
      const oscs = [];
      for (const [type, det, gain] of [[wave, -8, 0.5], [wave, 8, 0.5], ['square', -1200, 0.22]]) {
        const o = c.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(from, t);
        o.frequency.exponentialRampToValueAtTime(f, t + 0.045);
        o.detune.value = det;
        lfoG.connect(o.frequency);
        const og = c.createGain(); og.gain.value = gain;
        o.connect(og).connect(lp);
        oscs.push(o);
      }
      lp.connect(g).connect(N.lead);
      const rs = c.createGain(); rs.gain.value = 0.38; g.connect(rs).connect(N.verbIn);
      const ds = c.createGain(); ds.gain.value = 0.3; g.connect(ds).connect(N.delayIn);
      const end = t + dur + 0.2;
      lfo.start(t); lfo.stop(end);
      for (const o of oscs) { o.start(t); o.stop(end); }
    }

    hook(t, h, tag) {
      const c = this.ctx, N = this.n;
      const src = c.createBufferSource();
      src.buffer = h.buf;
      const g = c.createGain();
      g.gain.value = h.norm * (tag === 'drop-in' ? 0.95 : 0.8);
      // a touch of "radio" colour in intros, fuller elsewhere
      const eq = c.createBiquadFilter();
      eq.type = tag === 'intro' ? 'bandpass' : 'peaking';
      eq.frequency.value = tag === 'intro' ? 1800 : 3200;
      if (tag === 'intro') eq.Q.value = 0.7; else { eq.gain.value = 3; eq.Q.value = 0.8; }
      src.connect(eq).connect(g).connect(N.vox);
      const rs = c.createGain(); rs.gain.value = 0.5; g.connect(rs).connect(N.verbIn);
      const ds = c.createGain(); ds.gain.value = tag === 'drop-in' ? 0.15 : 0.32; g.connect(ds).connect(N.delayIn);
      src.start(t, h.onset);
      src.stop(t + h.dur + 0.2);
      this.marks.push({ t, type: 'vocal', text: h.text });
    }

    chopNote(t, clip, m, dur, v) {
      const c = this.ctx, N = this.n;
      // retune to the target note, choosing the octave closest to the source
      let shift = m - clip.midi;
      while (shift > 6) shift -= 12;
      while (shift < -6) shift += 12;
      const src = c.createBufferSource();
      src.buffer = clip.buf;
      src.playbackRate.value = Math.pow(2, shift / 12);
      const g = c.createGain();
      const peak = v * clip.norm;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
      g.gain.setValueAtTime(peak, t + Math.max(0.01, dur - 0.04));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.05);
      src.connect(g).connect(N.music);
      const rs = c.createGain(); rs.gain.value = 0.28; g.connect(rs).connect(N.verbIn);
      const ds = c.createGain(); ds.gain.value = 0.18; g.connect(ds).connect(N.delayIn);
      src.start(t, clip.onset + Math.min(0.12, clip.dur * 0.1));
      src.stop(t + dur + 0.1);
    }

    // ---- weather -------------------------------------------------------------------
    updateAmbience() {
      const w = ND.world && ND.world.weather;
      if (!w || !this.n) return;
      const t = this.ctx.currentTime;
      const rain = w.v.rain;
      this.n.rainG.gain.setTargetAtTime(rain * 0.3, t, 0.5);
      this.n.rainLP.frequency.setTargetAtTime(1600 + rain * 3200, t, 0.5);
      this.n.hissG.gain.setTargetAtTime(0.004 + rain * 0.05, t, 0.5);
      this.n.verbOut.gain.setTargetAtTime(0.55 + rain * 0.2, t, 1);
    }

    thunder(e) {
      if (!this.ctx || !this.enabled) return;
      const c = this.ctx, N = this.n;
      const delay = e.near ? 0.15 + Math.random() * 0.4 : 0.8 + Math.random() * 2.2;
      const t = c.currentTime + delay;
      const n = c.createBufferSource(); n.buffer = this.brown;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = e.near ? 900 : 380;
      lp.frequency.setTargetAtTime(160, t + 0.3, 1.2);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.9 * e.intensity, t + (e.near ? 0.04 : 0.4));
      g.gain.setTargetAtTime(0.35 * e.intensity, t + 0.6, 0.6);
      g.gain.setTargetAtTime(0.0001, t + 2, 1.4);
      n.connect(lp).connect(g).connect(N.amb);
      const s = c.createGain(); s.gain.value = 0.3; g.connect(s).connect(N.verbIn);
      n.start(t, Math.random() * 1.5); n.stop(t + 7);
      if (e.near) {
        const cr = c.createBufferSource(); cr.buffer = this.white;
        const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1800;
        const cg = c.createGain();
        this.env(cg, t, 0.002, 0.35 * e.intensity, 0.35, 0.001, 0, null);
        cr.connect(hp).connect(cg).connect(N.amb);
        cr.start(t); cr.stop(t + 0.5);
      }
    }

    // ---- sync info for the visuals ------------------------------------------------------
    heard() {
      if (!this.ctx) return 0;
      return this.ctx.currentTime - (this.ctx.outputLatency || this.ctx.baseLatency || 0);
    }
    pulse() {
      if (!this.ctx || !this.enabled) return { playing: false, kick: 0, drop: 0, energy: 0 };
      const now = this.heard();
      let lastKick = -1;
      for (let i = this.kicks.length - 1; i >= 0; i--) if (this.kicks[i] <= now) { lastKick = this.kicks[i]; break; }
      const kick = lastKick < 0 ? 0 : Math.exp(-(now - lastKick) / 0.11);
      // consume marks that have become audible
      while (this.marks.length && this.marks[0].t <= now) {
        const m = this.marks.shift();
        if (m.type === 'section') this.curSection = m;
        if (m.type === 'drop') { this.lastDrop = m.t; this.lastDropFinal = m.final; ND.bus.emit('drop', m); }
        if (m.type === 'track') { this.shownTrack = m.track; this.trackShownAt = now; ND.bus.emit('track', m.track); }
      }
      const drop = this.lastDrop != null ? Math.exp(-(now - this.lastDrop) / (this.lastDropFinal ? 1.4 : 0.9)) : 0;
      return { playing: true, kick, drop, energy: this.curSection ? this.curSection.energy : 0, section: this.curSection && this.curSection.name, track: this.shownTrack, trackAge: now - (this.trackShownAt || -99) };
    }

    // ---- offline render (tests / previews) -------------------------------------------------
    async renderOffline(seconds, sr = 44100) {
      const ctx = new OfflineAudioContext(2, Math.floor(sr * seconds), sr);
      this.build(ctx, false);
      await this.voxLoading;
      this.enabled = true;
      this.newTrack();
      this.nextTime = 0.05;
      this.scheduleUntil(seconds);
      return ctx.startRendering();
    }
  }

  ND.Music = Music;
  ND.makeTrack = makeTrack;
})();

  <script>/* src/recorder.js */
/* Neon Drive — record the drive (picture + soundtrack) to a video file.
 *
 * Frames are captured from a dedicated fixed-size canvas (1080p by default,
 * 4K with ?rec=4k) so recordings don't depend on the window size. Where the
 * browser supports the File System Access API (Chrome, Edge) the video is
 * streamed straight to disk, so multi-hour mixtape recordings don't fill RAM;
 * elsewhere it's kept in memory and downloaded when recording stops.
 */
(function () {
  'use strict';
  const ND = window.ND;

  class Recorder {
    constructor(scale) {
      this.scale = scale || 3;
      this.canvas = ND.canvas(ND.W * this.scale, ND.H * this.scale);
      this.ctx = this.canvas.getContext('2d', { alpha: false });
      this.ctx.imageSmoothingEnabled = false;
      this.rec = null;
    }
    get active() { return !!this.rec; }
    get elapsed() { return this.rec ? (performance.now() - this.t0) / 1000 : 0; }

    supported() {
      return typeof MediaRecorder !== 'undefined' && !!this.canvas.captureStream;
    }

    // Called every presented frame.
    frame(scene) {
      if (!this.rec) return;
      this.ctx.imageSmoothingEnabled = false;
      this.ctx.drawImage(scene, 0, 0, this.canvas.width, this.canvas.height);
    }

    async start(music, scene) {
      if (!this.supported()) throw new Error('This browser cannot record video (no MediaRecorder).');
      this.frame(scene);
      const video = this.canvas.captureStream(60);
      const tracks = [...video.getVideoTracks()];
      if (music && music.n && music.n.rec) tracks.push(...music.n.rec.stream.getAudioTracks());
      const stream = new MediaStream(tracks);
      const types = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4;codecs=avc1,mp4a', 'video/mp4'];
      this.mime = types.find((t) => MediaRecorder.isTypeSupported(t)) || '';
      const ext = this.mime.includes('mp4') ? 'mp4' : 'webm';
      const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
      this.name = `neon-drive-${stamp}.${ext}`;
      this.writable = null;
      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: this.name,
            types: [{ description: 'Video', accept: { [ext === 'mp4' ? 'video/mp4' : 'video/webm']: ['.' + ext] } }],
          });
          this.writable = await handle.createWritable();
        } catch (e) {
          if (e && e.name === 'AbortError') return false; // the viewer cancelled the save dialog
          this.writable = null; // not allowed here: fall back to memory
        }
      }
      this.chunks = [];
      this.pending = Promise.resolve();
      const rec = new MediaRecorder(stream, { mimeType: this.mime || undefined, videoBitsPerSecond: this.scale >= 6 ? 40e6 : 16e6, audioBitsPerSecond: 256000 });
      rec.ondataavailable = (e) => {
        if (!e.data || !e.data.size) return;
        if (this.writable) this.pending = this.pending.then(() => this.writable.write(e.data));
        else this.chunks.push(e.data);
      };
      rec.onstop = async () => {
        if (this.writable) {
          await this.pending;
          await this.writable.close();
          this.onsaved && this.onsaved(this.name, true);
        } else {
          const blob = new Blob(this.chunks, { type: this.mime || 'video/webm' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = this.name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 60000);
          this.onsaved && this.onsaved(this.name, false);
        }
      };
      rec.start(1000);
      this.rec = rec;
      this.t0 = performance.now();
      return true;
    }

    stop() {
      if (!this.rec) return;
      this.rec.stop();
      this.rec = null;
    }
  }

  ND.Recorder = Recorder;
})();

  <script>/* src/world.js */
/* Neon Drive — world simulation: parallax sequences, pedestrians, traffic, hero car. */
(function () {
  'use strict';
  const ND = window.ND;
  const { W, H, CX, Y, SPEED } = ND;

  // ---------------------------------------------------------------------------
  // Cooperative job queue: heavy sprite generators are JS generators that yield
  // often, so building art is produced in small slices between frames.
  // ---------------------------------------------------------------------------
  class JobQueue {
    constructor() { this.jobs = []; }
    add(gen, done) { const j = { gen, done, finished: false }; this.jobs.push(j); return j; }
    finish(j) {
      if (j.finished) return;
      let r;
      do { r = j.gen.next(); } while (!r.done);
      j.finished = true;
      this.jobs.splice(this.jobs.indexOf(j), 1);
      j.done(r.value);
    }
    run(budgetMs) {
      const t0 = performance.now();
      while (this.jobs.length && performance.now() - t0 < budgetMs) {
        const j = this.jobs[0];
        const r = j.gen.next();
        if (r.done) {
          j.finished = true;
          this.jobs.shift();
          j.done(r.value);
        }
      }
    }
  }
  ND.JobQueue = JobQueue;

  // ---------------------------------------------------------------------------
  // Sequence layer: items laid out right-to-left in a layer coordinate `p`
  // (p = distance of the item's left edge from the layer origin). Screen x of
  // the left edge is round(D*f) + W - p, so everything drifts right as we
  // drive left and new items enter from the left edge.
  // ---------------------------------------------------------------------------
  class Seq {
    constructor(f, make, opts = {}) {
      this.f = f;
      this.make = make;
      this.items = [];
      this.cursor = opts.start != null ? opts.start : -(opts.margin || 80);
      this.margin = opts.margin || 80;
      this.look = opts.lookahead || 0;
      this.script = opts.script ? opts.script.slice() : [];
    }
    shift(D) { return Math.round(D * this.f); }
    x(it, D) { return this.shift(D) + W - it.p; }
    update(D) {
      const s = this.shift(D);
      while (s + W - this.cursor > -this.margin - this.look) {
        const it = this.script.length ? this.script.shift()(this) : this.make(this);
        it.p = this.cursor + it.w;
        this.cursor = it.p + (it.gap || 0);
        this.items.push(it);
        if (it.onSpawn) it.onSpawn(it);
      }
      while (this.items.length && this.x(this.items[0], D) > W + this.margin) {
        const it = this.items.shift();
        if (it.onRemove) it.onRemove(it);
      }
    }
  }
  ND.Seq = Seq;

  // ---------------------------------------------------------------------------
  class World {
    constructor(seed = 1985, opts = {}) {
      this.seed = seed;
      this.r = ND.rng(seed);
      this.tick = 0;
      this.D = 0;
      this.jobs = new JobQueue();
      this.buildCache = new Map();

      this.weather = new ND.Weather(seed + 99, opts.weather);
      this.rain = new ND.Rain(seed + 5);
      this.air = new ND.Aircraft(seed + 8);
      this.sky = new ND.Sky(seed + 1);
      this.makePools();
      this.makeSkyline();
      this.makeBuildings();
      this.makeCurb();
      this.makeForeground();
      this.walkers = [];
      this.traffic = [];
      this.hero = {
        body: ND.genHeroCar(),
        wheels: ND.genWheelFrames(),
        driver: ND.genDriver(),
        glass: ND.genWindowGlass(seed + 44),
        arm: ND.genDriverArm(),
        x: 206,
        y: Y.CAR - ND.HERO.H + 1,
        angle: 0,
        bob: 0,
        nod: 0,
        armTh: 0.12,
        smoke: [],
        spray: [],
        armOut: 1,   // 1 = arm out of the window, 0 = pulled inside
        window: 0,   // 0 = window down, 1 = up
      };
      this.fxr = ND.rng(seed + 333);
      this.nextWalker = 0;
      this.nextCar = 0;
      this.initialPopulation();
      this.update(0, true);
      // finish everything needed for the first frame synchronously
      while (this.jobs.jobs.length) this.jobs.finish(this.jobs.jobs[0]);
    }

    makePools() {
      const r = ND.rng(this.seed + 7);
      this.people = [];
      for (let i = 0; i < 26; i++) this.people.push(ND.genPerson(r.int(1, 1e9), i % 3 === 0 ? 'sil' : 'lit'));
      this.idlers = [];
      for (let i = 0; i < 18; i++) this.idlers.push(ND.genPerson(r.int(1, 1e9), i % 2 ? 'sil' : 'lit'));
      this.heroWalker = ND.genHeroWalker(4242);
      this.palms = [];
      for (let i = 0; i < 7; i++) this.palms.push(ND.genPalm(r.int(1, 1e9), { h: i < 3 ? r.int(200, 240) : r.int(150, 210) }));
      this.lamps = [ND.genLamp(11, 'globe'), ND.genLamp(12, 'cobra'), ND.genLamp(13, 'globe')];
      this.planters = [];
      for (let i = 0; i < 5; i++) this.planters.push(ND.genPlanter(r.int(1, 1e9)));
      this.bushes = [];
      for (let i = 0; i < 8; i++) this.bushes.push(ND.genBush(r.int(1, 1e9)));
      this.trafficPool = [];
      for (let i = 0; i < 7; i++) this.trafficPool.push(ND.genTraffic(r.int(1, 1e9)));
      this.trafficPool.push(ND.genTraffic(77, { kind: 'coupe' }));
      this.trafficPool[0] = ND.genTraffic(99, { kind: 'coupe', color: [110, 16, 34] });
      this.lampHalo = ND.genHaloGlow(30, [255, 170, 80], 0.55);
      this.lampPool = ND.genPool(90, 18, [255, 170, 90], 0.55);
      this.spill = {};
    }

    spillFor(c) {
      const k = c.map((v) => v | 0).join(',');
      if (!this.spill[k]) this.spill[k] = ND.genSpill(c);
      return this.spill[k];
    }

    // --- skyline ---------------------------------------------------------------
    makeSkyline() {
      const fs = [0.0625, 0.125, 0.25];
      this.skyLayers = fs.map((f, d) => {
        const r = ND.rng(this.seed * 31 + d);
        let bridgeCooldown = 3;
        const T = (w, top, o = {}) => () => ND.genTower(r.int(1, 1e9), d, { w, top, ...o });
        const scripts = {
          1: [T(38, 112, { neon: 'cyan', gap: 6 }), T(44, 66, { neon: 'pink', mode: 'edges', gap: 10 }), T(34, 128, { gap: 22 }),
            T(40, 34, { style: 'flat', lit: 0.6, gap: 8 }), T(30, 96, { gap: 14 })],
          2: [T(52, 150, { gap: 4 }), T(46, 128, { neon: 'magenta', mode: 'edges', gap: 30 }), T(60, 164, { gap: 12 })],
        };
        return new Seq(f, () => {
          if (d === 2 && --bridgeCooldown <= 0 && r() < 0.18) {
            bridgeCooldown = 10;
            return ND.genBridge(r.int(1, 1e9));
          }
          return ND.genTower(r.int(1, 1e9), d);
        }, { margin: 60, start: 0, script: scripts[d] || [] });
      });
    }

    // --- street buildings ------------------------------------------------------
    makeBuildings() {
      const r = ND.rng(this.seed * 17 + 3);
      this.bRng = r;
      this.sinceHero = 0;
      const heroHotel = () => ({
        kind: 'hotel', key: 'colony', seed: 1985, w: 252, floors: 4, floorH: 38, groundH: 66, parapetH: 12, crownH: 0,
        pal: ND.PALETTES.lavender, neonA: 'pink', neonB: 'pink', finX: 108, finW: 18,
        blade: 'COLONY', bladeY: 34, bladeLetters: 'cyan', bladeBorder: 'blue', box: 'HOTEL', boxNeon: 'pink',
        canopyNeon: 'pink', store: 'restaurant', neonPalm: 22, litP: 0.35, roofNeon: false,
      });
      const heroBar = () => ({
        kind: 'bar', key: 'bar', seed: 77, w: 156, floors: 2, pal: ND.PALETTES.lilac, neonA: 'cyan', neonB: 'red', sign: 'BAR', store: 'bar', signDX: -6,
      });
      this.heroSpecs = { hotel: heroHotel, bar: heroBar };
      const self = this;
      const spawnSpec = (spec, gap) => (seq) => self.buildingItem(spec, gap);
      this.buildings = new Seq(0.5, () => this.randomBuilding(), {
        margin: 40,
        lookahead: 420,
        start: -30,
        script: [
          () => this.gapItem(240, 0),
          spawnSpec(heroBar(), 2),
          spawnSpec(heroHotel(), 0),
        ],
      });
    }

    pickName(list) {
      const r = this.bRng;
      this.recent = this.recent || [];
      let n;
      for (let k = 0; k < 12; k++) {
        n = r.pick(list);
        if (!this.recent.includes(n)) break;
      }
      this.recent.push(n);
      if (this.recent.length > 8) this.recent.shift();
      return n;
    }

    randomBuilding() {
      const r = this.bRng;
      this.sinceHero++;
      if (this.sinceHero > 18 && r() < 0.3) {
        this.sinceHero = 0;
        return this.buildingItem(this.heroSpecs.hotel(), r.int(0, 3));
      }
      const t = r();
      const gap = r() < 0.75 ? r.int(0, 3) : r.int(8, 22);
      if (t < 0.14) return this.gapItem(r.int(60, 220), 0);
      const seed = r.int(1, 1e9);
      let kind = t < 0.52 ? 'hotel' : t < 0.68 ? 'bar' : t < 0.92 ? 'shop' : 'motel';
      if (kind === this.lastKind && kind !== 'hotel') kind = 'hotel';
      this.sinceMotel = (this.sinceMotel || 0) + 1;
      if (kind === 'motel' && this.sinceMotel < 8) kind = 'shop';
      if (kind === 'motel') this.sinceMotel = 0;
      this.lastKind = kind;
      if (kind === 'hotel') return this.buildingItem({ kind, seed, w: r.int(170, 250), name: r() < 0.8 ? this.pickName(ND.NAMES.hotel) : null }, gap);
      if (kind === 'bar') return this.buildingItem({ kind, seed, w: r.int(120, 170), sign: this.pickName(ND.NAMES.bar) }, gap);
      if (kind === 'shop') return this.buildingItem({ kind, seed, w: r.int(110, 170), sign: this.pickName(ND.NAMES.shop) }, gap);
      return this.buildingItem({ kind, seed, w: r.int(170, 220), sign: r() < 0.7 ? 'MOTEL' : this.pickName(['INN', 'LODGE', 'MOTOR']) }, gap);
    }

    gapItem(w, gap) {
      return { w, gap, isGap: true, data: null, crowd: [], planters: [] };
    }

    buildingItem(spec, gap) {
      const it = { w: spec.w, gap, spec, data: null, crowd: [], planters: [] };
      const key = spec.key;
      const apply = (data) => {
        it.data = data;
        if (key) this.buildCache.set(key, data);
        this.populateBuilding(it);
      };
      if (key && this.buildCache.has(key)) {
        it.data = this.buildCache.get(key);
        it.onSpawn = () => this.populateBuilding(it);
      } else {
        it.job = this.jobs.add(ND.BUILDING_GEN[spec.kind](spec), apply);
      }
      return it;
    }

    populateBuilding(it) {
      const r = ND.rng((it.spec.seed | 0) + this.tick);
      it.crowd = [];
      it.planters = [];
      const d = it.data;
      const busy = d.kind === 'bar' || it.spec.store === 'restaurant' || it.spec.store === 'bar';
      for (const x of d.crowd) {
        if (r() > (busy ? 0.6 : 0.3)) continue;
        const p = r.pick(this.idlers);
        it.crowd.push({ x, p, face: r() < 0.5 ? 'idleR' : 'idleL', ph: r.int(0, 3), rate: r.int(28, 50), y: r.int(0, 3) });
      }
      if (d.kind === 'hotel' && r() < 0.8) {
        const n = r.int(1, 2);
        for (let i = 0; i < n; i++) it.planters.push({ x: r.int(0, it.w - 30), p: r.pick(this.planters) });
      }
      if (it.spec.key === 'colony') {
        it.planters = [{ x: 60, p: this.planters[0] }, { x: 150, p: this.planters[1] }];
      }
    }

    // --- curb: palms & lamps ------------------------------------------------------
    makeCurb() {
      const r = ND.rng(this.seed * 13 + 5);
      const palm = (i, gap) => () => ({ w: 16, gap, type: 'palm', palm: this.palms[i % this.palms.length], ph: r() * 8 });
      const lamp = (i, gap) => () => ({ w: 12, gap, type: 'lamp', lamp: this.lamps[i % this.lamps.length] });
      this.curb = new Seq(0.75, () => {
        const t = r();
        if (t < 0.55) return { w: 16, gap: r.int(40, 150), type: 'palm', palm: r.pick(this.palms), ph: r() * 8 };
        return { w: 12, gap: r.int(40, 120), type: 'lamp', lamp: r.pick(this.lamps) };
      }, {
        margin: 150,
        start: -60,
        script: [palm(3, 70), lamp(2, 88), lamp(0, 106), palm(4, 78), lamp(1, 69), palm(0, 159), palm(1, 60)],
      });
    }

    makeForeground() {
      const r = ND.rng(this.seed * 19 + 11);
      this.fg = new Seq(1.5, () => {
        const b = r.pick(this.bushes);
        return { w: b.width * 2, gap: r.int(-40, 160), img: b, dy: r.int(0, 18) };
      }, { margin: 240, start: -200 });
    }

    // --- pedestrians ----------------------------------------------------------------
    spawnWalker(atX, opts = {}) {
      const r = this.r;
      const lane = opts.lane != null ? opts.lane : r() < 0.5 ? 0 : 1;
      const y = lane === 0 ? 239 + r.int(0, 2) : 245 + r.int(0, 2);
      const f = ND.fAt(y);
      const dir = opts.dir || (r() < 0.5 ? 1 : -1); // +1 walks left (with traffic)
      const v = dir * r.range(0.85, 1.1) * (1 + this.weather.v.rain * 0.55);
      const x = atX != null ? atX : -40;
      const P = this.D - (x - CX) / f;
      const umb = opts.sprite === this.heroWalker ? -1 : r() < 0.78 ? r.int(0, 6) : -1;
      this.walkers.push({ P, v, f, y, dir, umb, sp: opts.sprite || r.pick(this.people), ph: r.int(0, 7), rate: Math.round(8 / Math.abs(v)) });
    }

    initialPopulation() {
      const r = this.r;
      this.spawnWalker(78, { lane: 0, dir: -1, sprite: this.heroWalker });
      this.spawnWalker(250, { lane: 1 });
      this.spawnWalker(420, { lane: 0 });
      this.spawnWalker(560, { lane: 1 });
      this.spawnWalker(20, { lane: 1 });
      // traffic: a dark red coupe just behind the hero car, like the reference
      this.spawnCar({ x: 520, v: SPEED - 0.25, sprite: this.trafficPool[0] });
      this.nextWalker = this.tick + r.int(60, 160);
      this.nextCar = this.tick + r.int(600, 1200);
    }

    // --- traffic ----------------------------------------------------------------------
    spawnCar(opts = {}) {
      const r = this.r;
      const f = ND.fAt(Y.FAR);
      const sprite = opts.sprite || r.pick(this.trafficPool);
      const v = opts.v != null ? opts.v : r() < 0.5 ? SPEED + r.range(0.25, 0.6) : SPEED - r.range(0.25, 0.7);
      let x = opts.x;
      if (x == null) x = v > SPEED ? W + 30 : -sprite.w - 30;
      const P = this.D - (x - CX) / f;
      // keep a safe distance from other cars
      for (const c of this.traffic) if (Math.abs(c.P - P) < 260) return false;
      this.traffic.push({ P, v, f, sp: sprite, wa: 0 });
      return true;
    }

    // --- update -----------------------------------------------------------------------
    update(dtTicks = 1, init = false) {
      if (!init) {
        this.tick++;
        this.D += SPEED;
      }
      const D = this.D;
      if (!init) {
        this.weather.update();
        this.rain.update(this.weather, D);
        this.air.update(this.tick, this.weather);
      }
      for (const l of this.skyLayers) l.update(D);
      this.buildings.update(D);
      this.curb.update(D);
      this.fg.update(D);

      // walkers
      for (const w of this.walkers) w.P += w.v * (init ? 0 : 1);
      this.walkers = this.walkers.filter((w) => {
        const x = CX + (D - w.P) * w.f;
        return x < W + 60 && x > -120;
      });
      if (!init && this.tick >= this.nextWalker) {
        if (this.walkers.length < 10 - this.weather.v.rain * 5) this.spawnWalker(null);
        this.nextWalker = this.tick + this.r.int(18, 90);
      }

      // traffic
      // car following: never drive into the car ahead (larger P = further along)
      const lane = this.traffic.slice().sort((a, b) => b.P - a.P);
      for (let i = 0; i < lane.length; i++) {
        const me = lane[i];
        if (me.v0 == null) me.v0 = me.v;
        const ahead = lane[i - 1];
        const gap = ahead ? ahead.P - ahead.sp.w / ahead.f - me.P : Infinity;
        if (gap < 60) me.v = Math.min(me.v, ahead.v - 0.05);
        else if (gap < 140) me.v += (Math.min(me.v0, ahead.v) - me.v) * 0.05;
        else me.v += (me.v0 - me.v) * 0.01;
      }
      for (const c of this.traffic) {
        c.P += c.v * (init ? 0 : 1);
        c.wa += c.v / 10;
      }
      this.traffic = this.traffic.filter((c) => {
        const x = CX + (D - c.P) * c.f;
        return x < W + 80 && x > -c.sp.w - 80;
      });
      if (!init && this.tick >= this.nextCar) {
        if (this.traffic.length < 2) this.spawnCar();
        this.nextCar = this.tick + this.r.int(420, 1400);
      }

      // hero car: wheel spin, gentle suspension and drift
      const hero = this.hero;
      hero.angle += SPEED / ND.HERO.WHEEL_R;
      const t = this.tick / 60;
      hero.dx = Math.round(Math.sin(t * 0.13) * 5 + Math.sin(t * 0.041 + 1) * 7);
      const bump = ND.hash(Math.floor(this.tick / 97), 5) < 0.35 && this.tick % 97 < 6;
      hero.bob = bump ? 1 : 0;

      // the driver's arm hangs out of the window and sways with the ride
      const sinceBump = this.tick % 97;
      const kick = ND.hash(Math.floor(this.tick / 97), 5) < 0.35 ? Math.exp(-sinceBump / 14) * Math.sin(sinceBump * 0.35) * 0.09 : 0;
      hero.armTh = 0.12 + 0.07 * Math.sin(t * 1.7) + 0.03 * Math.sin(t * 4.1 + 1) + kick;
      // rain: the arm comes in first, then the window goes up (and the reverse)
      const wet = this.weather.v.rain > 0.4;
      if (wet) {
        hero.armOut = Math.max(0, hero.armOut - 1 / 24);
        if (hero.armOut === 0) hero.window = Math.min(1, hero.window + 1 / 80);
      } else {
        hero.window = Math.max(0, hero.window - 1 / 80);
        if (hero.window === 0) hero.armOut = Math.min(1, hero.armOut + 1 / 24);
      }
      // cigarette smoke, whisked back by the wind (car-local coordinates)
      const A = hero.arm, fr = A.frames[ND.clamp(Math.round(((hero.armTh - A.th0) / (A.th1 - A.th0)) * (A.N - 1)), 0, A.N - 1)];
      const fx = this.fxr, rain = this.weather.v.rain;
      if (!init && hero.armOut > 0.99) {
        hero.smoke.push({ x: fr.tip[0], y: fr.tip[1] - 0.4, vx: 0.35 + fx() * 0.4, vy: -0.42 - fx() * 0.3, age: 0, life: (50 + fx() * 34) * (1 - rain * 0.5), ph: fx() * 6.28 });
      }
      if (!init && hero.armOut > 0.99 && fx() < 1 / 420) {
        const n = 2 + Math.floor(fx() * 3);
        for (let i = 0; i < n; i++) hero.smoke.push({ x: fr.tip[0], y: fr.tip[1], vx: 1.8 + fx() * 1.6, vy: (fx() - 0.6) * 0.5, age: 0, life: 9 + fx() * 12, ph: 0, spark: true });
      }
      for (const p of hero.smoke) {
        p.x += p.vx;
        p.y += p.vy + Math.sin(p.age * 0.22 + p.ph) * 0.12;
        if (!p.spark) {
          p.vx = Math.min(1.3, p.vx + 0.02); // the slipstream catches it
          p.vy *= 0.985;
        }
        p.age++;
      }
      hero.smoke = hero.smoke.filter((p) => p.age < p.life);

      // tyres throw spray off the wet road (car-local coordinates)
      if (!init && rain > 0.08) {
        for (const [wx] of ND.HERO.WHEELS) {
          const n = rain * 5.5;
          for (let k = 0; k < Math.floor(n) + (fx() < n % 1 ? 1 : 0); k++) {
            hero.spray.push({ x: wx + 10 + fx() * 12, y: 71 + fx() * 4, vx: 1.6 + fx() * 3.6, vy: -0.7 - fx() * 1.8, age: 0, life: 12 + fx() * 18 });
          }
        }
      }
      for (const p of hero.spray) { p.x += p.vx; p.y += p.vy; p.vy += 0.11; p.vx *= 0.97; p.age++; }
      hero.spray = hero.spray.filter((p) => p.age < p.life && p.y < 90);

      // wind: palms sway harder, clouds race in storms
      this.sway = (this.sway || 0) + (2.2 + this.weather.v.storm * 5 + this.weather.v.rain * 1.5) / 60;
      this.cloudShift = (this.cloudShift || 0) + 1 + this.weather.v.storm * 5 + this.weather.v.rain * 1.5;
    }

    // run a slice of queued generation work
    work(budgetMs) { this.jobs.run(budgetMs); }
  }

  ND.World = World;
})();
