  <script>/* src/art/palms.js */
/* Neon Drive — palm trees (silhouettes with neon rim light, swaying crowns),
 * planter palms and shrubs. */
(function () {
  'use strict';
  const ND = window.ND;
  const { rgb } = ND;

  const FRAMES = 8;

  const DARK = {
    frond: rgb('#130b1f'), frond2: rgb('#1b1029'), rachis: rgb('#1e1230'),
    trunk: rgb('#1c1128'), ring: rgb('#0e0816'), coco: rgb('#24121c'),
  };
  const RIMS = [rgb('#3e1646'), rgb('#1e2c52'), rgb('#341a50'), rgb('#4a183a'), rgb('#1a3450')];

  function drawFrond(pb, cx, cy, ang, L, droop, leaf, cols, rim, rimSide, seedN) {
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const pt = (s) => [cx + dx * L * s, cy + dy * L * s + droop * L * s * s];
    const steps = Math.ceil(L * 1.2);
    // leaflets first, rachis on top
    for (let i = 3; i <= steps; i++) {
      const s = i / steps;
      if (i % 2) continue;
      const [px, py] = pt(s);
      let tx = dx * L, ty = dy * L + 2 * droop * L * s;
      const tl = Math.hypot(tx, ty); tx /= tl; ty /= tl;
      const nx = -ty, ny = tx;
      const ll = leaf * Math.sin(Math.PI * Math.min(1, s * 1.1)) * (1 - 0.35 * s) + 1;
      for (const side of [-1, 1]) {
        let lx = nx * side * 0.62 + tx * 0.55, ly = ny * side * 0.62 + ty * 0.55 + 0.75;
        const n = Math.hypot(lx, ly); lx /= n; ly /= n;
        const jitter = (ND.hash(i, side + 5, seedN) - 0.5) * 1.6;
        const ex = px + lx * (ll + jitter), ey = py + ly * (ll + jitter);
        const upper = ly < 0.2;
        pb.lineFn(px, py, ex, ey, (x, y, t) => {
          let c = t > 0.6 ? cols.frond2 : cols.frond;
          if (rim && ((side === rimSide && t > 0.45) || (upper && t > 0.6))) c = ND.mix(c, rim, 0.35 + t * 0.4);
          pb.set(x, y, ND.pack(c[0], c[1], c[2]));
        });
      }
    }
    for (let i = 0; i < steps; i++) {
      const [x0, y0] = pt(i / steps), [x1, y1] = pt((i + 1) / steps);
      const c = cols.rachis;
      pb.line(x0, y0, x1, y1, ND.pack(c[0], c[1], c[2]));
      if (i < steps * 0.3) pb.line(x0, y0 + 1, x1, y1 + 1, ND.pack(c[0], c[1], c[2]));
    }
  }

  // Tall street palm: trunk sprite + FRAMES crown sprites.
  function genPalm(seed, opts = {}) {
    const r = ND.rng(seed);
    const h = opts.h || r.int(150, 235);
    const lean = opts.lean != null ? opts.lean : r.range(-0.16, 0.16);
    const bend = r.range(-10, 10);
    const rim = r.pick(RIMS);
    const rimSide = r.chance(0.5) ? -1 : 1;
    const cols = opts.cols || DARK;
    // trunk
    const topDX = lean * h + bend * 0.2;
    const tw = Math.ceil(Math.abs(topDX) + Math.abs(bend) + 24);
    const bx = topDX < 0 ? tw - 12 : 12;
    const tpb = new ND.PB(tw, h + 2);
    let topX = bx;
    for (let yy = 0; yy <= h; yy++) {
      const s = yy / h;
      const xc = bx + lean * h * s + bend * Math.sin(Math.PI * s);
      if (yy === h) topX = xc;
      const half = (8.5 - 4 * s) / 2 + Math.max(0, 0.05 - s) * 40;
      const y = h - yy;
      for (let x = Math.floor(xc - half); x <= Math.ceil(xc + half); x++) {
        const u = (x - (xc - half)) / (2 * half);
        if (u < -0.1 || u > 1.1) continue;
        let c = cols.trunk;
        const ringRow = (yy + Math.round(u * 2.5)) % 5 === 0;
        if (ringRow) c = cols.ring;
        if (rimSide > 0 && u > 0.72) c = ND.mix(c, rim, ringRow ? 0.25 : 0.6);
        if (rimSide < 0 && u < 0.28) c = ND.mix(c, rim, ringRow ? 0.25 : 0.6);
        tpb.set(x, y, ND.pack(c[0], c[1], c[2]));
      }
    }
    const trunk = ND.sprite(tpb, null);
    // crown frames
    const L = opts.L || r.range(58, 80);
    const leaf = opts.leaf || r.range(12, 16);
    const S = Math.ceil((L + leaf) * 2 + 10);
    const cx = S / 2, cy = S / 2 - 6;
    const fronds = [];
    const nUp = r.int(9, 12), nDown = r.int(3, 5);
    for (let i = 0; i < nUp; i++) {
      const a = -Math.PI + (i + 0.5) / nUp * Math.PI + r.range(-0.12, 0.12);
      fronds.push({ a, L: L * r.range(0.75, 1.05), droop: r.range(0.45, 0.85), ph: r() * 6.28 });
    }
    for (let i = 0; i < nDown; i++) {
      const a = 0.35 + (i + 0.5) / nDown * (Math.PI - 0.7) + r.range(-0.15, 0.15);
      fronds.push({ a, L: L * r.range(0.5, 0.75), droop: r.range(0.1, 0.35), ph: r() * 6.28 });
    }
    // draw back-to-front: downward fronds first
    fronds.sort((p, q) => Math.sin(q.a) - Math.sin(p.a));
    const crowns = [];
    for (let k = 0; k < FRAMES; k++) {
      const pb = new ND.PB(S, S);
      const ph = (k / FRAMES) * Math.PI * 2;
      fronds.forEach((f, idx) => {
        const sway = Math.sin(ph + f.ph) * 0.045 + Math.sin(ph) * 0.03;
        drawFrond(pb, cx, cy, f.a + sway, f.L, f.droop + Math.sin(ph + f.ph + 1) * 0.04, leaf, cols, rim, rimSide, seed + idx);
      });
      // crown bulb + coconuts
      pb.disc(cx, cy + 2, 3.5, ND.pack(cols.frond[0], cols.frond[1], cols.frond[2]));
      for (let i = 0; i < 4; i++) {
        const c = cols.coco;
        pb.disc(cx - 3 + i * 2, cy + 5 + (i % 2), 1.6, ND.pack(c[0], c[1], c[2]));
      }
      crowns.push(pb.canvas());
    }
    return {
      trunk,
      crowns,
      S,
      bx,          // trunk base x inside trunk sprite
      h,
      topDX: topX - bx, // crown offset from base
      ccx: cx,
      ccy: cy,
    };
  }

  // Small planter palm / shrub, lit warmly by storefronts.
  function genPlant(seed, lit = true) {
    const r = ND.rng(seed);
    const S = 44;
    const pb = new ND.PB(S, S);
    const cols = lit
      ? { frond: rgb('#2e6a3a'), frond2: rgb('#86c860'), rachis: rgb('#2a4a2a') }
      : { frond: rgb('#120a1c'), frond2: rgb('#1d1230'), rachis: rgb('#1a1026') };
    const rim = lit ? rgb('#ffd070') : rgb('#4a1f5a');
    const n = r.int(7, 10);
    for (let i = 0; i < n; i++) {
      const a = -Math.PI + (i + 0.5) / n * Math.PI + r.range(-0.2, 0.2);
      drawFrond(pb, S / 2, S - 4, a, r.range(12, 19), r.range(0.5, 1.0), r.range(4, 6), cols, rim, r.chance(0.5) ? 1 : -1, seed + i);
    }
    return pb.canvas();
  }

  ND.genPalm = genPalm;
  ND.genPlant = genPlant;
  ND.PALM_FRAMES = FRAMES;
})();

</script>
  <script>/* src/art/people.js */
/* Neon Drive — pedestrians: procedural skeletal walk cycles and idle poses. */
(function () {
  'use strict';
  const ND = window.ND;
  const { rgb } = ND;

  const FW = 30, FH = 60, FOOT = 57; // frame size and foot row
  const WALK_FRAMES = 8;

  const SKIN = [rgb('#f0b898'), rgb('#e2a07e'), rgb('#c07a58'), rgb('#8e5238'), rgb('#6a3a28')];
  const HAIR = [rgb('#f4cc68'), rgb('#e8b24a'), rgb('#5a3020'), rgb('#1c1018'), rgb('#2a1a14'), rgb('#9a3a1c'), rgb('#d0d0d8')];
  const TOPS = [rgb('#8fd0ff'), rgb('#ff9ad0'), rgb('#f4f0ff'), rgb('#ffe070'), rgb('#70f0c0'), rgb('#ff6a6a'), rgb('#b090ff'), rgb('#2a2a3a'), rgb('#ffffff')];
  const BOTTOMS = [rgb('#e8e0f0'), rgb('#26263a'), rgb('#3a4a8a'), rgb('#1a1a24'), rgb('#f0e8d8'), rgb('#6a5a8a')];
  const DRESSES = [rgb('#e0203a'), rgb('#ff4fa8'), rgb('#18121e'), rgb('#20c8d8'), rgb('#f0f0ff'), rgb('#ffcc30'), rgb('#9a40ff')];

  function makeLook(r, kind) {
    const female = r.chance(0.5);
    const look = {
      female,
      skin: r.pick(SKIN),
      hair: r.pick(HAIR),
      hairLong: female ? r.chance(0.8) : r.chance(0.12),
      top: r.pick(TOPS),
      bottom: r.pick(BOTTOMS),
      dress: female && r.chance(0.6) ? r.pick(DRESSES) : null,
      shoes: r.pick([rgb('#141018'), rgb('#f0f0f0'), rgb('#5a3020'), rgb('#e02040')]),
      jacket: !female && r.chance(0.35) ? r.pick([rgb('#f4f0f8'), rgb('#a8d8ff'), rgb('#ffc0e0'), rgb('#e8e0c8')]) : null,
      height: r.range(47, 53) * (female ? 0.97 : 1.02),
      build: r.range(0.9, 1.15),
      sil: kind === 'sil',
      rim: r.pick([rgb('#ff6ad0'), rgb('#6ad8ff'), rgb('#ffb060'), rgb('#c080ff')]),
      prop: r.chance(0.2) ? 'drink' : null,
    };
    if (look.sil) {
      look.silCol = r.pick([rgb('#2a1428'), rgb('#24122a'), rgb('#301a24')]);
      look.rim = r.pick([rgb('#ffb070'), rgb('#ff7ad0'), rgb('#ffd090')]);
    }
    return look;
  }

  // Pose: joint angles in radians (0 = straight down, +ve = forward).
  function walkPose(k) {
    const ph = (k / WALK_FRAMES) * Math.PI * 2;
    const leg = (p) => {
      const thigh = 0.46 * Math.sin(p);
      const knee = 0.12 + 0.85 * Math.pow(Math.max(0, Math.cos(p - 0.35)), 2);
      return { thigh, shin: thigh - knee };
    };
    const arm = (p) => {
      const up = -0.38 * Math.sin(p);
      return { up, fore: up + 0.3 + 0.15 * Math.max(0, -Math.sin(p)) };
    };
    return {
      bob: Math.round(Math.abs(Math.sin(ph)) * 1.2),
      near: leg(ph), far: leg(ph + Math.PI),
      armNear: arm(ph + Math.PI), armFar: arm(ph),
      lean: 0.04,
    };
  }

  function idlePose(k, variant) {
    const ph = (k / 4) * Math.PI * 2;
    const sway = Math.sin(ph) * 0.03;
    const p = {
      bob: 0,
      near: { thigh: 0.05 + sway, shin: 0.03 + sway },
      far: { thigh: -0.08 - sway, shin: -0.06 - sway },
      armNear: { up: 0.08, fore: 0.18 },
      armFar: { up: -0.05, fore: 0.1 },
      lean: sway,
    };
    if (variant === 'drink') p.armNear = { up: 0.55 + Math.sin(ph) * 0.1, fore: 2.3 };
    if (variant === 'talk') p.armNear = { up: 0.35 + Math.max(0, Math.sin(ph * 2)) * 0.25, fore: 1.4 };
    if (variant === 'pocket') { p.armNear = { up: -0.1, fore: 0.6 }; p.armFar = { up: -0.1, fore: 0.6 }; }
    return p;
  }

  function drawFigure(look, pose) {
    const pb = new ND.PB(FW, FH);
    const Hh = look.height;
    const s = Hh / 50;
    const cx = FW / 2 - 1;
    const foot = FOOT;
    const hipY = foot - 24 * s + pose.bob;
    const shY = foot - 40 * s + pose.bob;
    const headY = foot - Hh + 3.5 * s + pose.bob;
    const thighL = 12.5 * s, shinL = 12 * s, upL = 9 * s, foreL = 8.5 * s;
    const lean = pose.lean * 10;
    const hipX = cx, shX = cx + lean + 0.5;
    const sil = look.sil;

    const col = (c, shade = 1) => {
      const base = sil ? look.silCol : c;
      return ND.pack(base[0] * shade, base[1] * shade, base[2] * shade);
    };
    const limb = (x0, y0, a1, l1, a2, l2, r1, r2, c1, c2, shade) => {
      const x1 = x0 + Math.sin(a1) * l1, y1 = y0 + Math.cos(a1) * l1;
      const x2 = x1 + Math.sin(a2) * l2, y2 = y1 + Math.cos(a2) * l2;
      pb.thick(x0, y0, x1, y1, r1, col(c1, shade));
      pb.thick(x1, y1, x2, y2, r2, col(c2, shade));
      return [x2, y2];
    };
    const legCol = look.dress ? look.skin : look.bottom;
    const shoe = look.shoes;
    const drawLeg = (L, shade) => {
      const [ax, ay] = limb(hipX, hipY, L.thigh, thighL, L.shin, shinL, 1.7 * look.build, 1.2, legCol, look.dress ? look.skin : legCol, shade);
      pb.thick(ax - 0.5, ay, ax + 2.5 * s, ay + 0.5, 0.8, col(shoe, shade));
    };
    const armCol = look.jacket || (look.dress ? look.skin : look.top);
    const drawArm = (Ar, shade, front) => {
      const sleeve = look.jacket || (look.dress ? look.skin : look.top);
      const [hx, hy] = limb(shX, shY + 1, Ar.up, upL, Ar.fore, foreL, 1.3 * look.build, 1.0, sleeve, look.jacket ? look.jacket : look.skin, shade);
      pb.disc(hx, hy, 1.0, col(look.skin, shade));
      if (front && look.prop === 'drink') pb.rect(Math.round(hx), Math.round(hy) - 3, 2, 3, col(rgb('#ffd24a'), 1));
    };

    // far limbs
    drawArm(pose.armFar, 0.62, false);
    drawLeg(pose.far, 0.62);
    // torso
    const tw = 3.6 * look.build;
    const torso = [[shX - tw, shY], [shX + tw, shY], [hipX + tw * 0.85, hipY], [hipX - tw * 0.85, hipY]];
    const topCol = look.jacket || look.top;
    pb.polyFn(torso, (x, y) => pb.set(x, y, col(look.dress || topCol, 1)));
    if (look.dress) {
      const hem = hipY + 11 * s;
      const flare = [[hipX - tw * 0.9, hipY - 6], [hipX + tw * 0.9, hipY - 6], [hipX + tw * 1.3 + 1, hem], [hipX - tw * 1.3 - 1, hem]];
      pb.polyFn(flare, (x, y) => pb.set(x, y, col(look.dress, 1)));
    } else {
      pb.rect(Math.round(hipX - tw * 0.85), Math.round(hipY - 2), Math.round(tw * 1.7) + 1, 3, col(look.bottom, 1));
      if (look.jacket) pb.line(shX + 1, shY + 1, shX + 1, hipY - 2, col(look.top, 1));
    }
    drawLeg(pose.near, 1);
    // neck + head
    pb.rect(Math.round(shX - 1), Math.round(shY - 2), 2, 3, col(look.skin, 0.85));
    const hx = shX + 0.5, hy = headY;
    pb.disc(hx, hy, 3.1 * s, col(look.skin, 1));
    pb.set(Math.round(hx + 3.4 * s), Math.round(hy + 0.5), col(look.skin, 1)); // nose
    // hair
    const hc = look.hair;
    pb.discFn(hx - 0.6, hy - 1.2, 3.2 * s, (x, y) => {
      if (y <= hy - 0.5 || x < hx - 1) pb.set(x, y, col(hc, 1));
    });
    if (look.hairLong) {
      for (let y = Math.round(hy); y < Math.round(hy + 7 * s); y++) {
        pb.set(Math.round(hx - 3), y, col(hc, 0.9));
        pb.set(Math.round(hx - 2), y, col(hc, 1));
        if (y < hy + 5) pb.set(Math.round(hx - 1), y, col(hc, 1));
      }
    }
    drawArm(pose.armNear, 1, true);

    // shading: rim light on the facing edge, darker back edge
    const src = pb.d.slice();
    const rim = look.rim;
    for (let y = 0; y < FH; y++)
      for (let x = 0; x < FW; x++) {
        const i = y * FW + x;
        if (!(src[i] >>> 24)) continue;
        const front = x + 1 < FW ? src[i + 1] >>> 24 : 0;
        const back = x > 0 ? src[i - 1] >>> 24 : 0;
        const up = y > 0 ? src[i - FW] >>> 24 : 0;
        const c = [src[i] & 255, (src[i] >> 8) & 255, (src[i] >> 16) & 255];
        let o = c;
        if (sil) {
          // backlit by the storefronts: warm rim on every outer edge
          if (!front || !back) o = ND.mix(c, rim, 0.5);
          else if (!up) o = ND.mix(c, rim, 0.35);
          else o = ND.mix(c, rim, 0.06 + 0.1 * (1 - y / FH));
        } else {
          if (!front) o = ND.mix(c, rim, 0.35);
          else if (!back) o = ND.scale(c, 0.75);
          if (!up) o = ND.mix(o, [255, 255, 255], 0.12);
        }
        pb.set(x, y, ND.pack(o[0], o[1], o[2]));
      }
    return pb;
  }

  // Returns {right:[canvas], left:[canvas]} walk frames plus idle frames.
  function genPerson(seed, kind = 'lit') {
    const r = ND.rng(seed);
    const look = makeLook(r, kind);
    const walkR = [], walkL = [];
    for (let k = 0; k < WALK_FRAMES; k++) {
      const pb = drawFigure(look, walkPose(k));
      walkR.push(pb.canvas());
      walkL.push(pb.flipped().canvas());
    }
    const variant = look.prop === 'drink' ? 'drink' : r.pick(['talk', 'pocket', 'rest', 'talk']);
    const idleR = [], idleL = [];
    for (let k = 0; k < 4; k++) {
      const pb = drawFigure(look, idlePose(k, variant));
      idleR.push(pb.canvas());
      idleL.push(pb.flipped().canvas());
    }
    return { walkR, walkL, idleR, idleL, look, w: FW, h: FH, foot: FOOT };
  }

  // The reference's woman in the red dress.
  function genHeroWalker(seed) {
    const r = ND.rng(seed);
    const look = makeLook(r, 'lit');
    Object.assign(look, {
      female: true, dress: rgb('#e41c34'), hair: rgb('#f6d27a'), hairLong: true,
      skin: rgb('#f0b494'), shoes: rgb('#e41c34'), height: 51, build: 0.95, rim: rgb('#ff7ad8'), prop: null,
    });
    const walkR = [], walkL = [];
    for (let k = 0; k < WALK_FRAMES; k++) {
      const pb = drawFigure(look, walkPose(k));
      walkR.push(pb.canvas());
      walkL.push(pb.flipped().canvas());
    }
    return { walkR, walkL, idleR: walkR.slice(0, 1), idleL: walkL.slice(0, 1), look, w: FW, h: FH, foot: FOOT };
  }

  ND.genPerson = genPerson;
  ND.genHeroWalker = genHeroWalker;
  ND.PERSON = { FW, FH, FOOT, WALK_FRAMES };
})();

  <script>/* src/art/cars.js */
/* Neon Drive — the hero 80s supercar (with driver) and background traffic. */
(function () {
  'use strict';
  const ND = window.ND;
  const { rgb } = ND;

  // ===========================================================================
  // Hero car — white flat-12 wedge with side strakes, facing left.
  // Local coords: 300 x 76, ground contact on row 75.
  // ===========================================================================
  const HW = 300, HH = 76;
  const WHEEL_R = 21;
  const WHEELS = [[66, 54], [246, 54]];

  const TOP = [
    [1, 42], [4, 39.5], [14, 37.6], [34, 35.2], [60, 31.8], [84, 28.6], [100, 26.2], [104, 25.4],
    [118, 15], [130, 6.5], [137, 3], [145, 1.4], [196, 1.2], [203, 2.2], [212, 4.6],
    [232, 9.5], [252, 13.4], [272, 15.8], [288, 17.2], [295, 18.6], [298, 21],
  ];

  function topY(x) {
    if (x <= TOP[0][0]) return TOP[0][1];
    for (let i = 1; i < TOP.length; i++) {
      if (x <= TOP[i][0]) {
        const a = TOP[i - 1], b = TOP[i];
        return a[1] + ((x - a[0]) / (b[0] - a[0])) * (b[1] - a[1]);

  }

  function arch(pts, cx, cy, r, sill) {
    const a0 = Math.asin((sill - cy) / r);
    const a1 = -Math.PI - a0;
    const n = 28;
    for (let i = 0; i <= n; i++) {
      const a = a0 + ((a1 - a0) * i) / n;
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
  }

  function bodyPolygon() {
    const pts = TOP.slice();
    pts.push([299, 30], [299, 50], [298, 58], [296, 61.5], [272, 62]);
    arch(pts, WHEELS[1][0], WHEELS[1][1], 24.5, 62);
    pts.push([220, 62], [92, 62]);

    pts.push([40, 62], [8, 61.5], [3, 60], [0.6, 55], [0.4, 46]);
    return pts;
  }

  // Driver pixel map (facing left). Origin placed at (145, 2).
  const DRIVER = [
    '.....kkkkk.......',
    '....khHHhhdk.....',
    '...khHHhhhhdk....',
    '..khhhhhhhhddk...',
    '..kShhhhhhhdddk..',
    '..SSshhhhhhdddk..',
    '.SSSSshhhhddddk..',
    '.GGGGGGszhdddddk.',
    '..GGgGzszzhddddk.',
    '.SSSssszzzhdddk..',
    'SSSssszz..hddddk.',
    '.SSsssz....dddk..',
    '..ssszz....ddddk.',
    '...zzz.....dddk..',
    '....sz.....dddk..',
    '....sz....cbdk...',
    '...cwbbbbbbbbbB..',
    '..cwwbbbwbbbbbBB.',
    '.cwbbbbwbbbbbbBB.',
    '.cbbbbwbbbbbbbBB.',
    '.cbbbbwbbbbbbbBB.',
    '.cbbbwbbbbbbbbBB.',
    '.bbbbwbbbbbbbbBB.',
    '.bbbbwbbbbbbbbBB.',
    '.bbbbbbbbbbbbbBB.',
  ];
  const DRIVER_PAL = {
    H: rgb('#fff2b0'), h: rgb('#f2c662'), d: rgb('#c48c36'), k: rgb('#7a4e22'),
    S: rgb('#f8c6a6'), s: rgb('#e49c7c'), z: rgb('#a8624e'),
    G: rgb('#0c0a14'), g: rgb('#ff7ad8'),
    c: rgb('#e4f2ff'), w: rgb('#ffffff'), b: rgb('#96c2f0'), B: rgb('#5c80bc'),
  };

  function genHeroCar() {
    const pb = new ND.PB(HW, HH), gl = new ND.PB(HW, HH);
    const poly = bodyPolygon();
    const P = (c) => ND.pack(c[0], c[1], c[2]);

    // ---- underbody shadow between the wheels (we see the dark road under the car)
    for (let y = 60; y < 73; y++)
      for (let x = 30; x < 286; x++) {
        const a = ND.clamp(1 - (y - 60) / 13, 0, 1) * 0.92;
        pb.set(x, y, ND.pack(10, 6, 18, a * 255));
      }

    // ---- body paint
    // bright upper flank, a crisp "horizon" reflection, darker lower flank
    const ramp = [
      [0, rgb('#ffffff')], [0.1, rgb('#f7f4fd')], [0.46, rgb('#e9e4f6')], [0.52, rgb('#dcd6ee')],
      [0.535, rgb('#b9b1d6')], [0.62, rgb('#c4bcdf')], [0.82, rgb('#a69ec6')], [0.93, rgb('#8a82ac')], [1, rgb('#645c86')],
    ];
    const tintTop = rgb('#ffc8ee'), tintLow = rgb('#7fc8ff'), tintWarm = rgb('#ffae8a'), tintMag = rgb('#e89aff');
    pb.polyFn(poly, (x, y) => {
      const ty = topY(x);
      const dt = y - ty;
      let c;
      if (dt < 3.5 && x < 292) {
        // upper surfaces: hood, roof, deck — reflect the pink sky glow
        c = ND.mix(rgb('#fff0fa'), tintTop, 0.3 + (dt / 3.5) * 0.35);

      } else {
        const t = ND.clamp((y - 24) / 38, 0, 1);
        c = ND.grad(ramp, t);
        // environment tints: pink neon from above-behind, cyan from the street, warm lamps low
        c = ND.mix(c, tintTop, ND.clamp(0.28 - t * 0.5, 0, 0.28) * (0.4 + (x / HW) * 0.6));
        c = ND.mix(c, tintMag, ND.clamp(1 - Math.abs(t - 0.62) * 5, 0, 1) * 0.16);
        c = ND.mix(c, tintLow, ND.clamp((t - 0.55) * 0.9, 0, 0.3) * (1 - (x / HW) * 0.7));
        c = ND.mix(c, tintWarm, ND.clamp((t - 0.6) * 0.6, 0, 0.2) * (x / HW));
        // shoulder crease highlight
        if (Math.abs(dt - 4.5) < 0.6 && (x < 104 || x > 208)) c = ND.mix(c, [255, 255, 255], 0.7);
        if (Math.abs(dt - 5.5) < 0.6 && (x < 104 || x > 208)) c = ND.scale(c, 0.93);
        // front fender / rear haunch curvature: darker as the surface turns away
        const fx = Math.min(1, x / 18), rx = Math.min(1, (HW - x) / 14);
        c = ND.scale(c, 0.82 + 0.18 * Math.min(fx, rx));
      }
      if (y >= 61) c = rgb('#4e4870');
      pb.dset(x, y, c, 255, 6);
    });
    // lower body character line
    for (let x = 12; x < 290; x++) {
      if (x > 40 && x < 92) continue;
      if (x > 220 && x < 272) continue;
      pb.set(x, 57, ND.pack(150, 142, 186));
      pb.set(x, 58, ND.pack(118, 110, 158));
    }

    // tail face (slightly darker vertical plane)
    for (let y = 21; y < 61; y++) {
      pb.dset(298, y, rgb('#b4b0cc'), 255, 6);
      pb.dset(297, y, rgb('#d0cce0'), 255, 6);
    }
    // front bumper face / nose lip
    for (let y = 43; y < 61; y++) pb.dset(0, y, rgb('#bdb9d4'), 255, 6);
    pb.hline(4, 44, 60, P(rgb('#3a3654')));
    pb.hline(3, 42, 61, P(rgb('#24203a')));
    for (let x = 6; x < 38; x += 3) pb.set(x, 58, P(rgb('#5a5678'))); // lower grille slots

    // wheel arch interiors (dark) + lip highlight
    for (const [wx, wy] of WHEELS) {
      pb.discFn(wx, wy, 24.5, (x, y, d) => {
        if (y > 62) return;
        if (d > 0.96) pb.set(x, y, P(rgb('#e8e4f4')));
        else pb.set(x, y, P(d > 0.9 ? rgb('#2a2440') : rgb('#110d1a')));
      });
    }

    // ---- greenhouse
    // windshield seen edge-on: dark glass wedge with neon reflections
    const shield = [[98, 26.6], [104, 25.4], [118, 15], [130, 6.5], [137, 3], [141, 3.2], [140, 5], [128, 13], [116, 22], [113, 26.4]];
    pb.polyFn(shield, (x, y) => {
      let c = ND.mix(rgb('#2a2050'), rgb('#120c24'), (y - 3) / 24);
      const s = x + y * 1.4;
      if (s % 19 < 3) c = ND.mix(c, rgb('#ff8ae0'), 0.45);
      else if (s % 19 < 5) c = ND.mix(c, rgb('#8ad8ff'), 0.25);
      pb.set(x, y, ND.pack(c[0], c[1], c[2]));
    });
    const glassDoor = [[117, 26], [128, 15], [136, 8], [142, 4], [172, 4], [172, 26]];
    const glassRear = [[176, 4], [197, 4], [202, 6], [206, 14], [208, 26], [176, 26]];
    pb.polyFn(glassRear, (x, y) => {
      const v = (y - 4) / 22;
      let c = ND.mix(rgb('#3a2f6a'), rgb('#140f28'), v);
      if ((x + y) % 11 < 2) c = ND.mix(c, rgb('#b09ad8'), 0.25);
      pb.set(x, y, ND.pack(c[0], c[1], c[2], 190));
    });
    pb.polyFn(glassDoor, (x, y) => {
      const v = (y - 4) / 22;
      const c = ND.mix(rgb('#2a2250'), rgb('#120e22'), v);
      pb.set(x, y, ND.pack(c[0], c[1], c[2], 165)); // open window: we see through to the far side
    });
    // A-pillar
    pb.lineFn(114, 26, 142, 3, (x, y) => {
      pb.set(x, y, P(rgb('#f0ecfa')));
      pb.set(x + 1, y, P(rgb('#b8b2d2')));
      pb.set(x + 2, y, P(rgb('#1a1628')));
    });
    // windshield top edge highlight
    pb.lineFn(104, 25, 138, 2, (x, y) => pb.set(x, y - 1, P(rgb('#ffffff'))));
    // B-pillar
    for (let y = 3; y < 27; y++) {
      pb.set(173, y, P(rgb('#1c1830')));
      pb.set(174, y, P(rgb('#2c2842')));
      pb.set(175, y, P(rgb('#48446a')));
    }
    // window frame / beltline rubber
    pb.hline(106, 208, 26, P(rgb('#1e1a2e')));
    pb.hline(106, 208, 27, P(rgb('#fdfbff')));
    // roof edge
    pb.hline(139, 200, 3, P(rgb('#cfc8e4')));
    // fuel filler on the buttress
    pb.discFn(216, 15, 4.2, (x, y, d) => { if (d > 0.72) pb.set(x, y, P(rgb('#b8b2d0'))); });
    pb.set(213, 13, P(rgb('#ffffff')));

    // ---- interior visible through the open window
    // steering wheel + dash
    pb.thick(129, 12, 131, 24, 0.9, P(rgb('#0e0a16')));
    pb.thick(111, 22, 132, 20, 1.2, P(rgb('#16121e')));
    pb.set(126, 20, P(rgb('#6ae8ff')));
    gl.set(126, 20, ND.pack(60, 180, 220));
    // seat back / headrest
    for (let y = 6; y < 26; y++) for (let x = 162; x < 171; x++) {
      if (y < 9 && (x < 164 || x > 168)) continue;
      pb.set(x, y, P(x === 162 ? rgb('#3a3450') : rgb('#1a1626')));
    }

    // ---- driver
    const ox = 145, oy = 2;
    DRIVER.forEach((row, yy) => {
      for (let xx = 0; xx < row.length; xx++) {
        const ch = row[xx];
        if (ch === '.') continue;
        const c = DRIVER_PAL[ch];
        if (oy + yy >= 26) continue;
        pb.set(ox + xx, oy + yy, P(c));
      }
    });
    // arm resting on the door, hand hanging outside
    const skin = rgb('#eaa888'), skinD = rgb('#b87060');
    pb.thick(156, 19, 145, 25, 2.1, P(rgb('#96c2f0')));
    pb.thick(157, 19, 147, 24, 0.6, P(rgb('#ffffff')));
    pb.thick(145, 25, 140, 26, 1.6, P(skin));
    pb.thick(140, 27, 137, 32, 1.4, P(skin));
    pb.set(138, 28, P(rgb('#ffd24a'))); pb.set(139, 28, P(rgb('#c89020'))); // watch
    pb.disc(136.5, 33, 1.6, P(skin));
    pb.set(135, 34, P(skinD)); pb.set(137, 35, P(skinD));
    pb.set(141, 25, P(rgb('#ffe0c8')));

    // ---- side strakes
    for (let i = 0; i < 7; i++) {
      const y = 35 + i * 3;
      const xs = Math.round(111 + i * 0.6), xe = Math.round(196 - i * 0.4);
      for (let x = xs; x <= xe; x++) {
        const intake = x > 176;
        pb.set(x, y, P(intake ? rgb('#f2f0f8') : rgb('#ffffff')));
        pb.set(x, y + 1, P(intake ? rgb('#8e8aaa') : rgb('#d6d2e6')));

    pb.lineFn(105, 28, 107, 60, (x, y) => pb.set(x, y, P(rgb('#9894b4'))));
    for (let y = 28; y < 60; y++) if (y < 35 || y > 56) pb.set(173, y, P(rgb('#9894b4')));
    // door handle hidden in strakes; small key lock
    pb.set(169, 31, P(rgb('#8a86a6')));

    // ---- side mirror on the A-pillar
    pb.thick(121, 21, 124, 20, 0.8, P(rgb('#2a2440')));
    pb.polyFn([[112, 16], [120, 15], [122, 17], [121, 22], [113, 22], [111, 20]], (x, y) => {
      const c = y < 18 ? rgb('#ffffff') : y < 20 ? rgb('#e8e4f4') : rgb('#b8b4d0');

    });

    pb.hline(113, 120, 23, P(rgb('#5a5480')));

    // ---- lights
    const amber = rgb('#ffa21e'), red = rgb('#ff2438');

      pb.set(x, y, P(c));

    for (let x = 277; x <= 282; x++) { pb.set(x, 44, P(red)); gl.set(x, 44, ND.pack(200, 20, 40)); }

    const body = ND.sprite(pb, gl);

  }

  // Five-spoke star rims with motion blur; 12 frames cover 72 degrees.
  function genWheelFrames(R = WHEEL_R, spokes = 5, blur = 0.2) {
    const S = R * 2 + 1;
    const frames = [];
    const nF = 12;
    const period = (Math.PI * 2) / spokes;
    for (let f = 0; f < nF; f++) {
      const pb = new ND.PB(S, S);
      const th = (f / nF) * period;
      for (let y = 0; y < S; y++)
        for (let x = 0; x < S; x++) {
          const dx = x - R, dy = y - R;
          const d = Math.hypot(dx, dy);
          if (d > R + 0.4) continue;
          const ang = Math.atan2(dy, dx);
          const light = 0.5 - 0.5 * Math.cos(ang + Math.PI * 0.75); // lit from upper-left
          let c;
          const rr = d / R;
          if (rr > 0.9) {
            c = ND.mix(rgb('#100c16'), rgb('#3a344c'), Math.pow(light, 3) * 0.9);
          } else if (rr > 0.71) {
            c = ND.mix(rgb('#1a1524'), rgb('#2c2638'), light * 0.8);
            if (rr > 0.86 && rr < 0.9) c = ND.mix(c, rgb('#3c364e'), 0.5);
          } else if (rr > 0.66) {
            c = ND.mix(rgb('#7a7a92'), rgb('#f0f0fa'), light);
          } else {
            // rim face: spokes with motion blur
            let cover = 0;
            const samples = 4;
            for (let k = 0; k < samples; k++) {
              const a = ang - th + (k / samples) * blur;
              let m = ((a % period) + period) % period;
              if (m > period / 2) m -= period;
              const halfW = (2.9 - d * 0.07) / Math.max(1.5, d);
              if (Math.abs(m) < halfW + 0.02 && d > 3) cover++;
            }
            cover /= samples;
            let gap = rgb('#1c1828');
            if (d > 7 && d < 12.5) gap = ND.mix(rgb('#3c3850'), rgb('#56526a'), light * 0.5); // brake disc
            if (d > 8 && d < 12.5 && ang > -1.0 && ang < -0.2) gap = rgb('#2a2636'); // caliper (fixed)
            const spoke = ND.mix(rgb('#8c8ca4'), rgb('#e6e6f2'), light);
            c = ND.mix(gap, spoke, cover);
            if (d <= 4.6) c = ND.mix(rgb('#8c8ca4'), rgb('#dcdcea'), light);
            if (d <= 2.6) c = rgb('#f2c230');
            if (d <= 1.0) c = rgb('#3a2a10');
          }
          pb.set(x, y, ND.pack(c[0], c[1], c[2]));
        }
      frames.push(pb.canvas());
    }
    return { frames, R, S, period };
  }

  // ===========================================================================
  // Traffic — boxy 80s cars at background-lane scale, facing left.
  // ===========================================================================
  const TW = 162, TH = 48, TG = 47;
  const PROFILES = {
    sedan: {
      top: [[0, 27], [3, 22], [16, 20], [40, 18.5], [50, 17.5], [60, 8], [64, 6.5], [100, 6.5], [106, 8], [116, 17.5], [146, 18.5], [157, 19.5], [160, 22]],
      windows: [[[53, 17], [62, 9], [80, 9], [80, 17]], [[83, 9], [99, 9], [104, 11], [112, 17], [83, 17]]],
    },
    coupe: {
      top: [[0, 26], [3, 21.5], [20, 19.5], [46, 18], [60, 9], [66, 7], [92, 7], [122, 14.5], [150, 17.5], [158, 19], [160, 22]],
      windows: [[[53, 17], [62, 10], [84, 9], [84, 17]], [[87, 9], [92, 9], [114, 15.5], [87, 16]]],
    },
    wagon: {
      top: [[0, 27], [3, 22], [16, 20], [40, 18.5], [50, 17.5], [60, 8], [64, 6.5], [146, 6.5], [152, 9], [156, 18.5], [160, 22]],
      windows: [[[53, 17], [62, 9], [80, 9], [80, 17]], [[83, 9], [110, 9], [110, 17], [83, 17]], [[113, 9], [144, 9], [148, 12], [150, 17], [113, 17]]],
    },
  };
  const TRAFFIC_COLS = [rgb('#7a1424'), rgb('#b8bccc'), rgb('#1a1822'), rgb('#1c2a58'), rgb('#1a7078'), rgb('#24483a'), rgb('#5a1a3a'), rgb('#b08a48'), rgb('#3a1a60')];

  function trafficTop(top, x) {
    if (x <= top[0][0]) return top[0][1];
    for (let i = 1; i < top.length; i++) {
      if (x <= top[i][0]) {
        const a = top[i - 1], b = top[i];
        return a[1] + ((x - a[0]) / (b[0] - a[0])) * (b[1] - a[1]);
      }
    }
    return 22;
  }

  function genTraffic(seed, opts = {}) {
    const r = ND.rng(seed);
    const kind = opts.kind || r.pick(['sedan', 'sedan', 'coupe', 'wagon', 'coupe']);
    const special = opts.special || (r.chance(0.08) ? 'taxi' : r.chance(0.05) ? 'police' : null);
    const prof = PROFILES[special ? 'sedan' : kind];
    let base = opts.color || (special === 'taxi' ? rgb('#f0b818') : special === 'police' ? rgb('#16161e') : r.pick(TRAFFIC_COLS));
    const pb = new ND.PB(TW, TH), gl = new ND.PB(TW, TH);
    const P = (c) => ND.pack(c[0], c[1], c[2]);

  <script>/* src/art/props.js */
/* Neon Drive — street furniture: lamps, planters, foreground foliage, light pools. */
(function () {
  'use strict';
  const ND = window.ND;
  const { rgb } = ND;

  // Street lamp. type 'globe' (Deco post) or 'cobra' (arm over the street).
  function genLamp(seed, type) {
    const r = ND.rng(seed);
    type = type || (r.chance(0.6) ? 'globe' : 'cobra');
    const h = r.int(112, 124);
    const w = type === 'cobra' ? 22 : 11;
    const pb = new ND.PB(w, h + 4), gl = new ND.PB(w, h + 4);
    const P = (c) => ND.pack(c[0], c[1], c[2]);
    const pole = rgb('#1e1630'), poleL = rgb('#3a2a52'), poleR = rgb('#130d1e');
    const px = type === 'cobra' ? w - 5 : 4;
    for (let y = 8; y < h + 4; y++) {
      pb.set(px, y, P(poleL));
      pb.set(px + 1, y, P(pole));
      pb.set(px + 2, y, P(poleR));
    }
    // base
    for (let y = h - 2; y < h + 4; y++) for (let x = px - 1; x <= px + 3; x++) pb.set(x, y, P(x === px - 1 ? poleL : pole));
    let light;
    if (type === 'globe') {
      // collar + globe
      pb.hline(px - 1, px + 3, 9, P(poleL));
      pb.hline(px - 1, px + 3, 10, P(pole));
      const gx = px + 1, gy = 4;
      pb.discFn(gx, gy, 3.6, (x, y, d) => {
        const c = ND.mix(rgb('#fffbe8'), rgb('#ffb454'), Math.pow(d, 1.5));
        pb.set(x, y, P(c));
        gl.set(x, y, ND.pack(255, 200 - d * 60, 120 - d * 80));
      });
      light = [gx, gy];
    } else {
      // curved arm to the left with a cobra head
      const pts = [];
      for (let i = 0; i <= 10; i++) {
        const t = i / 10;
        pts.push([px + 1 - t * 14, 10 - Math.sin(t * Math.PI * 0.5) * 6]);
      }
      for (let i = 0; i + 1 < pts.length; i++) pb.line(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], P(poleL));
      const hx = Math.round(pts[10][0]), hy = Math.round(pts[10][1]);
      pb.rect(hx - 4, hy - 1, 8, 3, P(pole));
      pb.hline(hx - 4, hx + 3, hy - 1, P(poleL));
      for (let x = hx - 3; x <= hx + 2; x++) {
        pb.set(x, hy + 2, P(rgb('#fff0c0')));
        gl.set(x, hy + 2, ND.pack(255, 200, 110));
      }
      light = [hx, hy + 2];
    }
    return { spr: ND.sprite(pb, gl), w, h: h + 4, baseX: px + 1, light, type };
  }

  // Concrete planter with a lit tropical plant.
  function genPlanter(seed) {
    const r = ND.rng(seed);
    const w = r.int(26, 36), bh = r.int(12, 15);
    const plant = ND.genPlant(seed * 7 + 1, true);
    const H = bh + 34;
    const pb = new ND.PB(w + 8, H);
    const P = (c) => ND.pack(c[0], c[1], c[2]);
    for (let y = H - bh; y < H; y++)
      for (let x = 4; x < w + 4; x++) {
        let c = ND.mix(rgb('#b88aa0'), rgb('#5a3a5c'), (y - (H - bh)) / bh);
        if (y === H - bh) c = rgb('#e8c0c8');
        if (x === 4) c = ND.scale(c, 0.8);
        pb.dset(x, y, c, 255, 10);
      }
    const cv = pb.canvas();
    const ctx = cv.getContext('2d');
    ctx.drawImage(plant, Math.round((w + 8) / 2 - 22), H - bh - 40);
    ctx.drawImage(plant, Math.round((w + 8) / 2 - 22) + (r.chance(0.5) ? 6 : -6), H - bh - 36);
    return { c: cv, w: w + 8, h: H };
  }

  // Foreground foliage, authored at half resolution for a defocused look:
  // broad tropical leaves (banana / bird-of-paradise / palmetto) in silhouette,
  // their upper edges catching neon.
  function genBush(seed) {
    const r = ND.rng(seed);
    const w = r.int(70, 120), h = r.int(30, 46);
    const pb = new ND.PB(w, h);
    const fill = rgb('#0b0714'), fill2 = rgb('#120b1e');
    const rim = r.pick([rgb('#b43a8a'), rgb('#7a44c0'), rgb('#d04a78'), rgb('#4a6ad0')]);
    const vein = r.pick([rgb('#3a1440'), rgb('#26164a'), rgb('#44162e')]);
    const n = r.int(6, 11);
    const leaves = [];
    for (let i = 0; i < n; i++) {
      leaves.push({
        bx: r.range(w * 0.2, w * 0.8),
        ang: -Math.PI / 2 + r.range(-1.15, 1.15),
        L: r.range(h * 0.55, h * 1.1),
        W: r.chance(0.6) ? r.range(3.5, 6.5) : r.range(1.5, 2.5),
        droop: r.range(0.1, 0.6),
      });
    }
    leaves.sort((p, q) => q.L - p.L);
    for (const lf of leaves) {
      const pts = [];
      const N = 18;
      const P = (t) => {
        const x = lf.bx + Math.cos(lf.ang) * lf.L * t;
        const y = h - 1 + Math.sin(lf.ang) * lf.L * t + lf.droop * lf.L * t * t;
        return [x, y];
      };
      const side = [];
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        const [x, y] = P(t);
        const [x2, y2] = P(Math.min(1, t + 0.02));
        let tx = x2 - x, ty = y2 - y;
        const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
        const ww = lf.W * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.05)), 0.7);
        pts.push([x - ty * ww, y + tx * ww]);
        side.push([x + ty * ww, y - tx * ww]);
      }
      const poly = pts.concat(side.reverse());
      pb.polyFn(poly, (x, y) => pb.set(x, y, ND.pack(...(ND.hash(x, y, seed) < 0.5 ? fill : fill2))));
      // rim on the upper edge and a midrib
      const upper = Math.sin(lf.ang) < 0 ? (Math.cos(lf.ang) < 0 ? pts : side) : pts;
      for (let i = 1; i < upper.length - 1; i++) {
        const [x, y] = upper[i];
        pb.set(Math.round(x), Math.round(y), ND.pack(...ND.mix(fill2, rim, 0.45 + 0.4 * (i / upper.length))));
      }
      if (lf.W > 3) for (let i = 1; i < N; i++) { const [x, y] = P(i / N); pb.set(Math.round(x), Math.round(y), ND.pack(...vein)); }
    }
    return pb.canvas();
  }

  // Soft pool of light for the ground (dithered ellipse).
  function genPool(w, h, color, strength) {
    const pb = new ND.PB(w, h);
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        const dx = (x - w / 2 + 0.5) / (w / 2), dy = (y - h / 2 + 0.5) / (h / 2);
        const d = dx * dx + dy * dy;
        if (d >= 1) continue;
        const a = Math.pow(1 - d, 1.6) * strength;
        const q = Math.floor(a * 12 + ND.bayer(x, y)) / 12;
        if (q > 0) pb.set(x, y, ND.pack(color[0] * q, color[1] * q, color[2] * q));
      }
    return pb.canvas();
  }

  // Vertical fade used for storefront spill on the sidewalk.
  function genSpill(color) {
    const w = 32, h = 26;
    const pb = new ND.PB(w, h);
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        const ex = Math.min(1, Math.min(x + 1, w - x) / 6);
        const a = Math.pow(1 - y / h, 1.4) * ex * 0.55;
        const q = Math.floor(a * 12 + ND.bayer(x, y)) / 12;
        if (q > 0) pb.set(x, y, ND.pack(color[0] * q, color[1] * q, color[2] * q));
      }
    return pb.canvas();
  }

  // Glow halo sprite (for lamps) into the emissive buffer.
  function genHaloGlow(R, color, k) {
    const S = R * 2;
    const pb = new ND.PB(S, S);
    for (let y = 0; y < S; y++)
      for (let x = 0; x < S; x++) {
        const d = Math.hypot(x - R + 0.5, y - R + 0.5) / R;
        if (d >= 1) continue;
        const a = Math.pow(1 - d, 2.4) * k;
        pb.set(x, y, ND.pack(color[0] * a, color[1] * a, color[2] * a));
      }
    return pb.canvas();
  }

  // Vignette (multiply-style darkening) for the final frame.
  function genVignette(W, H) {
    const pb = new ND.PB(W, H);
    for (let y = 0; y < H; y++)
      for (let x = 0; x < W; x++) {
        const dx = (x - W / 2) / (W / 2), dy = (y - H / 2) / (H / 2);
        const d = Math.sqrt(dx * dx * 0.8 + dy * dy);
        const a = ND.clamp((d - 0.65) * 0.55, 0, 0.5);
        const q = Math.floor(a * 16 + ND.bayer(x, y)) / 16;
        if (q > 0) pb.set(x, y, ND.pack(8, 2, 16, q * 255));
      }
    return pb.canvas();
  }

  ND.genLamp = genLamp;
  ND.genPlanter = genPlanter;
  ND.genBush = genBush;
  ND.genPool = genPool;
  ND.genSpill = genSpill;
  ND.genHaloGlow = genHaloGlow;
  ND.genVignette = genVignette;
})();

/* Neon Drive — world simulation: parallax sequences, pedestrians, traffic, hero car. */
(function () {
  'use strict';
  const ND = window.ND;
  const { W, H, CX, Y, SPEED } = ND;

  // ---------------------------------------------------------------------------
  // Cooperative job queue: heavy sprite generators are JS generators that yield
  // often, so building art is produced in small slices between frames.
  // ---------------------------------------------------------------------------
  class JobQueue {
    constructor() { this.jobs = []; }
    add(gen, done) { const j = { gen, done, finished: false }; this.jobs.push(j); return j; }
    finish(j) {
      if (j.finished) return;
      let r;
      do { r = j.gen.next(); } while (!r.done);
      j.finished = true;
      this.jobs.splice(this.jobs.indexOf(j), 1);
      j.done(r.value);
    }
    run(budgetMs) {
      const t0 = performance.now();
      while (this.jobs.length && performance.now() - t0 < budgetMs) {
        const j = this.jobs[0];
        const r = j.gen.next();
        if (r.done) {
          j.finished = true;
          this.jobs.shift();
          j.done(r.value);
        }
      }
    }
  }
  ND.JobQueue = JobQueue;

  // ---------------------------------------------------------------------------
  // Sequence layer: items laid out right-to-left in a layer coordinate `p`
  // (p = distance of the item's left edge from the layer origin). Screen x of
  // the left edge is round(D*f) + W - p, so everything drifts right as we
  // drive left and new items enter from the left edge.
  // ---------------------------------------------------------------------------
  class Seq {
    constructor(f, make, opts = {}) {
      this.f = f;
      this.make = make;
      this.items = [];
      this.cursor = opts.start != null ? opts.start : -(opts.margin || 80);
      this.margin = opts.margin || 80;
      this.look = opts.lookahead || 0;
      this.script = opts.script ? opts.script.slice() : [];
    }
    shift(D) { return Math.round(D * this.f); }
    x(it, D) { return this.shift(D) + W - it.p; }
    update(D) {
      const s = this.shift(D);
      while (s + W - this.cursor > -this.margin - this.look) {
        const it = this.script.length ? this.script.shift()(this) : this.make(this);
        it.p = this.cursor + it.w;
        this.cursor = it.p + (it.gap || 0);
        this.items.push(it);
        if (it.onSpawn) it.onSpawn(it);
      }
      while (this.items.length && this.x(this.items[0], D) > W + this.margin) {
        const it = this.items.shift();
        if (it.onRemove) it.onRemove(it);
      }
    }
  }
  ND.Seq = Seq;

  // ---------------------------------------------------------------------------
  class World {
    constructor(seed = 1985) {
      this.seed = seed;
      this.r = ND.rng(seed);
      this.tick = 0;
      this.D = 0;
      this.jobs = new JobQueue();
      this.buildCache = new Map();

      this.sky = new ND.Sky(seed + 1);
      this.makePools();
      this.makeSkyline();
      this.makeBuildings();
      this.makeCurb();
      this.makeForeground();
      this.walkers = [];
      this.traffic = [];
      this.hero = {
        body: ND.genHeroCar(),
        wheels: ND.genWheelFrames(),
        x: 206,
        y: Y.CAR - ND.HERO.H + 1,

      this.nextCar = 0;

      while (this.jobs.jobs.length) this.jobs.finish(this.jobs.jobs[0]);

    makePools() {
      const r = ND.rng(this.seed + 7);
      this.people = [];
      for (let i = 0; i < 26; i++) this.people.push(ND.genPerson(r.int(1, 1e9), i % 3 === 0 ? 'sil' : 'lit'));
      this.idlers = [];
      for (let i = 0; i < 18; i++) this.idlers.push(ND.genPerson(r.int(1, 1e9), i % 2 ? 'sil' : 'lit'));
      this.heroWalker = ND.genHeroWalker(4242);
      this.palms = [];
      for (let i = 0; i < 7; i++) this.palms.push(ND.genPalm(r.int(1, 1e9), { h: i < 3 ? r.int(200, 240) : r.int(150, 210) }));
      this.lamps = [ND.genLamp(11, 'globe'), ND.genLamp(12, 'cobra'), ND.genLamp(13, 'globe')];
      this.planters = [];
      for (let i = 0; i < 5; i++) this.planters.push(ND.genPlanter(r.int(1, 1e9)));
      this.bushes = [];
      for (let i = 0; i < 8; i++) this.bushes.push(ND.genBush(r.int(1, 1e9)));
      this.trafficPool = [];
      for (let i = 0; i < 7; i++) this.trafficPool.push(ND.genTraffic(r.int(1, 1e9)));
      this.trafficPool.push(ND.genTraffic(77, { kind: 'coupe' }));
      this.trafficPool[0] = ND.genTraffic(99, { kind: 'coupe', color: [110, 16, 34] });
      this.lampHalo = ND.genHaloGlow(30, [255, 170, 80], 0.55);

    spillFor(c) {

      if (!this.spill[k]) this.spill[k] = ND.genSpill(c);

    }

    // --- skyline ---------------------------------------------------------------
    makeSkyline() {
      const fs = [0.0625, 0.125, 0.25];
      this.skyLayers = fs.map((f, d) => {
        const r = ND.rng(this.seed * 31 + d);
        let bridgeCooldown = 3;
        const T = (w, top, o = {}) => () => ND.genTower(r.int(1, 1e9), d, { w, top, ...o });
        const scripts = {
          1: [T(38, 112, { neon: 'cyan', gap: 6 }), T(44, 66, { neon: 'pink', mode: 'edges', gap: 10 }), T(34, 128, { gap: 22 }),

        };
