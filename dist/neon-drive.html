          }
          return ND.genTower(r.int(1, 1e9), d);
        }, { margin: 60, start: 0, script: scripts[d] || [] });
      });
    }

    // --- street buildings ------------------------------------------------------
    makeBuildings() {
      const r = ND.rng(this.seed * 17 + 3);
      this.bRng = r;
      this.sinceHero = 0;
      const heroHotel = () => ({
        kind: 'hotel', key: 'colony', seed: 1985, w: 252, floors: 4, floorH: 38, groundH: 66, parapetH: 12, crownH: 0,
        pal: ND.PALETTES.lavender, neonA: 'pink', neonB: 'pink', finX: 108, finW: 18,
        blade: 'COLONY', bladeY: 34, bladeLetters: 'cyan', bladeBorder: 'blue', box: 'HOTEL', boxNeon: 'pink',
        canopyNeon: 'pink', store: 'restaurant', neonPalm: 22, litP: 0.35, roofNeon: false,
      });
      const heroBar = () => ({
        kind: 'bar', key: 'bar', seed: 77, w: 156, floors: 2, pal: ND.PALETTES.lilac, neonA: 'cyan', neonB: 'red', sign: 'BAR', store: 'bar', signDX: -6,
      });
      this.heroSpecs = { hotel: heroHotel, bar: heroBar };
      const self = this;
      const spawnSpec = (spec, gap) => (seq) => self.buildingItem(spec, gap);
      this.buildings = new Seq(0.5, () => this.randomBuilding(), {
        margin: 40,
        lookahead: 420,
        start: -30,
        script: [
          () => this.gapItem(240, 0),
          spawnSpec(heroBar(), 2),
          spawnSpec(heroHotel(), 0),
        ],
      });
    }

    pickName(list) {
      const r = this.bRng;
      this.recent = this.recent || [];
      let n;
      for (let k = 0; k < 12; k++) {
        n = r.pick(list);
        if (!this.recent.includes(n)) break;
      }
      this.recent.push(n);
      if (this.recent.length > 8) this.recent.shift();
      return n;
    }

    randomBuilding() {
      const r = this.bRng;
      this.sinceHero++;
      if (this.sinceHero > 18 && r() < 0.3) {
        this.sinceHero = 0;
        return this.buildingItem(this.heroSpecs.hotel(), r.int(0, 3));
      }
      const t = r();
      const gap = r() < 0.75 ? r.int(0, 3) : r.int(8, 22);
      if (t < 0.14) return this.gapItem(r.int(60, 220), 0);
      const seed = r.int(1, 1e9);
      let kind = t < 0.52 ? 'hotel' : t < 0.68 ? 'bar' : t < 0.92 ? 'shop' : 'motel';
      if (kind === this.lastKind && kind !== 'hotel') kind = 'hotel';
      this.sinceMotel = (this.sinceMotel || 0) + 1;
      if (kind === 'motel' && this.sinceMotel < 8) kind = 'shop';
      if (kind === 'motel') this.sinceMotel = 0;
      this.lastKind = kind;
      if (kind === 'hotel') return this.buildingItem({ kind, seed, w: r.int(170, 250), name: r() < 0.8 ? this.pickName(ND.NAMES.hotel) : null }, gap);
      if (kind === 'bar') return this.buildingItem({ kind, seed, w: r.int(120, 170), sign: this.pickName(ND.NAMES.bar) }, gap);
      if (kind === 'shop') return this.buildingItem({ kind, seed, w: r.int(110, 170), sign: this.pickName(ND.NAMES.shop) }, gap);
      return this.buildingItem({ kind, seed, w: r.int(170, 220), sign: r() < 0.7 ? 'MOTEL' : this.pickName(['INN', 'LODGE', 'MOTOR']) }, gap);
    }

    gapItem(w, gap) {
      return { w, gap, isGap: true, data: null, crowd: [], planters: [] };
    }

    buildingItem(spec, gap) {
      const it = { w: spec.w, gap, spec, data: null, crowd: [], planters: [] };
      const key = spec.key;
      const apply = (data) => {
        it.data = data;
        if (key) this.buildCache.set(key, data);
        this.populateBuilding(it);
      };
      if (key && this.buildCache.has(key)) {
        it.data = this.buildCache.get(key);
        it.onSpawn = () => this.populateBuilding(it);
      } else {
        it.job = this.jobs.add(ND.BUILDING_GEN[spec.kind](spec), apply);
      }
      return it;
    }

    populateBuilding(it) {
      const r = ND.rng((it.spec.seed | 0) + this.tick);
      it.crowd = [];
      it.planters = [];
      const d = it.data;
      const busy = d.kind === 'bar' || it.spec.store === 'restaurant' || it.spec.store === 'bar';
      for (const x of d.crowd) {
        if (r() > (busy ? 0.6 : 0.3)) continue;
        const p = r.pick(this.idlers);
        it.crowd.push({ x, p, face: r() < 0.5 ? 'idleR' : 'idleL', ph: r.int(0, 3), rate: r.int(28, 50), y: r.int(0, 3) });
      }
      if (d.kind === 'hotel' && r() < 0.8) {
        const n = r.int(1, 2);
        for (let i = 0; i < n; i++) it.planters.push({ x: r.int(0, it.w - 30), p: r.pick(this.planters) });
      }
      if (it.spec.key === 'colony') {
        it.planters = [{ x: 60, p: this.planters[0] }, { x: 150, p: this.planters[1] }];
      }
    }

    // --- curb: palms & lamps ------------------------------------------------------
    makeCurb() {
      const r = ND.rng(this.seed * 13 + 5);
      const palm = (i, gap) => () => ({ w: 16, gap, type: 'palm', palm: this.palms[i % this.palms.length], ph: r() * 8 });
      const lamp = (i, gap) => () => ({ w: 12, gap, type: 'lamp', lamp: this.lamps[i % this.lamps.length] });
      this.curb = new Seq(0.75, () => {
        const t = r();
        if (t < 0.55) return { w: 16, gap: r.int(40, 150), type: 'palm', palm: r.pick(this.palms), ph: r() * 8 };
        return { w: 12, gap: r.int(40, 120), type: 'lamp', lamp: r.pick(this.lamps) };
      }, {
        margin: 150,
        start: -60,
        script: [palm(3, 70), lamp(2, 88), lamp(0, 106), palm(4, 78), lamp(1, 69), palm(0, 159), palm(1, 60)],
      });
    }

    makeForeground() {
      const r = ND.rng(this.seed * 19 + 11);
      this.fg = new Seq(1.5, () => {
        const b = r.pick(this.bushes);
        return { w: b.width * 2, gap: r.int(-40, 160), img: b, dy: r.int(0, 18) };
      }, { margin: 240, start: -200 });
    }

    // --- pedestrians ----------------------------------------------------------------
    spawnWalker(atX, opts = {}) {
      const r = this.r;
      const lane = opts.lane != null ? opts.lane : r() < 0.5 ? 0 : 1;
      const y = lane === 0 ? 239 + r.int(0, 2) : 245 + r.int(0, 2);
      const f = ND.fAt(y);
      const dir = opts.dir || (r() < 0.5 ? 1 : -1); // +1 walks left (with traffic)
      const v = dir * r.range(0.85, 1.1);
      const x = atX != null ? atX : -40;
      const P = this.D - (x - CX) / f;
      this.walkers.push({ P, v, f, y, dir, sp: opts.sprite || r.pick(this.people), ph: r.int(0, 7), rate: Math.round(8 / Math.abs(v)) });
    }

    initialPopulation() {
      const r = this.r;
      this.spawnWalker(78, { lane: 0, dir: -1, sprite: this.heroWalker });
      this.spawnWalker(250, { lane: 1 });
      this.spawnWalker(420, { lane: 0 });
      this.spawnWalker(560, { lane: 1 });
      this.spawnWalker(20, { lane: 1 });
      // traffic: a dark red coupe just behind the hero car, like the reference
      this.spawnCar({ x: 520, v: SPEED - 0.25, sprite: this.trafficPool[0] });
      this.nextWalker = this.tick + r.int(60, 160);
      this.nextCar = this.tick + r.int(600, 1200);
    }

    // --- traffic ----------------------------------------------------------------------
    spawnCar(opts = {}) {
      const r = this.r;
      const f = ND.fAt(Y.FAR);
      const sprite = opts.sprite || r.pick(this.trafficPool);
      const v = opts.v != null ? opts.v : r() < 0.5 ? SPEED + r.range(0.25, 0.6) : SPEED - r.range(0.25, 0.7);
      let x = opts.x;
      if (x == null) x = v > SPEED ? W + 30 : -sprite.w - 30;
      const P = this.D - (x - CX) / f;
      // keep a safe distance from other cars
      for (const c of this.traffic) if (Math.abs(c.P - P) < 260) return false;
      this.traffic.push({ P, v, f, sp: sprite, wa: 0 });
      return true;
    }

    // --- update -----------------------------------------------------------------------
    update(dtTicks = 1, init = false) {
      if (!init) {
        this.tick++;
        this.D += SPEED;
      }
      const D = this.D;
      for (const l of this.skyLayers) l.update(D);
      this.buildings.update(D);
      this.curb.update(D);
      this.fg.update(D);

      // walkers
      for (const w of this.walkers) w.P += w.v * (init ? 0 : 1);
      this.walkers = this.walkers.filter((w) => {
        const x = CX + (D - w.P) * w.f;
        return x < W + 60 && x > -120;
      });
      if (!init && this.tick >= this.nextWalker) {
        if (this.walkers.length < 10) this.spawnWalker(null);
        this.nextWalker = this.tick + this.r.int(18, 90);
      }

      // traffic
      // car following: never drive into the car ahead (larger P = further along)
      const lane = this.traffic.slice().sort((a, b) => b.P - a.P);
      for (let i = 0; i < lane.length; i++) {
        const me = lane[i];
        if (me.v0 == null) me.v0 = me.v;
        const ahead = lane[i - 1];
        const gap = ahead ? ahead.P - ahead.sp.w / ahead.f - me.P : Infinity;
        if (gap < 60) me.v = Math.min(me.v, ahead.v - 0.05);
        else if (gap < 140) me.v += (Math.min(me.v0, ahead.v) - me.v) * 0.05;
        else me.v += (me.v0 - me.v) * 0.01;
      }
      for (const c of this.traffic) {
        c.P += c.v * (init ? 0 : 1);
        c.wa += c.v / 10;
      }
      this.traffic = this.traffic.filter((c) => {
        const x = CX + (D - c.P) * c.f;
        return x < W + 80 && x > -c.sp.w - 80;
      });
      if (!init && this.tick >= this.nextCar) {
        if (this.traffic.length < 2) this.spawnCar();
        this.nextCar = this.tick + this.r.int(420, 1400);
      }

      // hero car: wheel spin, gentle suspension and drift
      const hero = this.hero;
      hero.angle += SPEED / ND.HERO.WHEEL_R;
      const t = this.tick / 60;
      hero.dx = Math.round(Math.sin(t * 0.13) * 5 + Math.sin(t * 0.041 + 1) * 7);
      const bump = ND.hash(Math.floor(this.tick / 97), 5) < 0.35 && this.tick % 97 < 6;
      hero.bob = bump ? 1 : 0;
    }

    // run a slice of queued generation work
    work(budgetMs) { this.jobs.run(budgetMs); }
  }

  ND.World = World;
})();

</script>
  <script>/* src/renderer.js */
/* Neon Drive — frame renderer: layered composition, emissive buffer, wet-road
 * reflections, bloom and final presentation at integer pixel scale. */
(function () {
  'use strict';
  const ND = window.ND;
  const { W, H, CX, Y } = ND;
  const CURB = Y.CURB;
  const RH = H - CURB;

  function smoothCtx(cv) {
    const x = cv.getContext('2d');
    x.imageSmoothingEnabled = true;
    return x;
  }

  // Mode-7 style ground texture for the road: alpha = how much the asphalt
  // hides the reflection (puddles are nearly transparent = mirror-like).
  function makeRoadTexture(seed) {
    const T = 1024;
    const pb = new ND.PB(T, RH);
    for (let j = 0; j < RH; j++) {
      const y = CURB + j;
      const f = ND.fAt(y);
      const depth = 1 / f;
      for (let u = 0; u < T; u++) {
        const n = (a) => ND.fbm(a / 70, depth * 4.2, 4, seed);
        const k = u / T;
        const nn = n(u) * (1 - k) + n(u - T) * k; // periodic blend
        let a = 0.62;
        const puddle = ND.clamp((nn - 0.5) * 7, 0, 1);
        a = a * (1 - puddle * 0.88);
        let c = [12, 8, 22];
        const g = ND.hash(u, j, seed);
        if (g < 0.06) { c = [38, 30, 52]; a = Math.max(a, 0.55); }
        else if (g > 0.95) { a = Math.max(0, a - 0.2); }
        // gutter along the curb
        if (j < 5) { a = Math.max(a, 0.72 - j * 0.08); c = [10, 6, 16]; }
        // lane dashes
        if (y >= 298 && y <= 300 && u % 72 < 38) {
          c = y === 298 ? [255, 196, 96] : [214, 140, 40];
          a = 0.85;
        }
        pb.set(u, j, ND.pack(c[0], c[1], c[2], a * 255));
      }
    }
    return { canvas: pb.canvas(), T };
  }

  function makeSidewalkTexture(seed) {
    const T = 1024, SH = CURB - Y.BUILD;
    const pb = new ND.PB(T, SH);
    for (let j = 0; j < SH; j++) {
      const t = j / (SH - 1);
      for (let u = 0; u < T; u++) {
        let c = ND.mix([76, 42, 84], [58, 32, 72], t);
        const n = ND.fbm(u / 40, j / 3, 3, seed) - 0.5;
        c = ND.scale(c, 1 + n * 0.25);
        if (u % 48 < 3) c = ND.scale(c, 0.55);        // expansion joints
        if (j === 0) c = ND.scale(c, 0.7);             // building base shadow
        if (ND.hash(u, j, seed) < 0.04) c = ND.scale(c, 1.3);
        pb.dset(u, j, c, 255, 8);
      }
    }
    return { canvas: pb.canvas(), T, SH };
  }

  // Draws a horizontally tiling texture row with ground-plane perspective.
  function mode7Row(ctx, tex, T, row, y, D, f, n = 1) {
    const sw = W / f;
    let u0 = (-D - CX / f) % T;
    if (u0 < 0) u0 += T;
    if (u0 + sw <= T) {
      ctx.drawImage(tex, u0, row, sw, n, 0, y, W, n);
    } else {
      const w1 = T - u0;
      const dx = Math.round(w1 * f);
      ctx.drawImage(tex, u0, row, w1, n, 0, y, dx, n);
      ctx.drawImage(tex, 0, row, sw - w1, n, dx, y, W - dx, n);
    }
  }

  class Renderer {
    constructor(world, opts = {}) {
      this.world = world;
      this.opts = opts;
      this.scene = ND.canvas(W, H);
      this.c = ND.ctx(this.scene);
      this.glowC = ND.canvas(W, H);
      this.g = ND.ctx(this.glowC);

      this.bl = [ND.canvas(W / 2, H / 2), ND.canvas(W / 4, H / 4), ND.canvas(W / 8, Math.ceil(H / 8)), ND.canvas(W / 16, Math.ceil(H / 16))];
      this.blx = this.bl.map(smoothCtx);

      this.K = 1.45;
      this.TOPB = CURB - Math.ceil(RH * this.K) - 8;
      this.BH = CURB - this.TOPB;
      this.upper = ND.canvas(W, this.BH);
      this.upx = ND.ctx(this.upper);
      this.mix = ND.canvas(W, this.BH);
      this.mx = ND.ctx(this.mix);
      this.mb = [ND.canvas(W, Math.ceil(this.BH / 2)), ND.canvas(W, Math.ceil(this.BH / 4)), ND.canvas(W, Math.ceil(this.BH / 8))];
      this.mbx = this.mb.map(smoothCtx);
      this.wet = { ripple: 1, mirror: 1, streak: 1 };
      this.rsrc = ND.canvas(W, this.BH);
      this.rsx = ND.ctx(this.rsrc);
      this.fresnel = (() => {
        const pb = new ND.PB(W, RH);
        for (let j = 0; j < RH; j++)
          for (let x = 0; x < W; x++) {
            const a = ND.clamp(0.12 + (j / RH) * 0.55, 0, 1);
            const q = Math.floor(a * 16 + ND.bayer(x, j)) / 16;
            pb.set(x, j, ND.pack(12, 8, 24, q * 255));
          }
        return pb.canvas();
      })();
      this.refl = ND.canvas(W, RH);
      this.rx = ND.ctx(this.refl);
      this.strip = ND.canvas(W, 26);
      this.sx = ND.ctx(this.strip);

      this.carC = ND.canvas(ND.HERO.W, ND.HERO.H);
      this.carX = ND.ctx(this.carC);
      this.trafC = ND.canvas(162, 48);
      this.trafX = ND.ctx(this.trafC);

      this.road = makeRoadTexture(world.seed + 3);
      this.walk = makeSidewalkTexture(world.seed + 4);
      this.vignette = ND.genVignette(W, H);
      this.vigTop = 110;
      this.vigSide = 190;
      this.haze = this.makeHaze();
      this.bloom = opts.bloom != null ? opts.bloom : 0.62;
      // quality: 2 = full, 1 = coarser ground/reflection rows, 0 = minimal
      this.q = opts.quality != null ? opts.quality : 2;
    }

    makeHaze() {
      const pb = new ND.PB(W, 120);
      for (let y = 0; y < 120; y++)
        for (let x = 0; x < W; x++) {
          const t = y / 119;
          const a = Math.sin(t * Math.PI) * 0.16 + t * 0.06;
          const q = Math.floor(a * 20 + ND.bayer(x, y)) / 20;
          if (q > 0) pb.set(x, y, ND.pack(120, 50, 140, q * 255));
        }
      return pb.canvas();
    }

    // Draw a sprite into the colour buffer; it occludes glow behind it and
    // contributes its own emissive pixels.
    spr(s, x, y) {
      this.c.drawImage(s.c, x, y);
      this.occlude(s.c, x, y);
      if (s.g) this.g.drawImage(s.g, x, y);
    }
    occlude(img, x, y, w, h) {
      const g = this.g;
      g.globalCompositeOperation = 'destination-out';
      if (w) g.drawImage(img, x, y, w, h);
      else g.drawImage(img, x, y);
      g.globalCompositeOperation = 'lighter';
    }

    render() {
      const w = this.world, c = this.c, g = this.g;
      const t = w.tick / 60;
      const R = { c, g, t, tick: w.tick, D: w.D, r: this };
      c.globalCompositeOperation = 'source-over';
      c.globalAlpha = 1;
      g.globalCompositeOperation = 'source-over';
      g.globalAlpha = 1;
      g.clearRect(0, 0, W, H);
      g.globalCompositeOperation = 'lighter';

      w.sky.draw(R);
      this.drawSkyline(R);
      this.drawBuildings(R);
      this.drawSidewalk(R);
      this.drawStreetLife(R);
      this.drawCurb(R);
      this.drawRoad(R);
      this.drawTraffic(R);
      this.drawHero(R);
      this.drawForeground(R);
      this.post(R);
    }

    // ---------------------------------------------------------------------------
    drawSkyline(R) {
      const { c, g } = R;
      const w = this.world;
      w.skyLayers.forEach((layer, d) => {
        for (const it of layer.items) {
          const x = layer.x(it, R.D);
          if (x > W || x + it.w < 0) continue;
          this.spr(it.spr, x, it.y);
          for (const a of it.anims) this.anim(R, a, x, it.y);
        }
        if (d === 1) c.drawImage(this.haze, 0, 128);
      });
      c.globalAlpha = 0.7;
      c.drawImage(this.haze, 0, 150);
      c.globalAlpha = 1;
    }

    anim(R, a, ox, oy) {
      const { c, g, t } = R;
      switch (a.type) {
        case 'blink': {
          const ph = (t / a.period + a.phase) % 1;
          if (ph < 0.12) {
            c.fillStyle = ND.css(a.color);
            c.fillRect(ox + a.x, oy + a.y, 1, 1);
            g.fillStyle = ND.css(a.color, 0.9);
            g.fillRect(ox + a.x - 1, oy + a.y, 3, 1);
            g.fillRect(ox + a.x, oy + a.y - 1, 1, 3);
          }
          break;
        }
        case 'bridgeCars': {
          for (const car of a.cars) {
            let px = (car.off + R.tick * car.v * car.dir) % a.w;
            if (px < 0) px += a.w;
            const x = Math.round(ox + px), y = oy + a.y + (car.dir > 0 ? 1 : 0);
            if (car.dir > 0) {
              c.fillStyle = '#ff3a4a'; c.fillRect(x, y, 2, 1);
              g.fillStyle = 'rgba(255,40,60,0.8)'; g.fillRect(x - 1, y, 4, 1);
            } else {
              c.fillStyle = '#fff4d0'; c.fillRect(x, y, 2, 1);
              g.fillStyle = 'rgba(255,240,200,0.8)'; g.fillRect(x - 1, y, 4, 1);
            }
          }
          break;
        }
        case 'flicker': {
          let off = false;
          if (a.slow) off = Math.floor(t * 0.8 + a.seed) % 2 === 1;
          else {
            const k = Math.floor(t * 12);
            const burst = ND.hash(Math.floor(t * 0.5), a.seed | 0) < a.rate * 4;
            off = burst && ND.hash(k, (a.seed | 0) + 1) < 0.45;
          }
          if (off && a.off) {
            c.drawImage(a.off, ox + a.x, oy + a.y);
            g.globalCompositeOperation = 'destination-out';
            g.fillStyle = '#000';
            g.fillRect(ox + a.x, oy + a.y, a.w, a.h);
            g.globalCompositeOperation = 'lighter';
          }
          break;
        }
        case 'chase': {
          const step = Math.floor(t * a.speed);
          c.fillStyle = ND.css(a.color);
          g.fillStyle = ND.css(a.glow, 0.9);
          for (let i = 0; i < a.pts.length; i++) {
            if ((i + step) % 3) continue;
            const [px, py] = a.pts[i];
            c.fillRect(ox + px, oy + py, 1, 1);
            g.fillRect(ox + px - 1, oy + py, 3, 1);
          }
          break;
        }
        case 'tv': {
          const k = Math.floor(t * 8 + a.seed);
          const v = ND.hash(k, a.seed | 0);
          const col = v < 0.5 ? [90, 140, 255] : v < 0.8 ? [150, 200, 255] : [255, 255, 255];
          c.globalAlpha = 0.35 + v * 0.3;
          c.fillStyle = ND.css(col);
          c.fillRect(ox + a.x, oy + a.y, a.w, a.h);
          c.globalAlpha = 1;
          g.fillStyle = ND.css(col, 0.25);
          g.fillRect(ox + a.x, oy + a.y, a.w, a.h);
          break;
        }
      }
    }

    // ---------------------------------------------------------------------------
    drawBuildings(R) {
      const w = this.world, layer = w.buildings;
      for (const it of layer.items) {
        if (it.isGap) continue;
        const x = layer.x(it, R.D);
        if (x > W || x + it.w < 0) continue;
        if (!it.data) w.jobs.finish(it.job);
        const d = it.data;
        this.spr(d.spr, x, d.y);
        for (const a of d.anims) this.anim(R, a, x, d.y);
      }
    }

    drawSidewalk(R) {
      const { c, g } = R;
      const w = this.world;
      const y0 = Y.BUILD, SH = this.walk.SH;
      // wet reflection source: the bottom of the buildings
      this.sx.clearRect(0, 0, W, 26);
      this.sx.drawImage(this.scene, 0, y0 - 26, W, 26, 0, 0, W, 26);
      const rs = this.q >= 2 ? 1 : 2;
      for (let j = 0; j < SH; j += rs) {
        const y = y0 + j;
        mode7Row(c, this.walk.canvas, this.walk.T, j, y, R.D, ND.fAt(y), Math.min(rs, SH - j));
      }
      // mirrored building bases
      for (let j = 1; j < SH; j++) {
        c.globalAlpha = 0.32 * (1 - j / SH);
        const sy = 25 - Math.floor(j * 1.3);
        if (sy < 0) break;
        c.drawImage(this.strip, 0, sy, W, 1, 0, y0 + j, W, 1);
      }
      c.globalAlpha = 1;
      // storefront light spilling onto the wet pavement
      c.globalCompositeOperation = 'lighter';
      const layer = w.buildings;
      for (const it of layer.items) {
        if (!it.data) continue;
        const x = layer.x(it, R.D);
        if (x > W || x + it.w < 0) continue;
        for (const p of it.data.pools) {
          c.globalAlpha = p.s;
          c.drawImage(w.spillFor(p.c), x + p.x0 - 4, y0, p.x1 - p.x0 + 8, SH);
        }
      }
      c.globalAlpha = 1;
      // lamp pools
      const curb = w.curb;
      for (const it of curb.items) {
        if (it.type !== 'lamp') continue;
        const x = curb.x(it, R.D);
        if (x < -60 || x > W + 60) continue;
        c.drawImage(w.lampPool, x - 45, CURB - 12);
      }
      c.globalCompositeOperation = 'source-over';
    }

    drawStreetLife(R) {
      const { c } = R;
      const w = this.world, layer = w.buildings;
      const FOOT = ND.PERSON.FOOT, FW = ND.PERSON.FW;
      // planters and patio crowds move with the buildings (f = 0.5)
      for (const it of layer.items) {
        if (!it.data || it.isGap) continue;
        const x = layer.x(it, R.D);
        if (x > W + 40 || x + it.w < -40) continue;
        for (const p of it.planters) {
          const img = p.p;
          c.drawImage(img.c, x + p.x, 236 - img.h);
          this.occlude(img.c, x + p.x, 236 - img.h);
        }
        for (const cr of it.crowd) {
          const fr = Math.floor(R.tick / cr.rate + cr.ph) % 4;
          const img = cr.p[cr.face][fr];
          const px = x + cr.x - FW / 2, py = 232 + cr.y - FOOT;
          c.drawImage(img, px, py);
          this.occlude(img, px, py);
        }
      }
      // walkers, back to front
      const walkers = w.walkers.slice().sort((a, b) => a.y - b.y);
      for (const p of walkers) {
        const x = Math.round(CX + (R.D - p.P) * p.f);
        if (x < -30 || x > W + 30) continue;
        const fr = Math.floor(R.tick / p.rate + p.ph) % 8;
        const img = (p.dir > 0 ? p.sp.walkL : p.sp.walkR)[fr];
        c.drawImage(img, x - FW / 2, p.y - FOOT);
        this.occlude(img, x - FW / 2, p.y - FOOT);
      }
    }

    drawCurb(R) {
      const { c, g, t } = R;
      const w = this.world, curb = w.curb;
      const base = CURB - 1;
      for (const it of curb.items) {
        const x = curb.x(it, R.D);
        if (it.type === 'lamp') {
          const L = it.lamp;
          if (x < -40 || x > W + 40) continue;
          const lx = x - L.baseX, ly = base - L.h + 2;
          this.spr(L.spr, lx, ly);
          g.drawImage(w.lampHalo, lx + L.light[0] - 30, ly + L.light[1] - 30);
        } else {
          const P = it.palm;
          if (x < -P.S || x > W + P.S) continue;
          const tx = x - P.bx, ty = base - P.h;
          c.drawImage(P.trunk.c, tx, ty);
          this.occlude(P.trunk.c, tx, ty);
          const fr = Math.floor(t * 2.2 + it.ph) % ND.PALM_FRAMES;
          const img = P.crowns[fr];
          const cx = x + Math.round(P.topDX) - Math.round(P.ccx), cy = ty - Math.round(P.ccy);
          c.drawImage(img, cx, cy);
          this.occlude(img, cx, cy);
        }
      }
      // the curb itself
      c.fillStyle = '#b388c0';
      c.fillRect(0, CURB, W, 1);
      c.fillStyle = '#3a2248';
      c.fillRect(0, CURB + 1, W, 1);
      c.fillStyle = '#1e1028';
      c.fillRect(0, CURB + 2, W, 2);
    }

    // ---------------------------------------------------------------------------
    drawRoad(R) {
      const { c, g, t } = R;
      const wet = this.wet;
      const TOPB = this.TOPB, BH = this.BH;
      // snapshot the band of the upper world that the road can reflect
      this.upx.drawImage(this.scene, 0, TOPB, W, BH, 0, 0, W, BH);
      // mix colour + emissive light, then smear it vertically (wet asphalt
      // scatters reflections into long streaks)
      const mx = this.mx;
      mx.globalCompositeOperation = 'source-over';
      mx.clearRect(0, 0, W, BH);
      mx.globalAlpha = 0.34 * wet.mirror;
      mx.drawImage(this.upper, 0, 0);
      mx.globalCompositeOperation = 'lighter';
      mx.globalAlpha = 1.2 * wet.streak;
      mx.drawImage(this.glowC, 0, TOPB, W, BH, 0, 0, W, BH);
      mx.globalAlpha = 1;
      const mb = this.mb, mbx = this.mbx;
      let src = this.mix;
      for (let i = 0; i < mb.length; i++) {
        mbx[i].clearRect(0, 0, W, mb[i].height);
        mbx[i].drawImage(src, 0, 0, W, src.height, 0, 0, W, mb[i].height);
        src = mb[i];
      }
      const sx = this.rsx;
      sx.globalCompositeOperation = 'source-over';
      sx.globalAlpha = 1;
      sx.fillStyle = '#0c0818';
      sx.fillRect(0, 0, W, BH);
      sx.globalAlpha = 0.16 * wet.mirror;
      sx.drawImage(this.upper, 0, 0);
      sx.globalCompositeOperation = 'lighter';
      this.rsx.imageSmoothingEnabled = true;
      sx.globalAlpha = 1;
      sx.drawImage(mb[2], 0, 0, W, mb[2].height, 0, 0, W, BH);
      sx.globalAlpha = 0.45;
      sx.drawImage(mb[0], 0, 0, W, mb[0].height, 0, 0, W, BH);
      this.rsx.imageSmoothingEnabled = false;
      sx.globalAlpha = 1;
      sx.globalCompositeOperation = 'source-over';

      // mirror it row by row with ripple distortion
      const rx = this.rx;
      rx.globalCompositeOperation = 'source-over';
      rx.fillStyle = '#0c0818';
      rx.fillRect(0, 0, W, RH);
      const K = this.K;
      const rstep = this.q >= 2 ? 1 : 2;
      for (let j = 0; j < RH; j += rstep) {
        const q = j / RH;
        const jit = (ND.noise(j * 0.7, t * 2.2, 5) - 0.5) * 3 * q;
        const sy = CURB - 1 - Math.floor((j + 1) * K + jit) - TOPB;
        if (sy < 0) break;
        const amp = (0.6 + q * 3.2) * wet.ripple;
        const dx = Math.round((ND.noise(j * 0.33, t * 0.9, 9) - 0.5) * 2 * amp + (ND.noise(j * 1.3, t * 3.1, 11) - 0.5) * amp * 0.8);
        rx.drawImage(this.rsrc, 0, sy, W, 1, dx, j, W, rstep);
      }
      // Fresnel: reflections fade as we look more steeply down at the road
      rx.drawImage(this.fresnel, 0, 0);

      c.fillStyle = '#0c0818';
      c.fillRect(0, CURB + 4, W, RH - 4);
      c.drawImage(this.refl, 0, 4, W, RH - 4, 0, CURB + 4, W, RH - 4);
      g.globalAlpha = 0.35;
      g.drawImage(this.refl, 0, 4, W, RH - 4, 0, CURB + 4, W, RH - 4);
      g.globalAlpha = 1;
      // asphalt with ground-plane perspective (puddles let reflections through)
      const ms = this.q >= 2 ? 1 : 2;
      for (let j = 4; j < RH; j += ms) {
        const y = CURB + j;
        mode7Row(c, this.road.canvas, this.road.T, j, y, R.D, ND.fAt(y), Math.min(ms, RH - j));
      }
    }

    // Draws a sprite canvas mirrored below groundY, row by row with ripples.
    reflect(img, x, groundY, h, alpha, t, rows) {
      const c = this.c;
      const n = Math.min(rows || h, H - groundY - 1);
      const st = this.q >= 2 ? 1 : 2;
      for (let k = 0; k < n; k += st) {
        const sy = h - 1 - k;
        if (sy < 0) break;
        const y = groundY + 1 + k;
        const amp = (0.5 + ((y - CURB) / RH) * 2.6) * this.wet.ripple;
        const dx = Math.round((ND.noise(y * 0.33, t * 0.9, 9) - 0.5) * 2 * amp + (ND.noise(y * 1.3, t * 3.1, 11) - 0.5) * amp * 0.8);
        c.globalAlpha = alpha * (1 - k / (n * 1.15));
        c.drawImage(img, 0, sy, img.width, 1, x + dx, y, img.width, st);
      }
      c.globalAlpha = 1;
    }

    drawTraffic(R) {
      const w = this.world;
      const tx = this.trafX;
      for (const car of w.traffic) {
        const x = Math.round(CX + (R.D - car.P) * car.f);
        const S = car.sp;
        if (x > W + 10 || x + S.w < -10) continue;
        tx.clearRect(0, 0, S.w, S.h);
        tx.drawImage(S.body.c, 0, 0);
        const fr = Math.floor(car.wa) % 4;
        for (const [wx, wy] of S.wheels) tx.drawImage(S.wheelFrames[fr], wx - 10, wy - 10);
        const y = Y.FAR - S.ground;
        this.reflect(this.trafC, x, Y.FAR, S.h, 0.3, R.t, 30);
        this.c.drawImage(this.trafC, x, y);
        this.occlude(this.trafC, x, y);
        if (S.body.g) this.g.drawImage(S.body.g, x, y);
        if (S.bar) {
          const on = Math.floor(R.t * 6) % 2;
          const col = on ? '#ff2040' : '#3060ff';
          this.c.fillStyle = col;
          this.c.fillRect(x + S.bar.x + (on ? 0 : 10), y + S.bar.y, 10, 3);
          this.g.fillStyle = col;
          this.g.fillRect(x + S.bar.x + (on ? -4 : 8), y + S.bar.y - 2, 14, 7);
        }
        // tail light streak on the wet road
        this.g.fillStyle = 'rgba(255,30,50,0.35)';
        this.g.fillRect(x + S.w - 6, Y.FAR + 2, 5, 22);
      }
    }

    drawHero(R) {
      const w = this.world, h = w.hero;
      const cx = this.carX, HW = ND.HERO.W, HH = ND.HERO.H;
      cx.clearRect(0, 0, HW, HH);
      cx.drawImage(h.body.c, 0, h.bob);
      const WF = h.wheels;
      const fr = Math.floor(((h.angle % WF.period) + WF.period) % WF.period / WF.period * WF.frames.length) % WF.frames.length;
      for (const [wx, wy] of ND.HERO.WHEELS) cx.drawImage(WF.frames[fr], wx - WF.R, wy - WF.R);
      const x = h.x + (h.dx || 0), y = h.y;
      this.reflect(this.carC, x, Y.CAR, HH, 0.34, R.t, 80);
      this.c.drawImage(this.carC, x, y);
      this.occlude(this.carC, x, y);
      this.g.drawImage(h.body.g, x, y + h.bob);
      // light streaks on the road below tail and marker lights
      const g = this.g;
      g.fillStyle = 'rgba(255,30,50,0.45)';
      g.fillRect(x + 293, Y.CAR + 3, 6, 40);
      g.fillStyle = 'rgba(255,150,30,0.35)';
      g.fillRect(x + 1, Y.CAR + 6, 6, 26);
    }

    drawForeground(R) {
      const w = this.world, fg = w.fg, c = this.c;
      for (const it of fg.items) {
        const x = fg.x(it, R.D);
        if (x > W || x + it.w < 0) continue;
        const img = it.img;
        const y = H - img.height * 2 + 10 + it.dy;
        c.drawImage(img, x, y, img.width * 2, img.height * 2);
        this.occlude(img, x, y, img.width * 2, img.height * 2);
      }
    }

    // ---------------------------------------------------------------------------
    post(R) {
      const c = this.c;
      // bloom: downsample chain, then accumulate back up
      const bl = this.bl, bx = this.blx;
      bx[0].globalCompositeOperation = 'source-over';
      bx[0].clearRect(0, 0, bl[0].width, bl[0].height);
      bx[0].drawImage(this.glowC, 0, 0, bl[0].width, bl[0].height);
      const levels = this.q >= 1 ? bl.length : 3;
      for (let i = 1; i < levels; i++) {
        bx[i].globalCompositeOperation = 'source-over';
        bx[i].clearRect(0, 0, bl[i].width, bl[i].height);
        bx[i].drawImage(bl[i - 1], 0, 0, bl[i].width, bl[i].height);
      }
      for (let i = levels - 1; i > 0; i--) {
        bx[i - 1].globalCompositeOperation = 'lighter';
        bx[i - 1].drawImage(bl[i], 0, 0, bl[i - 1].width, bl[i - 1].height);
      }
      c.imageSmoothingEnabled = true;
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = this.bloom;
      c.drawImage(bl[0], 0, 0, W, H);
      c.globalAlpha = 1;
      c.globalCompositeOperation = 'source-over';
      c.imageSmoothingEnabled = false;
      // vignette: only its non-empty border strips
      const v = this.vignette, vt = this.vigTop, vs = this.vigSide;
      c.drawImage(v, 0, 0, W, vt, 0, 0, W, vt);
      c.drawImage(v, 0, H - vt, W, vt, 0, H - vt, W, vt);
      c.drawImage(v, 0, vt, vs, H - 2 * vt, 0, vt, vs, H - 2 * vt);
      c.drawImage(v, W - vs, vt, vs, H - 2 * vt, W - vs, vt, vs, H - 2 * vt);
    }
  }

  ND.Renderer = Renderer;
})();

</script>
  <script>/* src/main.js */
/* Neon Drive — boot, fixed-step main loop and pixel-perfect presentation. */
(function () {
  'use strict';
  const ND = window.ND;
  const { W, H } = ND;

  const params = new URLSearchParams(location.search);
  const seed = parseInt(params.get('seed') || '1985', 10);
  const debug = params.has('debug');

  const screen = document.getElementById('screen');
  const sctx = screen.getContext('2d', { alpha: false });
  const hud = document.getElementById('hud');
  const stats = document.getElementById('stats');

  let world, renderer;
  let paused = params.has('paused');

  // --- presentation: exact integer scale where possible, otherwise nearest
  // upscale to the next integer and a smooth downscale ("sharp bilinear").
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const cw = window.innerWidth * dpr, ch = window.innerHeight * dpr;
    const s = Math.min(cw / W, ch / H);
    const exact = Math.abs(s - Math.round(s)) < 0.01 && Math.round(s) >= 1;
    const k = exact ? Math.round(s) : Math.max(1, Math.ceil(s));
    screen.width = W * k;
    screen.height = H * k;
    const cssW = (W * (exact ? k : s)) / dpr, cssH = (H * (exact ? k : s)) / dpr;
    screen.style.width = cssW + 'px';
    screen.style.height = cssH + 'px';
    screen.style.imageRendering = exact ? 'pixelated' : 'auto';
    sctx.imageSmoothingEnabled = false;
  }

  function present() {
    sctx.imageSmoothingEnabled = false;
    sctx.drawImage(renderer.scene, 0, 0, screen.width, screen.height);
  }

  // --- fixed 60 Hz simulation; dt snapped to the refresh interval to avoid
  // judder from timer noise.
  const STEP = 1000 / 60;
  let last = 0, acc = 0;
  let frames = 0, fpsT = 0, fps = 0, worst = 0, renderMs = 0;
  // performance bookkeeping (also drives adaptive quality)
  const perf = (ND.perf = { frames: 0, steps: [0, 0, 0, 0, 0, 0, 0], renderMax: 0, renderSum: 0, drops: 0, quality: 2 });
  let win = 0, winDrops = 0, winRender = 0;
  const forcedQ = params.get('q');

  function frame(now) {
    requestAnimationFrame(frame);
    if (!last) last = now;
    let dt = now - last;
    last = now;
    if (dt > 250) dt = STEP;
    const k = Math.round(dt / STEP);
    if (k >= 1 && Math.abs(dt - k * STEP) < 2.2) dt = k * STEP;
    if (!paused) acc += dt;
    let steps = 0;
    while (acc >= STEP - 0.01 && steps < 6) {
      world.update();
      acc -= STEP;
      steps++;
    }
    if (steps >= 6) acc = 0;
    if (steps > 0) {
      const t0 = performance.now();
      renderer.render();
      present();
      renderMs = performance.now() - t0;
      worst = Math.max(worst, renderMs);
    }
    if (!paused) {
      perf.frames++;
      perf.steps[Math.min(6, steps)]++;
      perf.renderMax = Math.max(perf.renderMax, renderMs);
      perf.renderSum += renderMs;
      if (k >= 2 && k < 10) { perf.drops++; winDrops++; }
      win++;
      winRender += renderMs;
      // adaptive quality: step detail down if this machine keeps missing frames
      if (win >= 180) {
        if (forcedQ == null && renderer.q > 0 && (winDrops > 18 || winRender / win > 11)) {
          renderer.q--;
          perf.quality = renderer.q;
          console.log('Neon Drive: quality ->', renderer.q);
        }
        win = winDrops = winRender = 0;
      }
    }
    // background generation of upcoming buildings, within the frame budget
    world.work(Math.max(1, 9 - renderMs));
    frames++;
    if (now - fpsT > 1000) {
      fps = (frames * 1000) / (now - fpsT);
      frames = 0;
      fpsT = now;
      if (debug) stats.textContent = `${fps.toFixed(0)} fps · render ${renderMs.toFixed(1)}ms · worst ${worst.toFixed(1)}ms · jobs ${world.jobs.jobs.length}`;
      worst = 0;
    }
  }

  // --- UI
  let hudTimer = 0;
  function showHud() {
    document.body.classList.remove('idle');
    clearTimeout(hudTimer);
    hudTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
  }
  function toggleFullscreen() {
    const el = document.documentElement;
    try {
      let p;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const fn = el.requestFullscreen || el.webkitRequestFullscreen;
        if (fn) p = fn.call(el);
      } else {
        const fn = document.exitFullscreen || document.webkitExitFullscreen;
        if (fn) p = fn.call(document);
      }
      if (p && p.catch) p.catch(() => {});
    } catch (e) { /* fullscreen not allowed here */ }
  }
  window.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    else if (e.key === ' ') { paused = !paused; e.preventDefault(); }
    else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('nohud');
    else if (e.key === 'd' || e.key === 'D') stats.classList.toggle('show');
    showHud();
  });
  window.addEventListener('mousemove', showHud);
  screen.addEventListener('dblclick', toggleFullscreen);
  window.addEventListener('resize', resize);

  function boot() {
    const t0 = performance.now();
    world = new ND.World(seed);
    renderer = new ND.Renderer(world, { quality: params.get('q') != null ? +params.get('q') : undefined });
    ND.world = world;
    ND.renderer = renderer;
    resize();
    renderer.render();
    present();
    document.body.classList.add('ready');
    if (debug) stats.classList.add('show');
    console.log(`Neon Drive ready in ${(performance.now() - t0).toFixed(0)} ms`);
    showHud();
    requestAnimationFrame(frame);
  }

  // Let the loading text paint before the (synchronous) world build.
  requestAnimationFrame(() => setTimeout(boot, 30));
})();

</script>
